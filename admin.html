<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#141414">
<title>لوحة التحكم - مكسيكاني وبيتسا أم الفحم</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&family=Heebo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --red:#e01a2b;--red-dark:#b3121f;--ink:#141414;--ink-2:#4a4a4a;--muted:#8a8a8a;
  --bg:#f3f1ee;--card:#fff;--line:#e8e8e8;--green:#1a9c53;--amber:#d98300;--blue:#2563eb;
  --shadow:0 2px 12px rgba(0,0,0,.07);--shadow-lg:0 12px 36px rgba(0,0,0,.16);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:'Cairo',system-ui,sans-serif;background:var(--bg);color:var(--ink);padding-bottom:90px}
button,input,select,textarea{font-family:inherit}
button{cursor:pointer;border:none;background:none;color:inherit}
img{display:block;max-width:100%}
.ltr{direction:ltr;unicode-bidi:isolate;display:inline-block}
.wrap{max-width:900px;margin:0 auto;padding:0 12px}

/* دخول */
#login{position:fixed;inset:0;z-index:200;background:#141414;display:grid;place-items:center;padding:20px}
#login .box{background:#fff;border-radius:22px;padding:28px 22px;width:100%;max-width:380px;box-shadow:var(--shadow-lg)}
#login h1{margin:0 0 4px;font-size:22px;font-weight:900;text-align:center}
#login p{margin:0 0 20px;text-align:center;color:var(--muted);font-size:13.5px}
#login .err{background:#fff1f2;color:var(--red-dark);border-radius:11px;padding:11px;font-size:13px;font-weight:700;margin-bottom:12px;display:none;line-height:1.6}

/* رأس */
header{background:#141414;color:#fff;padding:16px 0 0;position:sticky;top:0;z-index:50;box-shadow:0 4px 18px rgba(0,0,0,.14)}
.hrow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:0 12px 12px;max-width:900px;margin:0 auto}
.hrow .t{font-weight:900;font-size:17px;line-height:1.3}
.hrow .t small{display:block;font-weight:600;font-size:11.5px;opacity:.55}
.hbtn{background:rgba(255,255,255,.13);border-radius:10px;padding:8px 13px;font-weight:700;font-size:13px}
.tabs{display:flex;gap:4px;overflow-x:auto;padding:0 12px;max-width:900px;margin:0 auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tb{flex:none;padding:11px 15px;font-weight:700;font-size:14px;color:rgba(255,255,255,.55);border-bottom:3px solid transparent;white-space:nowrap;position:relative}
.tb.on{color:#fff;border-color:var(--red)}
.tb .n{background:var(--red);color:#fff;font-size:10.5px;font-weight:800;border-radius:9px;padding:1px 6px;margin-inline-start:5px;vertical-align:middle}

/* عام */
h2.sec{font-size:18px;font-weight:900;margin:20px 0 12px}
.card{background:var(--card);border-radius:16px;box-shadow:var(--shadow);padding:14px;margin-bottom:11px}
.row{display:flex;align-items:center;gap:11px}
.btn{background:var(--ink);color:#fff;border-radius:12px;padding:12px 18px;font-weight:800;font-size:14.5px;display:inline-flex;align-items:center;gap:7px;justify-content:center}
.btn.red{background:var(--red)} .btn.gh{background:#ececec;color:var(--ink)}
.btn.sm{padding:8px 13px;font-size:13px;border-radius:10px}
.btn.full{width:100%}
.btn:disabled{opacity:.5}
.f{margin-bottom:13px}
.f label{display:block;font-weight:700;font-size:13.5px;margin-bottom:6px}
.f input,.f select,.f textarea{width:100%;border:1.5px solid var(--line);border-radius:11px;padding:11px 12px;font-size:14.5px;outline:none;background:#fff}
.f input:focus,.f select:focus,.f textarea:focus{border-color:var(--ink)}
.f textarea{resize:vertical;min-height:70px}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.f3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:11px}
.muted{color:var(--muted);font-size:13px;line-height:1.7}
.pill{font-size:11px;font-weight:800;padding:3px 9px;border-radius:8px;background:#eee;color:var(--ink-2)}
.pill.g{background:#e6f6ec;color:var(--green)} .pill.r{background:#ffe9eb;color:var(--red)}
.pill.a{background:#fff3e0;color:var(--amber)} .pill.b{background:#e8f0fe;color:var(--blue)}
.empty{text-align:center;padding:50px 20px;color:var(--muted)}
.empty .e{font-size:48px;margin-bottom:12px}
.bar{display:flex;gap:9px;flex-wrap:wrap;align-items:center;margin-bottom:13px}
.bar input[type=search],.bar select{flex:1;min-width:130px;border:1.5px solid var(--line);border-radius:11px;padding:10px 12px;font-size:14px;outline:none;background:#fff}

/* طلبات */
.ord{border-inline-start:5px solid var(--muted)}
.ord.new{border-color:var(--red);background:#fffafa}
.ord.prep{border-color:var(--amber)}
.ord.done{border-color:var(--green)}
.ord.closed{opacity:.6}
.ord .top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:10px}
.ord .who{font-weight:900;font-size:16px}
.ord .when{font-size:12px;color:var(--muted);margin-top:2px}
.ord .tot{font-weight:900;font-size:19px;color:var(--red);white-space:nowrap}
.ord .lines{background:#fafafa;border-radius:11px;padding:11px 12px;font-size:13.5px;line-height:1.85;margin-bottom:10px}
.ord .lines .o{color:var(--muted);font-size:12.5px}
.ord .meta{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:11px;font-size:13px}
.ord .meta a{color:var(--blue);text-decoration:none;font-weight:700}
.ord .acts{display:flex;gap:7px;flex-wrap:wrap}

/* أصناف */
.it{display:flex;gap:11px;align-items:center}
.it .ph{width:62px;height:62px;border-radius:12px;overflow:hidden;flex:none;background:#eee}
.it .ph img{width:100%;height:100%;object-fit:cover}
.it .mid{flex:1;min-width:0}
.it .nm{font-weight:800;font-size:15px}
.it .tags{display:flex;gap:5px;flex-wrap:wrap;margin-top:5px}
.it .pr{font-weight:900;font-size:15px;white-space:nowrap}
.handle{width:36px;height:36px;border-radius:10px;background:#f2f0ee;display:grid;place-items:center;font-size:17px;color:var(--muted);flex:none}
.handle.arm{background:var(--red);color:#fff}
.menu-btn{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;font-size:19px;color:var(--muted);flex:none}

/* نافذة */
.mbg{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:150;display:none}
.mbg.on{display:block}
.modal{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:151;background:var(--bg);border-radius:20px;width:calc(100% - 24px);max-width:520px;max-height:90vh;display:none;flex-direction:column;box-shadow:var(--shadow-lg);overflow:hidden}
.modal.on{display:flex}
.modal .mh{background:#fff;padding:15px 16px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
.modal .mh b{font-size:17px}
.modal .mb{overflow-y:auto;padding:16px;flex:1}
.modal .mf{background:#fff;padding:12px 16px;border-top:1px solid var(--line);display:flex;gap:9px}
.modal .mf .btn{flex:1}

/* صورة */
.imgpick{display:flex;gap:11px;align-items:center;margin-bottom:13px}
.imgpick .pv{width:76px;height:76px;border-radius:13px;background:#eee;overflow:hidden;flex:none;display:grid;place-items:center;font-size:26px;color:#bbb}
.imgpick .pv img{width:100%;height:100%;object-fit:cover}
.imgpick .side{flex:1}

/* خيارات */
.ogrow{display:flex;gap:8px;align-items:center;margin-bottom:8px}
.ogrow input{flex:1;border:1.5px solid var(--line);border-radius:10px;padding:9px 11px;font-size:14px;outline:none}
.ogrow input.d{flex:none;width:86px;text-align:center}
.ogrow .x{width:34px;height:34px;border-radius:9px;background:#ffe9eb;color:var(--red);display:grid;place-items:center;font-size:17px;flex:none}
.chk{display:flex;align-items:center;gap:9px;padding:9px 0;border-top:1px solid var(--line);font-size:14.5px;font-weight:600}
.chk input{width:19px;height:19px;accent-color:var(--red);flex:none}

/* ساعات */
.hrow2{display:grid;grid-template-columns:76px 1fr 1fr 58px;gap:8px;align-items:center;margin-bottom:8px}
.hrow2 .d{font-weight:700;font-size:13.5px}
.hrow2 input{border:1.5px solid var(--line);border-radius:10px;padding:9px;font-size:14px;outline:none;text-align:center}
.hrow2 label{display:flex;align-items:center;gap:5px;font-size:12px;color:var(--muted);font-weight:700}

.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(16px);background:#141414;color:#fff;padding:12px 20px;border-radius:12px;font-weight:700;font-size:14px;z-index:300;opacity:0;pointer-events:none;transition:.25s}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.setup{background:#fff8e1;border:1.5px dashed #e0b73a;color:#7a5c00;border-radius:15px;padding:16px;margin:16px 0;font-size:13.5px;line-height:1.85;font-weight:600}
.setup b{color:#5c4500}
/* ===== إضافات ===== */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:9px;margin-bottom:14px}
.stt{background:var(--card);border-radius:14px;box-shadow:var(--shadow);padding:11px 13px}
.stt .v{font-weight:900;font-size:19px;line-height:1.3}.stt .v small{font-size:12px;color:var(--muted)}
.stt .l{font-size:12px;color:var(--muted);margin-top:2px}
.warnbox{background:#fff3e0;border:1.5px solid var(--amber);color:#8a4b00;border-radius:12px;padding:11px 13px;font-weight:800;font-size:13.5px;margin-bottom:12px}
.bar.prn{gap:7px}
.tg{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:6px 13px;font-weight:800;font-size:12.5px;color:var(--ink-2);cursor:pointer;font-family:inherit}
.tg.on{background:var(--ink);border-color:var(--ink);color:#fff}
.ono{background:var(--ink);color:#fff;border-radius:8px;padding:1px 8px;font-size:14px;margin-inline-end:4px}
.age{display:inline-block;margin-inline-start:6px;font-weight:800;color:var(--ink-2);background:#eee;border-radius:7px;padding:0 7px}
.age.warn{background:#fff3e0;color:var(--amber)}
.age.late{background:var(--red);color:#fff;animation:blink 1.2s infinite}
@keyframes blink{50%{opacity:.55}}
.onote{margin-top:6px;border-top:1px dashed #ddd;padding-top:6px;font-weight:700}
.imgpick2{margin-bottom:14px}
.pv2{width:100%;max-width:400px;margin:0 auto;aspect-ratio:16/10;border-radius:14px;background:#f1efed;border:2px dashed #ddd;overflow:hidden;cursor:pointer;display:grid;place-items:center;transition:border-color .15s}
.pv2.drag{border-color:var(--red);background:#fff5f5}
.pv2 img{width:100%;height:100%;object-fit:cover}
.pv2 .ph0{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:34px;color:#aaa}
.pv2 .ph0 span{font-size:13px;font-weight:700}
.ibtns{display:flex;gap:7px;flex-wrap:wrap;margin-top:9px}
.only-m{display:none}
@media (pointer:coarse){.only-m{display:inline-flex}}
.ihint{font-size:12px;margin-top:6px}
.iurl{margin-top:6px;font-size:12.5px;color:var(--muted)}
.iurl summary{cursor:pointer}
.iurl input{width:100%;margin-top:6px;border:1.5px solid var(--line);border-radius:10px;padding:9px;font-size:13px;outline:none;direction:ltr}
.ogrow .oimg{width:42px;height:42px;flex:none;border-radius:10px;border:1.5px dashed #ccc;background:#fafafa;display:grid;place-items:center;font-size:17px;overflow:hidden;cursor:pointer;padding:0}
.ogrow .oimg img{width:100%;height:100%;object-fit:cover}
.imf{display:flex;gap:11px;align-items:center}
.imfv{flex:none;background:#f1efed;border:2px dashed #ddd;border-radius:13px;overflow:hidden;display:grid;place-items:center;font-size:24px;color:#aaa;cursor:pointer}
.imfv.sq{width:72px;height:72px}
.imfv.wide{width:150px;height:72px}
.imfv img{width:100%;height:100%;object-fit:cover}
.imfb{display:flex;flex-direction:column;gap:6px}
.crop-bg{position:fixed;inset:0;z-index:999;background:rgba(0,0,0,.72);display:grid;place-items:center;padding:16px}
.crop-box{background:#fff;border-radius:20px;padding:16px;max-width:100%;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.4)}
.crop-h{font-weight:900;font-size:17px}
.crop-tip{font-size:12.5px;color:var(--muted);margin:3px 0 12px}
.crop-fr{position:relative;overflow:hidden;margin:0 auto;border-radius:12px;background:#222;cursor:grab;touch-action:none;
  box-shadow:0 0 0 3px var(--red)}
.crop-fr.chk{background:repeating-conic-gradient(#ddd 0 25%,#fff 0 50%) 0 0/16px 16px}
.crop-fr:active{cursor:grabbing}
.crop-fr img{position:absolute;left:0;top:0;max-width:none;user-select:none;pointer-events:none;transform-origin:0 0}
.crop-z{display:flex;align-items:center;gap:10px;margin:14px 4px 4px;font-size:14px}
.crop-z input{flex:1;accent-color:var(--red)}
.crop-a{display:flex;gap:9px;margin-top:12px}
.crop-a .btn{flex:1}
.ogrow{flex-wrap:wrap}
.ogsz{display:none;flex-basis:100%;gap:12px;align-items:center;flex-wrap:wrap;background:#fff7f0;border-radius:10px;padding:7px 10px;margin:0 0 4px 0;font-size:12px;font-weight:700;color:var(--ink-2)}
#gRows.hv .ogsz{display:flex}
.ogsz label{display:flex;align-items:center;gap:6px;flex:1 1 180px;white-space:nowrap}
.ogsz input[type=range]{min-width:70px}
.ogsz label b{min-width:38px;color:var(--red)}
.ogsz input[type=range]{flex:1;accent-color:var(--red);padding:0;border:none}
.ogrow.cur .ogsz{background:#ffe9eb}
.ogprev{display:flex;align-items:center;gap:14px;background:#faf8f6;border-radius:14px;padding:10px;margin-bottom:10px}
.ogprev svg{width:150px;height:150px;flex:none}
.ogpc{font-size:13px;line-height:1.7}.ogpc span{color:var(--muted);font-size:12px}
.crop-q{display:flex;gap:7px;justify-content:center;margin-top:8px}
.hef label{color:#2b5bb5}
.hef input,.hef textarea{background:#f5f8ff}
.ogrow input.lh{flex:1;min-width:110px;background:#f5f8ff}
body.lang-he{font-family:'Heebo','Cairo',system-ui,sans-serif}
.zbar{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0 8px}
.zhint{background:#fff3e0;border:1.5px solid var(--amber);border-radius:12px;padding:10px 12px;font-size:13px;margin-bottom:8px;display:flex;gap:7px;align-items:center;flex-wrap:wrap}
.zmap{height:min(62vh,480px);border-radius:16px;overflow:hidden;background:#e9e6e1;margin-bottom:12px;position:relative;z-index:0}
.zmap.drawing{cursor:crosshair;box-shadow:0 0 0 3px var(--amber)}
.zmap.drawing .leaflet-container,.zmap.drawing.leaflet-container{cursor:crosshair}
.zload{display:grid;place-items:center;height:100%;color:var(--muted);font-weight:700}
.ztip{background:rgba(255,255,255,.92);border:none;box-shadow:0 2px 8px rgba(0,0,0,.2);font-weight:800;font-family:inherit;font-size:12.5px;border-radius:8px}
.zvtx{background:#fff;border:3px solid #111;border-radius:50%;box-shadow:0 1px 4px rgba(0,0,0,.4)}
.zshop{font-size:24px;line-height:30px;text-align:center;filter:drop-shadow(0 2px 3px rgba(0,0,0,.4))}
.zrow.on{box-shadow:0 0 0 2px var(--red)}
.zrow .zh{display:flex;gap:8px;align-items:center;margin-bottom:8px}
.zrow .zh input[type=color]{width:38px;height:38px;border:none;padding:0;background:none;flex:none}
.zrow .zh input:not([type=color]){flex:1;min-width:0;border:1.5px solid var(--line);border-radius:10px;padding:9px 11px;font-size:14px;outline:none}
.zrow .zh .zhe{background:#f5f8ff}
.z4{grid-template-columns:repeat(auto-fit,minmax(120px,1fr))!important}
.zrow .acts{display:flex;gap:7px;flex-wrap:wrap}
.cst .ch{display:flex;gap:11px;align-items:center;cursor:pointer}
.cst .av{width:42px;height:42px;border-radius:50%;background:var(--ink);color:#fff;display:grid;place-items:center;font-weight:900;font-size:17px;flex:none}
.cst .nm{font-weight:900;font-size:15px}
.cst .cs{text-align:center;min-width:58px}.cst .cs b{display:block;font-size:15px}.cst .cs span{font-size:11px;color:var(--muted)}
.cst .cd{margin-top:11px;border-top:1px dashed #e5e5e5;padding-top:10px}
.cst .meta{display:flex;gap:10px;flex-wrap:wrap;align-items:center;font-size:13px}
.cst .meta a{color:var(--blue);font-weight:800}
.ch2{background:#fafafa;border-radius:10px;padding:8px 10px;margin-top:6px;font-size:13px}
.ch2 .top{display:flex;justify-content:space-between;gap:8px;margin-bottom:3px}
.ord .meta a{margin-inline-end:6px}
.ogi{display:flex;align-items:center;gap:6px;border-bottom:1px solid #f1f1f1;transition:background .3s}
.ogi .chk{flex:1;margin:0}
.ogi .mv{width:30px;height:30px;border-radius:8px;background:#f1efed;font-size:12px;flex:none}
.ogi.flash{background:#fff3e0}
.stt .pm{display:inline-block;font-size:13px;margin-inline-end:8px;white-space:nowrap}
.dslot{border:1.5px solid var(--line);border-radius:14px;padding:10px;margin-bottom:10px;background:#fcfbfa}
.dsh{display:flex;flex-wrap:wrap;gap:7px;align-items:center}
.dsh .dn{font-size:13px}
.dsh input.st,.dsh input.sth{flex:1;min-width:120px;border:1.5px solid var(--line);border-radius:10px;padding:8px 10px;font-size:14px;outline:none}
.dsh input.sth{background:#f5f8ff}
.dcount{display:flex;align-items:center;gap:5px;font-size:13px;font-weight:700}
.dcount input{width:62px;border:1.5px solid var(--line);border-radius:10px;padding:8px;text-align:center;font-size:14px}
.dsh .x{width:32px;height:32px;border-radius:9px;background:#ffe9eb;color:var(--red)}
.dsel{margin:6px 0}
.dcat{border-top:1px solid #eee;padding:6px 0}
.dcat summary{cursor:pointer;font-weight:800;font-size:14px;display:flex;align-items:center;gap:6px}
.dcat .chk{margin:4px 18px 0 0}
.subl{padding-inline-start:18px;color:var(--ink-2)}
#dSlots:empty::after{content:'';display:block}
.dayz{display:flex;flex-wrap:wrap;gap:6px}
.dayz label{display:flex;align-items:center;gap:4px;background:#f4f2f0;border-radius:999px;padding:5px 10px;font-size:12.5px;font-weight:700}
.whr{display:flex;flex-wrap:wrap;gap:6px;align-items:center;border:1.5px solid var(--line);border-radius:12px;padding:8px;margin-bottom:8px;background:#fcfbfa}
.whr input,.whr select{border:1.5px solid var(--line);border-radius:9px;padding:7px 9px;font-size:13.5px;outline:none;font-family:inherit}
.whr .wl,.whr .wlh{flex:1;min-width:110px}.whr .wlh{background:#f5f8ff}
.whr .wv{width:70px}.whr .wc{display:flex;align-items:center;gap:4px;font-size:12.5px;font-weight:700}.whr .wch{width:62px}
.whr .x{width:30px;height:30px;border-radius:8px;background:#ffe9eb;color:var(--red)}
.ravg{display:flex;align-items:center;gap:10px;margin-bottom:8px}.ravg b{font-size:30px}
.rs{color:#f5b301;letter-spacing:1px}.rs i{color:#ddd;font-style:normal}
.rv{border-top:1px solid #f0f0f0;padding:8px 0;font-size:13.5px}.rv .top{display:flex;justify-content:space-between;gap:8px;margin-bottom:3px}
</style>
</head>
<body>

<!-- دخول -->
<div id="login">
  <div class="box">
    <h1>لوحة التحكم</h1>
    <p id="loginSub">مكسيكاني وبيتسا أم الفحم</p>
    <div class="err" id="loginErr"></div>
    <div class="f"><label>البريد الإلكتروني</label><input id="lgEmail" type="email" autocomplete="username"></div>
    <div class="f"><label>كلمة المرور</label><input id="lgPass" type="password" autocomplete="current-password"></div>
    <button class="btn red full" id="lgBtn" onclick="doLogin()">دخول</button>
    <button class="btn gh full langsw" style="margin-top:8px" onclick="toggleLang()">עברית</button>
  </div>
</div>

<header>
  <div class="hrow">
    <div class="t">لوحة التحكم<small id="hSub">—</small></div>
    <div style="display:flex;gap:7px"><button class="hbtn langsw" onclick="toggleLang()">עברית</button><button class="hbtn" onclick="doLogout()">خروج</button></div>

    const t = trText(root.nodeValue); if(t !== root.nodeValue) root.nodeValue = t; return;
  }
  if(root.nodeType !== 1) return;
  if(root.closest && root.closest('[data-nt]')) return;
  ['placeholder', 'title', 'aria-label'].forEach(a => {
    const v = root.getAttribute && root.getAttribute(a);
    if(v){ const t = trText(v); if(t !== v) root.setAttribute(a, t); }
  });
  const w = (root.ownerDocument || document).createTreeWalker(root, NodeFilter.SHOW_TEXT | NodeFilter.SHOW_ELEMENT);
  let n;
  while((n = w.nextNode())){
    if(n.nodeType === 1){
      if(n.hasAttribute('data-nt')){ continue; }
      ['placeholder', 'title', 'aria-label'].forEach(a => {
        const v = n.getAttribute(a);
        if(v){ const t = trText(v); if(t !== v) n.setAttribute(a, t); }
      });
    }else if(!(n.parentNode && (n.parentNode.tagName === 'TEXTAREA' || n.parentNode.closest('[data-nt]')))){
      const t = trText(n.nodeValue); if(t !== n.nodeValue) n.nodeValue = t;
    }
  }
}

function normZones(S){
  if(S && Array.isArray(S.zones)) S.zones = S.zones.map(z => Object.assign({}, z,
    {pts: (z.pts || []).map(p => Array.isArray(p) ? [Number(p[0]), Number(p[1])] : [Number(p.lat), Number(p.lng)])}));
  return S;
}

/* صوت التنبيه */
function ding(){
  try{
    const C = window.AudioContext || window.webkitAudioContext;
    const ctx = new C();
    [0,0.22,0.44].forEach(t=>{
      const o=ctx.createOscillator(), g=ctx.createGain();
      o.type='sine'; o.frequency.value = 880;
      o.connect(g); g.connect(ctx.destination);
      g.gain.setValueAtTime(0, ctx.currentTime+t);
      g.gain.linearRampToValueAtTime(.35, ctx.currentTime+t+.02);
      g.gain.exponentialRampToValueAtTime(.001, ctx.currentTime+t+.18);
      o.start(ctx.currentTime+t); o.stop(ctx.currentTime+t+.2);
    });
  }catch(e){}
  if(navigator.vibrate) navigator.vibrate([180,90,180]);
}

/* نقاط الولاء: كل طلب وصل = نقطة. إذا استعمل الهدية بننقص عدد الطلبات المطلوبة */
async function loyCount(o){
  const L = SET.loyalty; if(!L || !L.on) return;
  const k = phKey((o.customer || {}).phone); if(!/^0\d{8,9}$/.test(k)) return;
  const every = Number(L.every) || 10, used = !!(o.customer || {}).reward;
  try{
    await db.collection('loyalty').doc(k).set({count: firebase.firestore.FieldValue.increment(used ? 1 - every : 1)}, {merge:true});
    await db.collection('orders').doc(o.id).update({lp: true});
  }catch(e){ console.error('loyalty', e); }
}
function setStatus(id, s){
  db.collection('orders').doc(id).update({status:s}).catch(e=>alert(e.message));
  // تتبّع الطلب عند الزبون — بيشتغل بس إذا قواعد Firestore فيها track
  const o = ORDERS.find(x => x.id === id);
  db.collection('track').doc(id).set({status:s, no: o ? String(ordNo(o)) : ''}, {merge:true}).catch(() => {});
  if(s === 'done' && o && !o.lp) loyCount(o);
  if(s === 'ready') notifyReady(id);
}
/* رسمة البيتسا للطباعة: بتطلع بس إذا في إضافة على نص */
const clean = t => String(t||'').replace(/[\p{Extended_Pictographic}️‍]/gu,'').trim();
function splitLabels(labels){
  const KEYS = {'نص يمين':['rt','rb'], 'نص يسار':['lt','lb'], 'ربع يمين فوق':['rt'],
                'ربع يسار فوق':['lt'], 'ربع يمين تحت':['rb'], 'ربع يسار تحت':['lb'],
                'חצי ימין':['rt','rb'], 'חצי שמאל':['lt','lb'], 'רבע ימין למעלה':['rt'],
                'רבע שמאל למעלה':['lt'], 'רבע ימין למטה':['rb'], 'רבע שמאל למטה':['lb']};
  const r = {opts:[], all:[], rt:[], lt:[], rb:[], lb:[], half:false, quarter:false};
  (labels||[]).forEach(t => {
    t = String(t);
    if(!t.startsWith('+ ')){ r.opts.push(t); return; }
    t = t.slice(2);
    const m = t.match(/ \(((?:نص|ربع|חצי|רבע) [^)]+)\)$/);
    if(m && KEYS[m[1]]){
      const nm = clean(t.slice(0, m.index));
      KEYS[m[1]].forEach(k => { if(r[k].indexOf(nm) < 0) r[k].push(nm); });
      if(m[1].startsWith('ربع') || m[1].startsWith('רבע')) r.quarter = true; else r.half = true;
    }else r.all.push(clean(t));
  });
  return r;
}
function pizzaPrint(i){
  const s = splitLabels(i.labels);
  if(!s.half && !s.quarter) return null;
  const list = a => a.length ? a.map(x => '<div>' + esc(x) + '</div>').join('') : '<div class="emp">—</div>';
  const top = (s.opts.length ? '<br><small>' + esc(s.opts.join(' · ')) + '</small>' : '') +
    (s.all.length ? '<div class="pall">على كلها: <b>' + esc(s.all.join('، ')) + '</b></div>' : '');
  if(s.quarter) return top + '<div class="pz4">' +
    '<div class="q rt">' + list(s.rt) + '</div><div class="q lt">' + list(s.lt) + '</div>' +
    '<div class="q rb">' + list(s.rb) + '</div><div class="q lb">' + list(s.lb) + '</div></div>';
  const R = s.rt, L = s.lt;
  return top +
    '<div class="pz"><div class="h r"><span class="hl">يمين</span>' + list(R) + '</div>' +
    '<div class="h l"><span class="hl">يسار</span>' + list(L) + '</div></div>';
}

/* ========= رقم الطلب اليومي ========= */
let NUMS = {};
const dayKey = s => { const d = new Date(s); return d.getFullYear() + '-' + (d.getMonth()+1) + '-' + d.getDate(); };
function computeNums(){
  NUMS = {};
  const byDay = {};
  ORDERS.forEach(o => { if(!o.createdAtStr) return; (byDay[dayKey(o.createdAtStr)] = byDay[dayKey(o.createdAtStr)] || []).push(o); });
  Object.values(byDay).forEach(a => {
    a.sort((x,y) => String(x.createdAtStr).localeCompare(String(y.createdAtStr)));
    a.forEach((o,i) => { NUMS[o.id] = i + 1; });
  });
}
const ordNo = o => NUMS[o.id] || '—';

/* ========= عدّاد الوقت ========= */
function prepMax(){
  const n = String(SET.prepTime||'').match(/\d+/g);
  return n ? Number(n[n.length-1]) : 35;
}
function ageHtml(o){
  if(!o.createdAtStr || !['new','prep','ready'].includes(o.status)) return '';
  return `<span class="age" data-t="${esc(o.createdAtStr)}" data-s="${esc(o.status)}"></span>`;
}
function tickAges(){
  const lim = prepMax(), now = Date.now();
  document.querySelectorAll('.age').forEach(el => {
    const m = Math.max(0, Math.floor((now - new Date(el.dataset.t).getTime()) / 60000));
    el.textContent = '⏱ ' + (m < 60 ? m + ' د' : Math.floor(m/60) + ' س ' + (m%60) + ' د');
    el.classList.toggle('late', el.dataset.s !== 'ready' && m >= lim);
    el.classList.toggle('warn', el.dataset.s !== 'ready' && m >= lim - 5 && m < lim);
  });
}

function catName(id){ const c = CATS.find(x=>x.id===id); return c ? (c.icon||'')+' '+c.name : '—'; }
function thumb(it){
  if(it.img) return `<img src="${esc(it.img)}" alt="">`;
  const c = CATS.find(x=>x.id===it.catId);
  return `<div style="width:100%;height:100%;display:grid;place-items:center;font-size:28px">${esc((c&&c.icon)||'🍽️')}</div>`;
}
function renderItems(){
  let list = ITEMS.slice();
  if(qCat) list = list.filter(i => i.catId === qCat);
  if(qItems) list = list.filter(i => (i.name+' '+(i.desc||'')).includes(qItems));
  const head = `
    <h2 class="sec">المنيو <span class="muted">(${ITEMS.length} صنف)</span></h2>
    <div class="bar">
      <input type="search" placeholder="بحث..." value="${esc(qItems)}" oninput="qItems=this.value;renderItems()">
      <select onchange="qCat=this.value;renderItems()">
        <option value="">كل الأقسام</option>
        ${CATS.map(c=>`<option value="${c.id}" ${qCat===c.id?'selected':''}>${esc(c.icon||'')} ${esc(LX(c,'name'))}</option>`).join('')}
      </select>
      <button class="btn sm red" onclick="editItem()">+ صنف جديد</button>
    </div>
    ${armed ? `<div class="setup" style="padding:11px 14px">👆 اضغط ⠿ عند الصنف اللي بدك <b>${esc((ITEMS.find(i=>i.id===armed)||{}).name||'')}</b> يطلع فوقه — أو <button class="btn sm gh" onclick="armed=null;renderItems()">إلغاء</button></div>` : ''}`;
  if(!list.length){ $('vItems').innerHTML = head + `<div class="empty"><div class="e">🍕</div><div>ما في أصناف</div></div>`; return; }
  $('vItems').innerHTML = head + list.map(it => `
    <div class="card"><div class="it">
      <button class="handle ${armed===it.id?'arm':''}" onclick="tapHandle('${it.id}')">⠿</button>
      <div class="ph">${thumb(it)}</div>
      <div class="mid">
        <div class="nm">${esc(LX(it,'name'))}</div>
        <div class="tags">
          <span class="pill">${esc(catName(it.catId))}</span>
          ${it.best?'<span class="pill a">🔥 مميز</span>':''}
          ${it.tag?`<span class="pill a">${esc(it.tag)}</span>`:''}
          ${it.sale&&it.sale<it.price?`<span class="pill r">خصم</span>`:''}
          ${it.available===false?'<span class="pill">غير متوفر</span>':''}
          ${!it.img?'<span class="pill">بدون صورة</span>':''}${it.dealOnly?'<span class="pill b">🎯 بس للعروض</span>':''}
        </div>
      </div>
      <div class="pr">${it.sale&&it.sale<it.price
        ? `<span class="ltr">${it.sale} ₪</span><br><small style="color:#bbb;text-decoration:line-through" class="ltr">${it.price} ₪</small>`
        : `<span class="ltr">${it.price} ₪</span>`}</div>
      <button class="menu-btn" onclick="itemMenu('${it.id}')">⋯</button>
    </div></div>`).join('');
}
function tapHandle(id){
  if(!armed){ armed = id; renderItems(); return; }
  if(armed === id){ armed = null; renderItems(); return; }
  moveAbove(armed, id); armed = null;
}
async function moveAbove(srcId, dstId){
  const src = ITEMS.find(i=>i.id===srcId), dst = ITEMS.find(i=>i.id===dstId);
  if(!src || !dst) return;
  const list = ITEMS.filter(i => i.catId === dst.catId && i.id !== srcId);
  const di = list.findIndex(i => i.id === dstId);
  const before = di > 0 ? Number(list[di-1].order||0) : 0;
  const at = Number(dst.order||0);
  const newOrder = before ? (before + at)/2 : at - 5;
  src.order = newOrder; src.catId = dst.catId;
  ITEMS.sort((a,b)=>(a.order||0)-(b.order||0));
  renderItems();
  try{ await db.collection('items').doc(srcId).update({order:newOrder, catId:dst.catId}); }
  catch(e){ alert(e.message); }
}
function itemMenu(id){
  const it = ITEMS.find(x=>x.id===id); if(!it) return;
  openModal('إجراءات', `
    <button class="btn full gh" style="margin-bottom:9px" onclick="closeModal();editItem('${id}')">✏️ تعديل</button>
    <button class="btn full gh" style="margin-bottom:9px" onclick="toggleAvail('${id}')">${it.available===false?'✅ تفعيل الصنف':'⛔ إيقاف مؤقت'}</button>
    <button class="btn full gh" style="margin-bottom:9px" onclick="toggleBest('${id}')">${it.best?'➖ شيل من الأكثر مبيعاً':'🔥 ضيف للأكثر مبيعاً'}</button>
    <button class="btn full gh" style="margin-bottom:9px" onclick="dupItem('${id}')">📋 نسخة منه</button>
    <button class="btn full" style="background:#ffe9eb;color:var(--red)" onclick="delItem('${id}')">🗑️ حذف</button>`, null);
}
function toggleAvail(id){ const it=ITEMS.find(x=>x.id===id); db.collection('items').doc(id).update({available: it.available===false}); closeModal(); }
function toggleBest(id){ const it=ITEMS.find(x=>x.id===id); db.collection('items').doc(id).update({best: !it.best}); closeModal(); }
async function dupItem(id){
  const it = ITEMS.find(x=>x.id===id); if(!it) return;
  const {id:_, ...rest} = it;
  await db.collection('items').add(Object.assign({}, rest, {name: it.name+' (نسخة)', order:(it.order||0)+1}));
  closeModal(); toast('تم ✓');
}
function delItem(id){
  const it = ITEMS.find(x=>x.id===id);
  if(!confirm('حذف "' + (it?it.name:'') + '" نهائياً؟')) return;
  db.collection('items').doc(id).delete(); closeModal(); toast('تم الحذف');
}

function ogMove(btn, d){
  const row = btn.closest('.ogi'), sib = d < 0 ? row.previousElementSibling : row.nextElementSibling;
  if(!sib) return;
  if(d < 0) row.parentNode.insertBefore(row, sib); else row.parentNode.insertBefore(sib, row);
  row.classList.add('flash'); setTimeout(() => row.classList.remove('flash'), 400);

function ogResetOrder(){

  }).forEach(r => box.appendChild(r));
}

/* ============ محرّك رسم البيتسا (نفس الكود باللوحة والمتجر) ============ */
function seedRand(str){
  let h = 2166136261;
  for(let i = 0; i < str.length; i++){ h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); }
  return () => { h += 0x6D2B79F5; let t = h; t = Math.imul(t ^ t >>> 15, t | 1); t ^= t + Math.imul(t ^ t >>> 7, t | 61); return ((t ^ t >>> 14) >>> 0) / 4294967296; };
}
/* شكل مرسوم لكل إضافة حسب اسمها، بيستعمل بس إذا الإضافة ما إلها صورة */
function toppingKind(label){
  const t = String(label||'');
  if(/زيتون\s*(اسود|أسود)/.test(t)) return 'olB';
  if(/زيتون/.test(t)) return 'olG';
  if(/فطر|مشروم/.test(t)) return 'mush';
  if(/ذر[ةه]/.test(t)) return 'corn';
  if(/بصل/.test(t)) return 'onion';
  if(/هالبينو|حار|حر\b/.test(t) && /فلفل|هالبينو/.test(t)) return 'jal';
  if(/فلفل/.test(t)) return 'pep';
  if(/طون/.test(t)) return 'tuna';
  if(/سلامي|نقانق|سجق|ببروني|بيبروني/.test(t)) return 'sal';
  if(/دجاج|شاورما|فاهيتا/.test(t)) return 'chk';
  if(/كباب|لحم|انتريكوت|إنتريكوت|برقيت|برجيت|بيف|همبرغر/.test(t)) return 'beef';
  if(/جبن/.test(t)) return 'chz';
  if(/بندور|طماط/.test(t)) return 'tom';
  if(/اناناس|أناناس/.test(t)) return 'pine';
  if(/ريحان|سبانخ|جرجير/.test(t)) return 'leaf';
  return 'dot';
}
function pieceSvg(k){
  switch(k){
    case 'olB': return '<circle r="6.5" fill="#1d1a19"/><circle r="2.6" fill="#5c4a3c"/><circle cx="-2.4" cy="-2.6" r="1.3" fill="#fff" opacity=".35"/>';
    case 'olG': return '<circle r="6.5" fill="#6d8a25"/><circle r="2.6" fill="#c44a2c"/><circle cx="-2.4" cy="-2.6" r="1.3" fill="#fff" opacity=".35"/>';
    case 'mush': return '<path d="M-8 1 Q-8 -8 0 -8 Q8 -8 8 1 Z" fill="#d9c1a0" stroke="#a5875f" stroke-width="1"/><rect x="-2.6" y="0" width="5.2" height="7" rx="1.5" fill="#e9d8bd" stroke="#a5875f" stroke-width="1"/>';
    case 'corn': return '<ellipse cx="-3" cy="0" rx="2.6" ry="3.2" fill="#f2c12e"/><ellipse cx="3" cy="-1" rx="2.6" ry="3.2" fill="#f5cc45"/><ellipse cx="0" cy="3.6" rx="2.6" ry="3.2" fill="#e9b522"/>';
    case 'onion': return '<path d="M-8 2 Q0 -9 8 2" fill="none" stroke="#a75b97" stroke-width="2.6" stroke-linecap="round"/><path d="M-5 3 Q0 -4 5 3" fill="none" stroke="#e9d4ea" stroke-width="1.6" stroke-linecap="round"/>';
    case 'pep': return '<path d="M-9 3 Q0 -7 9 3" fill="none" stroke="#2f7d2a" stroke-width="4" stroke-linecap="round"/>';
    case 'jal': return '<circle r="6" fill="#3f8f2f"/><circle r="3.6" fill="#cfe5a5"/><circle cx="1" cy="-1" r=".9" fill="#f5f0c8"/><circle cx="-1.2" cy="1" r=".9" fill="#f5f0c8"/>';
    case 'tuna': return '<path d="M-7 -2 Q-3 -7 3 -5 Q8 -3 6 3 Q2 7 -4 5 Q-9 2 -7 -2 Z" fill="#c9a185" stroke="#a7806a" stroke-width=".8"/>';
    case 'sal': return '<circle r="8.5" fill="#b3302a"/><circle r="8.5" fill="none" stroke="#7d1c18" stroke-width="1"/><circle cx="-3" cy="-2" r="1.3" fill="#f0b3a8"/><circle cx="3" cy="2" r="1.1" fill="#f0b3a8"/><circle cx="2" cy="-4" r=".9" fill="#f0b3a8"/><circle cx="-2" cy="4" r="1" fill="#f0b3a8"/>';
    case 'chk': return '<path d="M-7 -3 L-1 -7 L7 -4 L6 4 L-2 7 L-7 3 Z" fill="#e3b77e" stroke="#b07a3c" stroke-width="1"/><path d="M-4 -2 L3 -3" stroke="#c8935a" stroke-width="1"/>';
    case 'beef': return '<path d="M-7 -4 L0 -7 L7 -3 L6 5 L-3 7 L-7 2 Z" fill="#6e3d22" stroke="#4a2614" stroke-width="1"/><circle cx="-2" cy="-1" r="1.2" fill="#8d5636"/><circle cx="3" cy="2" r="1" fill="#8d5636"/>';
    case 'chz': return '<path d="M-9 0 Q-7 -8 0 -7 Q8 -8 9 0 Q8 8 0 7 Q-8 8 -9 0 Z" fill="#fff4cf" opacity=".95"/>';
    case 'tom': return '<circle r="8" fill="#d9362b"/><circle r="5.6" fill="#ef6a55"/><circle cx="-2" cy="-1" r="1" fill="#f7d26a"/><circle cx="2" cy="1" r="1" fill="#f7d26a"/><circle cx="0" cy="-3" r="1" fill="#f7d26a"/>';
    case 'pine': return '<path d="M-7 -5 L7 -5 L4 6 L-4 6 Z" fill="#f4d35e" stroke="#d8ad2c" stroke-width="1"/>';
    case 'leaf': return '<path d="M-8 0 Q0 -8 8 0 Q0 8 -8 0 Z" fill="#3c8d3a"/><path d="M-7 0 L7 0" stroke="#2a6a28" stroke-width="1"/>';
    default: return '<circle r="6" fill="#e07b39"/><circle r="6" fill="none" stroke="#a9541e" stroke-width="1"/>';
  }
}
function inRegion(x, y, k){
  const g = 5;
  switch(k){
    case 'r':  return x > g;
    case 'l':  return x < -g;
    case 'rt': return x > g && y < -g;
    case 'lt': return x < -g && y < -g;
    case 'rb': return x > g && y > g;
    case 'lb': return x < -g && y > g;
    default:   return true;
  }
}
/* tops: [{key,label,img,reg,ps,pn}] — ps = حجم القطعة، pn = كثافة/كمية */
function pizzaSvgFrom(tops, o){
  o = o || {};
  const idp = o.idp || 'pz', isNew = o.isNew || (() => false);
  const R = 84;
  let defs = '', body = '', n = 0;
  const regs = {};
  tops.forEach(tp => {
    regs[tp.reg] = 1;
    const ps = Math.max(.4, Math.min(2.5, Number(tp.ps) || 1));
    const pn = Math.max(.3, Math.min(3, Number(tp.pn) || 1));
    const rnd = seedRand(tp.key);
    const isQ = tp.reg.length === 2, isH = tp.reg === 'r' || tp.reg === 'l';
    const want = Math.max(1, Math.round((isQ ? 5 : isH ? 8 : 14) * pn)), pts = [];
    const minD = 18 * ps * Math.min(1, 1 / Math.sqrt(pn)), minD2 = minD * minD;
    for(let tries = 0; pts.length < want && tries < 900; tries++){
      const a = rnd() * Math.PI * 2, r = Math.sqrt(rnd()) * (R - 4 * ps);
      const x = Math.cos(a) * r, y = Math.sin(a) * r;
      if(!inRegion(x, y, tp.reg)) continue;
      if(pts.some(p => (p[0]-x)*(p[0]-x) + (p[1]-y)*(p[1]-y) < minD2)) continue;
      pts.push([x, y, rnd() * 360]);
    }
    let g = '';
    const tf = p => '<g transform="translate(' + p[0].toFixed(1) + ' ' + p[1].toFixed(1) + ') rotate(' + p[2].toFixed(0) + ') scale(' + ps.toFixed(2) + ')">';
    if(tp.img){
      const id = idp + 'c' + (n++);
      const png = /^data:image\/(png|webp)|\.png(\?|$)/i.test(tp.img);
      if(!png) defs += '<clipPath id="' + id + '"><circle r="9"/></clipPath>';
      pts.forEach((p,i) => {
        g += tf(p) + '<g class="pc" style="animation-delay:' + (i * 35) + 'ms">' +
          '<image href="' + esc(tp.img) + '" x="-10" y="-10" width="20" height="20" preserveAspectRatio="xMidYMid slice"' +
          (png ? '' : ' clip-path="url(#' + id + ')"') + '/>' +
          (png ? '' : '<circle r="9" fill="none" stroke="rgba(0,0,0,.18)" stroke-width="1"/>') + '</g></g>';
      });
    }else{
      const shape = pieceSvg(toppingKind(tp.label));
      pts.forEach((p,i) => { g += tf(p) + '<g class="pc" style="animation-delay:' + (i * 35) + 'ms">' + shape + '</g></g>'; });
    }
    body += '<g class="tp ' + (isNew(tp) ? 'drop' : '') + '" filter="url(#' + idp + 'sh)">' + g + '</g>';
  });
  const showH = regs.r || regs.l || regs.rt || regs.lt || regs.rb || regs.lb;
  const showQ = regs.rt || regs.lt || regs.rb || regs.lb;
  const guides = (showH ? '<line x1="0" y1="-96" x2="0" y2="96" class="gd"/>' : '') +
                 (showQ ? '<line x1="-96" y1="0" x2="96" y2="0" class="gd"/>' : '');
  const rb = seedRand('base' + (o.seed || '')); let spots = '';
  for(let i = 0; i < 26; i++){
    const a = rb() * 6.283, r = Math.sqrt(rb()) * 88;
    spots += '<ellipse cx="' + (Math.cos(a)*r).toFixed(1) + '" cy="' + (Math.sin(a)*r).toFixed(1) + '" rx="' + (3 + rb()*6).toFixed(1) +
      '" ry="' + (2 + rb()*4).toFixed(1) + '" fill="' + (rb() < .55 ? '#e3a94a' : '#c97a2c') + '" opacity="' + (.25 + rb()*.35).toFixed(2) + '"/>';
  }
  return '<svg viewBox="-120 -120 240 240" aria-label="معاينة البيتسا">' +
    '<defs>' +
      '<radialGradient id="' + idp + 'cr" r=".5"><stop offset=".78" stop-color="#e8b36a"/><stop offset=".9" stop-color="#d4943f"/><stop offset="1" stop-color="#a8692a"/></radialGradient>' +
      '<radialGradient id="' + idp + 'ch" r=".5"><stop offset="0" stop-color="#fbe39a"/><stop offset=".8" stop-color="#f5cf6b"/><stop offset="1" stop-color="#e3a944"/></radialGradient>' +
      '<filter id="' + idp + 'sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="1.2" stdDeviation="1" flood-opacity=".35"/></filter>' +
      '<filter id="' + idp + 'bs" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="5" stdDeviation="5" flood-opacity=".28"/></filter>' +
      '<filter id="' + idp + 'tx"><feTurbulence type="fractalNoise" baseFrequency=".06" numOctaves="2" seed="4"/><feDisplacementMap in="SourceGraphic" scale="9"/></filter>' +
      defs + '</defs>' +
    '<circle r="114" fill="url(#' + idp + 'cr)" filter="url(#' + idp + 'bs)"/>' +

let _lfP = null;
function loadLeaflet(){
  if(window.LF) return Promise.resolve(window.LF);
  if(_lfP) return _lfP;
  _lfP = new Promise((res, rej) => {
    const c = document.createElement('link'); c.rel = 'stylesheet';
    c.href = 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css'; document.head.appendChild(c);
    const s = document.createElement('script');
    s.src = 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js';
    s.onload = () => { window.LF = window.L.noConflict ? window.L.noConflict() : window.L; res(window.LF); };
    s.onerror = () => { _lfP = null; rej(new Error('ما قدرت أحمّل الخريطة — تأكد من الإنترنت')); };
    document.head.appendChild(s);
  });
  return _lfP;
}

function inPoly(pt, poly){
  const x = pt[1], y = pt[0]; let ins = false;
  for(let i = 0, j = poly.length - 1; i < poly.length; j = i++){
    const xi = poly[i][1], yi = poly[i][0], xj = poly[j][1], yj = poly[j][0];
    if(((yi > y) !== (yj > y)) && (x < (xj - xi) * (y - yi) / (yj - yi) + xi)) ins = !ins;
  }
  return ins;
}

/* ========= أداة قص الصورة (سحب + تكبير) ========= */
function loadImgFile(f){
  return new Promise((res, rej) => {
    const isStr = typeof f === 'string';
    const url = isStr ? f : URL.createObjectURL(f), im = new Image();
    if(isStr && !f.startsWith('data:')) im.crossOrigin = 'anonymous';
    im.onload = () => res({im, url});
    im.onerror = () => { if(!isStr) URL.revokeObjectURL(url); rej(new Error(isStr ? 'ما قدرت أفتح الصورة الحالية — اختار الصورة من جديد' : 'الملف مش صورة أو نوعه مش مدعوم')); };
    im.src = url;
  });
}
/* بترجع canvas بالجزء المقصوص، أو null إذا لغى */
async function cropDialog(f, aspect, title){
  const {im, url} = await loadImgFile(f);
  const alpha = typeof f === 'string' ? /^data:image\/(png|webp)|\.png(\?|$)/i.test(f) : /png|webp/i.test(f.type || f.name || '');
  return new Promise(resolve => {
    const W = im.naturalWidth, H = im.naturalHeight;
    const maxW = Math.min(window.innerWidth - 48, 460), maxH = Math.min(window.innerHeight * 0.5, 360);
    let FW = maxW, FH = FW / aspect;
    if(FH > maxH){ FH = maxH; FW = FH * aspect; }
    const s0 = Math.max(FW / W, FH / H);
    const zMin = Math.min(1, Math.min(FW / W, FH / H) / s0);   // تصغير لحد ما الصورة تدخل كلها
    let z = 1, s = s0, ox = (FW - W * s) / 2, oy = (FH - H * s) / 2;

    const wrap = document.createElement('div');
    wrap.className = 'crop-bg';
    wrap.innerHTML = `<div class="crop-box">
      <div class="crop-h">${esc(title || 'ظبّط الصورة')}</div>
      <div class="crop-tip">اسحب الصورة لتختار شو يبيّن، واستعمل الشريط للتكبير</div>
      <div class="crop-fr ${alpha ? 'chk' : ''}" style="width:${FW}px;height:${FH}px"><img alt="" draggable="false"></div>
      <div class="crop-z"><span>➖</span><input type="range" min="${zMin.toFixed(3)}" max="4" step="0.01" value="1"><span>➕</span></div>
      <div class="crop-q">
        <button type="button" class="btn sm gh" data-a="fit">⤢ كلها بالإطار</button>
        <button type="button" class="btn sm gh" data-a="fill">⛶ عبّي الإطار</button>
      </div>
      <div class="crop-a">
        <button type="button" class="btn gh" data-a="x">إلغاء</button>
        <button type="button" class="btn red" data-a="ok">✓ تمام</button>
      </div></div>`;
    document.body.appendChild(wrap);
    const fr = wrap.querySelector('.crop-fr'), img = fr.querySelector('img'), rng = wrap.querySelector('input');
    img.src = url;
    const clamp = () => {
      const iw = W * s, ih = H * s;
      ox = iw >= FW ? Math.min(0, Math.max(FW - iw, ox)) : Math.max(0, Math.min(FW - iw, ox));
      oy = ih >= FH ? Math.min(0, Math.max(FH - ih, oy)) : Math.max(0, Math.min(FH - ih, oy));
    };
    const draw = () => { clamp(); img.style.width = (W * s) + 'px'; img.style.height = (H * s) + 'px'; img.style.transform = `translate(${ox}px,${oy}px)`; };
    const zoomTo = (nz, cx = FW / 2, cy = FH / 2) => {
      nz = Math.max(zMin, Math.min(4, nz));
      const ns = s0 * nz;
      ox = cx - (cx - ox) * ns / s; oy = cy - (cy - oy) * ns / s;
      z = nz; s = ns; rng.value = z; draw();
    };
    draw();
    rng.oninput = () => zoomTo(Number(rng.value));
    // سحب بالماوس أو الإصبع، وتكبير بإصبعين
    const pts = new Map(); let pinch0 = 0, z0 = 1;
    fr.onpointerdown = e => { fr.setPointerCapture(e.pointerId); pts.set(e.pointerId, [e.clientX, e.clientY]);
      if(pts.size === 2){ const [a,b] = [...pts.values()]; pinch0 = Math.hypot(a[0]-b[0], a[1]-b[1]); z0 = z; } };
    fr.onpointermove = e => {
      if(!pts.has(e.pointerId)) return;
      const p = pts.get(e.pointerId);
      if(pts.size === 1){ ox += e.clientX - p[0]; oy += e.clientY - p[1]; draw(); }
      pts.set(e.pointerId, [e.clientX, e.clientY]);
      if(pts.size === 2 && pinch0){ const [a,b] = [...pts.values()]; zoomTo(z0 * Math.hypot(a[0]-b[0], a[1]-b[1]) / pinch0); }
    };
    fr.onpointerup = fr.onpointercancel = e => { pts.delete(e.pointerId); if(pts.size < 2) pinch0 = 0; };
    fr.onwheel = e => { e.preventDefault(); const r = fr.getBoundingClientRect(); zoomTo(z * (e.deltaY < 0 ? 1.08 : 0.93), e.clientX - r.left, e.clientY - r.top); };

    const done = ok => {
      let out = null;
      if(ok){
        const sw = FW / s;
        const ow = Math.max(1, Math.round(Math.min(Math.max(sw, FW), 1600))), oh = Math.max(1, Math.round(ow / aspect));
        const k = ow / FW;   // من بكسل الإطار لبكسل الصورة النهائية
        out = document.createElement('canvas'); out.width = ow; out.height = oh;
        const x = out.getContext('2d');
        if(!alpha){ x.fillStyle = '#fff'; x.fillRect(0, 0, ow, oh); }
        x.imageSmoothingQuality = 'high';
        x.drawImage(im, ox * k, oy * k, W * s * k, H * s * k);
        out._alpha = alpha;
      }
      if(typeof f !== 'string') URL.revokeObjectURL(url); wrap.remove(); resolve(out);
    };
    wrap.querySelector('[data-a="ok"]').onclick = () => done(true);
    wrap.querySelector('[data-a="x"]').onclick = () => done(false);
    wrap.querySelector('[data-a="fit"]').onclick = () => { zoomTo(zMin); ox = (FW - W * s) / 2; oy = (FH - H * s) / 2; draw(); };
    wrap.querySelector('[data-a="fill"]').onclick = () => { zoomTo(1); ox = (FW - W * s) / 2; oy = (FH - H * s) / 2; draw(); };
  });
}
/* تصغير canvas وترميزه */
function encodeCanvas(c, max, q){
  const k = Math.min(1, max / Math.max(c.width, c.height));
  let o = c;
  if(k < 1){
    o = document.createElement('canvas'); o.width = Math.round(c.width * k); o.height = Math.round(c.height * k);
    const x = o.getContext('2d');
    if(!c._alpha){ x.fillStyle = '#fff'; x.fillRect(0, 0, o.width, o.height); }
    x.imageSmoothingQuality = 'high'; x.drawImage(c, 0, 0, o.width, o.height);
  }
  const type = c._alpha ? 'image/png' : 'image/jpeg';
  return new Promise((res, rej) => o.toBlob(b => b ? res({blob:b, data:() => o.toDataURL(type, q)}) : rej(new Error('ما قدرت أجهّز الصورة')), type, q));
}
/* بترجع رابط الصورة بعد القص: Cloudinary إذا مفعّل، وإلا محفوظة داخلياً.
   إذا لغى القص بترجع null */
async function makeImg(f, smallMax, q, aspect, title){
  const c = await cropDialog(f, aspect || 1, title);
  if(!c) return null;
  if(hasCloud()){
    const {blob} = await encodeCanvas(c, 1400, 0.85);
    const fd = new FormData();
    fd.append('file', blob, blob.type === 'image/png' ? 'img.png' : 'img.jpg');
    fd.append('upload_preset', window.CLOUDINARY.preset);
    const r = await fetch('https://api.cloudinary.com/v1_1/' + window.CLOUDINARY.cloudName + '/image/upload', {method:'POST', body:fd});
    const j = await r.json();
    if(!j.secure_url) throw new Error(j.error ? j.error.message : 'فشل الرفع');
    return j.secure_url.replace('/upload/', '/upload/w_' + (smallMax < 400 ? 300 : 900) + ',q_auto,f_auto/');
  }
  let sm = await encodeCanvas(c, smallMax, q), d = sm.data();
  if(d.length > 350000){ sm = await encodeCanvas(c, Math.round(smallMax * 0.7), q * 0.85); d = sm.data(); }
  if(d.length > 350000) throw new Error('الصورة كبيرة كثير حتى بعد التصغير');
  return d;
}

async function handleImg(f){
  if(!f) return;
  if(typeof f !== 'string' && !/^image\//.test(f.type) && !/\.(jpe?g|png|webp|gif|heic)$/i.test(f.name||'')){ alert('اختار صورة'); return; }
  const prev = window._pickImg || '';
  const box = $('pvBox');

}

  const rows = $('gRows'); if(rows) rows.classList.toggle('hv', !!on);
  const pv = $('ogPrev'); if(!pv) return;
  pv.style.display = on ? '' : 'none';
  if(on){ const r = document.querySelector('#gRows .ogrow'); if(r) ogPreview(r); }
}
function ogSz(inp){
  inp.parentNode.querySelector('b').textContent = Math.round(inp.value * 100) + '%';
  ogPreview(inp.closest('.ogrow'));
}
function ogPreview(row){
  const pv = $('ogPrev'); if(!pv || !row) return;
  document.querySelectorAll('#gRows .ogrow.cur').forEach(r => r.classList.remove('cur'));
  row.classList.add('cur');
  const label = row.querySelector('.l').value.trim() || 'إضافة';
  const tp = {key: 'adm:' + label, label, img: row.dataset.img || '', reg: 'f',
              ps: Number(row.querySelector('.ps').value), pn: Number(row.querySelector('.pn').value)};
  pv.innerHTML = pizzaSvgFrom([tp], {idp: 'ad', seed: 'admin'}) +
    `<div class="ogpc"><b>${esc(label)}</b> على البيتسا كاملة<br><span>حرّك الشريطين لحد ما يعجبك الشكل</span></div>`;
}

/* صورة لكل خيار (مشروب، إضافة، حجم...) */
let _ogBtn = null;
function pickOgImg(btn){
  const row = btn.closest('.ogrow');
  if(row.dataset.img){
    const c = prompt('اكتب:\n1 = صورة جديدة\n2 = عدّل القص والحجم\n3 = احذف الصورة', '2');
    if(c === '3'){ row.dataset.img = ''; btn.innerHTML = '📷'; return; }
    if(c === '2'){ ogImgFile(btn, row.dataset.img); return; }
    if(c !== '1') return;
  }
  _ogBtn = btn;
  let inp = $('ogFile');
  if(!inp){
    inp = document.createElement('input'); inp.type = 'file'; inp.accept = 'image/*'; inp.id = 'ogFile'; inp.style.display = 'none';
    inp.onchange = () => { const f = inp.files[0]; inp.value = ''; if(f && _ogBtn) ogImgFile(_ogBtn, f); };
    document.body.appendChild(inp);
  }
  inp.click();
}
async function ogImgFile(btn, f){
  const row = btn.closest('.ogrow');
  btn.innerHTML = '⏳';
  try{
    const url = await makeImg(f, 240, 0.75, 1, 'ظبّط صورة الخيار — للإضافات خلّي القطعة تعبّي المربع');
    if(url === null){ btn.innerHTML = row.dataset.img ? `<img src="${esc(row.dataset.img)}" alt="">` : '📷'; return; }
    row.dataset.img = url;
    btn.innerHTML = `<img src="${esc(url)}" alt="">`;
    if($('gHalves') && $('gHalves').checked) ogPreview(row);
  }catch(e){ btn.innerHTML = row.dataset.img ? `<img src="${esc(row.dataset.img)}" alt="">` : '📷'; alert('ما زبطت: ' + e.message); }
}
async function moveGroup(id, d){
  const i = GROUPS.findIndex(g => g.id === id), j = i + d;
  if(i < 0 || j < 0 || j >= GROUPS.length) return;
  const arr = GROUPS.slice(); [arr[i], arr[j]] = [arr[j], arr[i]];
  GROUPS = arr; render();
  const b = db.batch();
  arr.forEach((g, k) => { g.order = (k + 1) * 10; b.update(db.collection('optionGroups').doc(g.id), {order: g.order}); });
  try{ await b.commit(); }catch(e){ alert(e.message); }
}
async function applyGroupOrder(){
  const idx = id => { const k = GROUPS.findIndex(g => g.id === id); return k < 0 ? 999 : k; };
  const todo = ITEMS.filter(it => (it.opts||[]).length > 1).map(it => {
    const s = (it.opts||[]).slice().sort((x, y) => idx(x) - idx(y));
    return s.join() !== (it.opts||[]).join() ? [it, s] : null;
  }).filter(Boolean);
  if(!todo.length){ toast('كل الأصناف مرتبة ✓'); return; }
  if(!confirm('بنرتّب الخيارات بـ' + todo.length + ' صنف حسب هالترتيب. متأكد؟')) return;
  try{
    for(let k = 0; k < todo.length; k += 400){
      const b = db.batch();
      todo.slice(k, k + 400).forEach(([it, s]) => b.update(db.collection('items').doc(it.id), {opts: s}));
      await b.commit();
    }
    toast('تم ✓ رتّبنا ' + todo.length + ' صنف');
  }catch(e){ alert(e.message); }
}
function delGroup(id){
  const n = ITEMS.filter(i=>(i.opts||[]).includes(id)).length;
  if(!confirm(n ? ('هاي المجموعة مربوطة بـ'+n+' صنف. تحذفها؟') : 'حذف المجموعة؟')) return;
  db.collection('optionGroups').doc(id).delete();
}

    <div class="card">
      <label style="font-weight:800;font-size:15px;display:block;margin-bottom:11px">ساعات الدوام</label>
      ${DAYS.map((nm,d)=>{
        const h = H[d] || H[String(d)] || null;
        return `<div class="hrow2">
          <span class="d">${nm}</span>
          <input id="h${d}a" class="ltr" value="${h?h[0]:''}" placeholder="11:00" ${h?'':'disabled'}>
          <input id="h${d}b" class="ltr" value="${h?h[1]:''}" placeholder="23:30" ${h?'':'disabled'}>
          <label><input type="checkbox" id="h${d}c" ${h?'':'checked'} onchange="togDay(${d},this.checked)">مغلق</label>
        </div>`;}).join('')}
      <div class="muted">لو المطعم بسكّر بعد منتصف الليل اكتب مثلاً <span class="ltr">00:30</span> بخانة السكر.</div>
    </div>
    <div class="card">
      <label style="font-weight:800;font-size:15px;display:block;margin-bottom:11px">بطاقة العرض على الغلاف</label>
      <div class="f"><label>العنوان</label><input id="sHt" value="${esc(SET.heroTitle||'')}" placeholder="خصم 20%"></div>
      <div class="f"><label>السطر الثاني</label><input id="sHs" value="${esc(SET.heroSub||'')}" placeholder="على جميع البيتزا"></div>
      ${heField('sHtHe', SET.heroTitle_he, 'العنوان بالعبري')}
      ${heField('sHsHe', SET.heroSub_he, 'السطر الثاني بالعبري')}
      <div class="muted">خليهن فاضيين إذا ما بدك البطاقة تظهر.</div>
    </div>
    <div class="card">
      <label style="font-weight:800;font-size:15px;display:block;margin-bottom:11px">شرايط العروض (صفحة المعلومات)</label>
      <div class="f2">
        <div class="f"><label>إيموجي 1</label><input id="p0i" value="${esc((SET.promos&&SET.promos[0]&&SET.promos[0].icon)||'🏷️')}" style="text-align:center;font-size:20px"></div>
        <div class="f"><label>النص 1</label><input id="p0t" value="${esc((SET.promos&&SET.promos[0]&&SET.promos[0].text)||'')}"></div>
      </div>
      <div class="f2">
        <div class="f"><label>إيموجي 2</label><input id="p1i" value="${esc((SET.promos&&SET.promos[1]&&SET.promos[1].icon)||'🛵')}" style="text-align:center;font-size:20px"></div>
        <div class="f"><label>النص 2</label><input id="p1t" value="${esc((SET.promos&&SET.promos[1]&&SET.promos[1].text)||'')}"></div>
      </div>
    </div>
    <div class="card">
      <label style="font-weight:800;font-size:15px;display:block;margin-bottom:6px">💳 طرق الدفع</label>
      <div class="muted" style="margin-bottom:8px">علّم الطرق اللي بتقبلها. الزبون بيختار وحدة منهن بالسلة.</div>
      ${(() => { const m = SET.payMethods || {cash:true, card:true}; return Object.keys(PAY_T).map(k =>
        `<label class="chk"><input type="checkbox" id="pm_${k}" ${m[k]?'checked':''}><span>${PAY_T[k]}</span></label>`).join(''); })()}
      <div class="f"><label>📱 رقم Bit (اللي الزبون بحوّل عليه)</label><input id="sBit" inputmode="tel" value="${esc(SET.bitPhone||'')}" placeholder="05xxxxxxxx"></div>
      <div class="f"><label>📲 رابط PayBox (رابط الدفع تبعك)</label><input id="sPaybox" dir="ltr" value="${esc(SET.payboxLink||'')}" placeholder="https://payboxapp.page.link/..."></div>
      <div class="f"><label>🌐 رابط صفحة الدفع أونلاين (من شركة البطاقات)</label><input id="sOnline" dir="ltr" value="${esc(SET.onlineUrl||'')}" placeholder="https://...?sum={sum}">
        <div class="muted" style="margin-top:5px">بتحطه لما تفتح حساب عند Tranzila / Cardcom / PayPlus / Grow. اكتب <b dir="ltr">{sum}</b> مكان المبلغ و<b dir="ltr">{order}</b> مكان رقم الطلب. لحد ما تحطه، خيار "بطاقة أونلاين" ما بيطلع للزبون.</div></div>
    </div>
    <div class="card">
      <label style="font-weight:800;font-size:15px;display:block;margin-bottom:6px">🎁 نقاط الولاء</label>
      <label class="chk"><input type="checkbox" id="lyOn" ${(SET.loyalty||{}).on?'checked':''}><span>تفعيل نقاط الولاء</span></label>
      <div class="f3">
        <div class="f"><label>كل كم طلب؟</label><input id="lyEvery" type="number" min="2" value="${(SET.loyalty||{}).every||10}"></div>
        <div class="f"><label>قيمة الهدية ₪ (خصم)</label><input id="lyVal" type="number" min="0" value="${(SET.loyalty||{}).value||25}"></div>
      </div>
      <div class="f"><label>شو الهدية؟ (بتطلع للزبون)</label><input id="lyTxt" value="${esc((SET.loyalty||{}).text||'')}" placeholder="بيتسا شخصية ببلاش"></div>
      ${heField('lyTxtHe', (SET.loyalty||{}).text_he, 'الهدية بالعبري')}
      <div class="muted">النقطة بتنحسب لما تكبس "🛵 تم التسليم" على الطلب. الزبون بيشوف كرت الختم بحسابه وبالسلة.</div>
    </div>
    <div class="card">
      <label style="font-weight:800;font-size:15px;display:block;margin-bottom:6px">🎡 عجلة الحظ للزبون الجديد</label>
      <label class="chk"><input type="checkbox" id="whOn" ${(SET.wheel||{}).on?'checked':''}><span>تفعيل العجلة (بتطلع أول مرة الزبون بيدخل وبيسجّل)</span></label>
      <div class="muted" style="margin-bottom:8px">إنت بتحدد الجوائز وفرصة كل وحدة. الفرصة نسبية: جائزة فرصتها 50 بتطلع أكثر بـ5 مرات من جائزة فرصتها 10.</div>
      <div id="whRows">${((SET.wheel||{}).prizes && SET.wheel.prizes.length ? SET.wheel.prizes : [
        {label:'خصم 10%', type:'percent', value:10, chance:40}, {label:'مشروب ببلاش', type:'gift', value:0, chance:30},
        {label:'خصم ₪15', type:'fixed', value:15, chance:20}, {label:'حظ أوفر', type:'none', value:0, chance:10}]).map(whRow).join('')}</div>
      <button type="button" class="btn sm gh" onclick="$('whRows').insertAdjacentHTML('beforeend', whRow({}))">+ جائزة</button>
    </div>
    <button class="btn red full" style="margin-bottom:20px" onclick="saveSet()">💾 حفظ الإعدادات</button>`;
}
function whRow(p){
  p = p || {};
  return `<div class="whr">
    <input class="wl" value="${esc(p.label||'')}" placeholder="اسم الجائزة">
    <input class="wlh" value="${esc(p.label_he||'')}" placeholder="🇮🇱 בעברית" dir="rtl" lang="he">
    <select class="wt">${[['percent','خصم %'],['fixed','خصم ₪'],['gift','هدية (صنف ببلاش)'],['none','بدون جائزة']].map(([k,t])=>`<option value="${k}" ${p.type===k?'selected':''}>${t}</option>`).join('')}</select>
    <input class="wv" type="number" min="0" value="${p.value||0}" title="القيمة">
    <label class="wc">فرصة <input class="wch" type="number" min="0" value="${p.chance==null?10:p.chance}"></label>
    <button type="button" class="x" onclick="this.parentNode.remove()">✕</button></div>`;
}
function togDay(d, closed){
  $('h'+d+'a').disabled = closed; $('h'+d+'b').disabled = closed;
  if(closed){ $('h'+d+'a').value=''; $('h'+d+'b').value=''; }
  else{ if(!$('h'+d+'a').value) $('h'+d+'a').value='11:00'; if(!$('h'+d+'b').value) $('h'+d+'b').value='23:30'; }
}
async function saveSet(){
  const hours = {};
  for(let d=0; d<7; d++){
    const closed = $('h'+d+'c').checked;
    const a = val('h'+d+'a'), b = val('h'+d+'b');
    hours[d] = (closed || !a || !b) ? null : [a, b];
  }
  const promos = [];
  [0,1].forEach(i => { const t = val('p'+i+'t'); if(t) promos.push({icon: val('p'+i+'i')||'🏷️', text:t}); });
  const data = {
    name: val('sName'), addr: val('sAddr'), phone: val('sPhone'),
    tagline: val('sTag'), heroTitle: val('sHt'), heroSub: val('sHs'),
    logo: val('sLogo'), cover: val('sCover'),
    deliveryFee: num('sFee'), freeishOver: num('sOver'), reducedFee: num('sRed'),
    minOrder: num('sMin'), prepTime: val('sPrep'),
    name_he: val('sNameHe'), addr_he: val('sAddrHe'), tagline_he: val('sTagHe'), prepTime_he: val('sPrepHe'),
    heroTitle_he: val('sHtHe'), heroSub_he: val('sHsHe'),
    rating: val('sRate'), ratingCount: val('sRateN'),
    hours, promos,
    payMethods: Object.fromEntries(Object.keys(PAY_T).map(k => [k, !!($('pm_' + k) && $('pm_' + k).checked)])),
    bitPhone: val('sBit').replace(/[^\d]/g, ''), payboxLink: val('sPaybox'), onlineUrl: val('sOnline'),
    loyalty: {on: $('lyOn').checked, every: Math.max(2, num('lyEvery') || 10), value: num('lyVal') || 0, text: val('lyTxt'), text_he: val('lyTxtHe')},
    wheel: {on: $('whOn').checked, prizes: [...document.querySelectorAll('#whRows .whr')].map(r => ({
      label: r.querySelector('.wl').value.trim(), label_he: r.querySelector('.wlh').value.trim(), type: r.querySelector('.wt').value,
      value: Number(r.querySelector('.wv').value) || 0, chance: Math.max(0, Number(r.querySelector('.wch').value) || 0)})).filter(p => p.label)}
  };
  if(data.wheel.on && data.wheel.prizes.filter(p => p.chance > 0).length < 2){ alert('العجلة بدها جائزتين على الأقل'); return; }
  if(data.wheel.prizes.some(p => p.type === 'percent' && p.value > 50)){ alert('خصم العجلة لازم يكون 50% أو أقل'); return; }
  if(data.onlineUrl && !/^https:\/\//i.test(data.onlineUrl)){ alert('رابط الدفع لازم يبلّش بـ https://'); return; }
  if(data.payboxLink && !/^https:\/\//i.test(data.payboxLink)){ alert('رابط PayBox لازم يبلّش بـ https://'); return; }
  try{ await db.collection('settings').doc('main').set(data, {merge:true}); toast('تم الحفظ ✓'); }
  catch(e){ alert(e.message); }
}

/* ========= النافذة ========= */
function openModal(title, html, onSave){
  $('mTitle').textContent = title;
  $('mBody').innerHTML = html;
  modalSave = onSave;
  $('mFoot').innerHTML = onSave
    ? `<button class="btn gh" onclick="closeModal()">إلغاء</button><button class="btn red" id="mSave" onclick="doSave()">حفظ</button>`
    : `<button class="btn gh" onclick="closeModal()">إغلاق</button>`;
  $('mbg').classList.add('on'); $('modal').classList.add('on');
}
function closeModal(){
  $('mbg').classList.remove('on'); $('modal').classList.remove('on');
  modalSave = null; window._pickImg = '';
}
async function doSave(){
  if(!modalSave) return closeModal();
  const b = $('mSave'); b.disabled = true; b.textContent = 'جاري الحفظ...';
  try{
    const ok = await modalSave();
    if(ok !== false){ closeModal(); toast('تم ✓'); }
    else { b.disabled = false; b.textContent = 'حفظ'; }
  }catch(e){
    alert('صار خطأ: ' + e.message);
    b.disabled = false; b.textContent = 'حفظ';
  }
}
</script>
</body>
</html>

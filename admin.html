<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#141414">
<title>لوحة التحكم - مكسيكاني وبيتسا أم الفحم</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --red:#e01a2b;--red-dark:#b3121f;--ink:#141414;--ink-2:#4a4a4a;--muted:#8a8a8a;
  --bg:#f3f1ee;--card:#fff;--line:#e8e8e8;--green:#1a9c53;--amber:#d98300;--blue:#2563eb;
  --shadow:0 2px 12px rgba(0,0,0,.07);--shadow-lg:0 12px 36px rgba(0,0,0,.16);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:'Cairo',system-ui,sans-serif;background:var(--bg);color:var(--ink);padding-bottom:90px}
button,input,select,textarea{font-family:inherit}
button{cursor:pointer;border:none;background:none;color:inherit}
img{display:block;max-width:100%}
.ltr{direction:ltr;unicode-bidi:isolate;display:inline-block}
.wrap{max-width:900px;margin:0 auto;padding:0 12px}

/* دخول */
#login{position:fixed;inset:0;z-index:200;background:#141414;display:grid;place-items:center;padding:20px}
#login .box{background:#fff;border-radius:22px;padding:28px 22px;width:100%;max-width:380px;box-shadow:var(--shadow-lg)}
#login h1{margin:0 0 4px;font-size:22px;font-weight:900;text-align:center}
#login p{margin:0 0 20px;text-align:center;color:var(--muted);font-size:13.5px}
#login .err{background:#fff1f2;color:var(--red-dark);border-radius:11px;padding:11px;font-size:13px;font-weight:700;margin-bottom:12px;display:none;line-height:1.6}

/* رأس */
header{background:#141414;color:#fff;padding:16px 0 0;position:sticky;top:0;z-index:50;box-shadow:0 4px 18px rgba(0,0,0,.14)}
.hrow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:0 12px 12px;max-width:900px;margin:0 auto}
.hrow .t{font-weight:900;font-size:17px;line-height:1.3}
.hrow .t small{display:block;font-weight:600;font-size:11.5px;opacity:.55}
.hbtn{background:rgba(255,255,255,.13);border-radius:10px;padding:8px 13px;font-weight:700;font-size:13px}
.tabs{display:flex;gap:4px;overflow-x:auto;padding:0 12px;max-width:900px;margin:0 auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tb{flex:none;padding:11px 15px;font-weight:700;font-size:14px;color:rgba(255,255,255,.55);border-bottom:3px solid transparent;white-space:nowrap;position:relative}
.tb.on{color:#fff;border-color:var(--red)}
.tb .n{background:var(--red);color:#fff;font-size:10.5px;font-weight:800;border-radius:9px;padding:1px 6px;margin-inline-start:5px;vertical-align:middle}

/* عام */
h2.sec{font-size:18px;font-weight:900;margin:20px 0 12px}
.card{background:var(--card);border-radius:16px;box-shadow:var(--shadow);padding:14px;margin-bottom:11px}
.row{display:flex;align-items:center;gap:11px}
.btn{background:var(--ink);color:#fff;border-radius:12px;padding:12px 18px;font-weight:800;font-size:14.5px;display:inline-flex;align-items:center;gap:7px;justify-content:center}
.btn.red{background:var(--red)} .btn.gh{background:#ececec;color:var(--ink)}
.btn.sm{padding:8px 13px;font-size:13px;border-radius:10px}
.btn.full{width:100%}
.btn:disabled{opacity:.5}
.f{margin-bottom:13px}
.f label{display:block;font-weight:700;font-size:13.5px;margin-bottom:6px}
.f input,.f select,.f textarea{width:100%;border:1.5px solid var(--line);border-radius:11px;padding:11px 12px;font-size:14.5px;outline:none;background:#fff}
.f input:focus,.f select:focus,.f textarea:focus{border-color:var(--ink)}
.f textarea{resize:vertical;min-height:70px}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.f3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:11px}
.muted{color:var(--muted);font-size:13px;line-height:1.7}
.pill{font-size:11px;font-weight:800;padding:3px 9px;border-radius:8px;background:#eee;color:var(--ink-2)}
.pill.g{background:#e6f6ec;color:var(--green)} .pill.r{background:#ffe9eb;color:var(--red)}
.pill.a{background:#fff3e0;color:var(--amber)} .pill.b{background:#e8f0fe;color:var(--blue)}
.empty{text-align:center;padding:50px 20px;color:var(--muted)}
.empty .e{font-size:48px;margin-bottom:12px}
.bar{display:flex;gap:9px;flex-wrap:wrap;align-items:center;margin-bottom:13px}
.bar input[type=search],.bar select{flex:1;min-width:130px;border:1.5px solid var(--line);border-radius:11px;padding:10px 12px;font-size:14px;outline:none;background:#fff}

/* طلبات */
.ord{border-inline-start:5px solid var(--muted)}
.ord.new{border-color:var(--red);background:#fffafa}
.ord.prep{border-color:var(--amber)}
.ord.done{border-color:var(--green)}
.ord.closed{opacity:.6}
.ord .top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:10px}
.ord .who{font-weight:900;font-size:16px}
.ord .when{font-size:12px;color:var(--muted);margin-top:2px}
.ord .tot{font-weight:900;font-size:19px;color:var(--red);white-space:nowrap}
.ord .lines{background:#fafafa;border-radius:11px;padding:11px 12px;font-size:13.5px;line-height:1.85;margin-bottom:10px}
.ord .lines .o{color:var(--muted);font-size:12.5px}
.ord .meta{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:11px;font-size:13px}
.ord .meta a{color:var(--blue);text-decoration:none;font-weight:700}
.ord .acts{display:flex;gap:7px;flex-wrap:wrap}

/* أصناف */
.it{display:flex;gap:11px;align-items:center}
.it .ph{width:62px;height:62px;border-radius:12px;overflow:hidden;flex:none;background:#eee}
.it .ph img{width:100%;height:100%;object-fit:cover}
.it .mid{flex:1;min-width:0}
.it .nm{font-weight:800;font-size:15px}
.it .tags{display:flex;gap:5px;flex-wrap:wrap;margin-top:5px}
.it .pr{font-weight:900;font-size:15px;white-space:nowrap}
.handle{width:36px;height:36px;border-radius:10px;background:#f2f0ee;display:grid;place-items:center;font-size:17px;color:var(--muted);flex:none}
.handle.arm{background:var(--red);color:#fff}
.menu-btn{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;font-size:19px;color:var(--muted);flex:none}

/* نافذة */
.mbg{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:150;display:none}
.mbg.on{display:block}
.modal{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:151;background:var(--bg);border-radius:20px;width:calc(100% - 24px);max-width:520px;max-height:90vh;display:none;flex-direction:column;box-shadow:var(--shadow-lg);overflow:hidden}
.modal.on{display:flex}
.modal .mh{background:#fff;padding:15px 16px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
.modal .mh b{font-size:17px}
.modal .mb{overflow-y:auto;padding:16px;flex:1}
.modal .mf{background:#fff;padding:12px 16px;border-top:1px solid var(--line);display:flex;gap:9px}
.modal .mf .btn{flex:1}

/* صورة */
.imgpick{display:flex;gap:11px;align-items:center;margin-bottom:13px}
.imgpick .pv{width:76px;height:76px;border-radius:13px;background:#eee;overflow:hidden;flex:none;display:grid;place-items:center;font-size:26px;color:#bbb}
.imgpick .pv img{width:100%;height:100%;object-fit:cover}
.imgpick .side{flex:1}

/* خيارات */
.ogrow{display:flex;gap:8px;align-items:center;margin-bottom:8px}
.ogrow input{flex:1;border:1.5px solid var(--line);border-radius:10px;padding:9px 11px;font-size:14px;outline:none}
.ogrow input.d{flex:none;width:86px;text-align:center}
.ogrow .x{width:34px;height:34px;border-radius:9px;background:#ffe9eb;color:var(--red);display:grid;place-items:center;font-size:17px;flex:none}
.chk{display:flex;align-items:center;gap:9px;padding:9px 0;border-top:1px solid var(--line);font-size:14.5px;font-weight:600}
.chk input{width:19px;height:19px;accent-color:var(--red);flex:none}

/* ساعات */
.hrow2{display:grid;grid-template-columns:76px 1fr 1fr 58px;gap:8px;align-items:center;margin-bottom:8px}
.hrow2 .d{font-weight:700;font-size:13.5px}
.hrow2 input{border:1.5px solid var(--line);border-radius:10px;padding:9px;font-size:14px;outline:none;text-align:center}
.hrow2 label{display:flex;align-items:center;gap:5px;font-size:12px;color:var(--muted);font-weight:700}

.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(16px);background:#141414;color:#fff;padding:12px 20px;border-radius:12px;font-weight:700;font-size:14px;z-index:300;opacity:0;pointer-events:none;transition:.25s}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.setup{background:#fff8e1;border:1.5px dashed #e0b73a;color:#7a5c00;border-radius:15px;padding:16px;margin:16px 0;font-size:13.5px;line-height:1.85;font-weight:600}
.setup b{color:#5c4500}
/* ===== إضافات ===== */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:9px;margin-bottom:14px}
.stt{background:var(--card);border-radius:14px;box-shadow:var(--shadow);padding:11px 13px}
.stt .v{font-weight:900;font-size:19px;line-height:1.3}.stt .v small{font-size:12px;color:var(--muted)}
.stt .l{font-size:12px;color:var(--muted);margin-top:2px}
.warnbox{background:#fff3e0;border:1.5px solid var(--amber);color:#8a4b00;border-radius:12px;padding:11px 13px;font-weight:800;font-size:13.5px;margin-bottom:12px}
.bar.prn{gap:7px}
.tg{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:6px 13px;font-weight:800;font-size:12.5px;color:var(--ink-2);cursor:pointer;font-family:inherit}
.tg.on{background:var(--ink);border-color:var(--ink);color:#fff}
.ono{background:var(--ink);color:#fff;border-radius:8px;padding:1px 8px;font-size:14px;margin-inline-end:4px}
.age{display:inline-block;margin-inline-start:6px;font-weight:800;color:var(--ink-2);background:#eee;border-radius:7px;padding:0 7px}
.age.warn{background:#fff3e0;color:var(--amber)}
.age.late{background:var(--red);color:#fff;animation:blink 1.2s infinite}
@keyframes blink{50%{opacity:.55}}
.onote{margin-top:6px;border-top:1px dashed #ddd;padding-top:6px;font-weight:700}
.imgpick2{margin-bottom:14px}
.pv2{width:100%;aspect-ratio:16/10;max-height:230px;border-radius:14px;background:#f1efed;border:2px dashed #ddd;overflow:hidden;cursor:pointer;display:grid;place-items:center;transition:border-color .15s}
.pv2.drag{border-color:var(--red);background:#fff5f5}
.pv2 img{width:100%;height:100%;object-fit:cover}
.pv2 .ph0{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:34px;color:#aaa}
.pv2 .ph0 span{font-size:13px;font-weight:700}
.ibtns{display:flex;gap:7px;flex-wrap:wrap;margin-top:9px}
.only-m{display:none}
@media (pointer:coarse){.only-m{display:inline-flex}}
.ihint{font-size:12px;margin-top:6px}
.iurl{margin-top:6px;font-size:12.5px;color:var(--muted)}
.iurl summary{cursor:pointer}
.iurl input{width:100%;margin-top:6px;border:1.5px solid var(--line);border-radius:10px;padding:9px;font-size:13px;outline:none;direction:ltr}
.ogrow .oimg{width:42px;height:42px;flex:none;border-radius:10px;border:1.5px dashed #ccc;background:#fafafa;display:grid;place-items:center;font-size:17px;overflow:hidden;cursor:pointer;padding:0}
.ogrow .oimg img{width:100%;height:100%;object-fit:cover}
.imf{display:flex;gap:11px;align-items:center}
.imfv{flex:none;background:#f1efed;border:2px dashed #ddd;border-radius:13px;overflow:hidden;display:grid;place-items:center;font-size:24px;color:#aaa;cursor:pointer}
.imfv.sq{width:72px;height:72px}
.imfv.wide{width:150px;height:72px}
.imfv img{width:100%;height:100%;object-fit:cover}
.imfb{display:flex;flex-direction:column;gap:6px}
.crop-bg{position:fixed;inset:0;z-index:999;background:rgba(0,0,0,.72);display:grid;place-items:center;padding:16px}
.crop-box{background:#fff;border-radius:20px;padding:16px;max-width:100%;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.4)}
.crop-h{font-weight:900;font-size:17px}
.crop-tip{font-size:12.5px;color:var(--muted);margin:3px 0 12px}
.crop-fr{position:relative;overflow:hidden;margin:0 auto;border-radius:12px;background:#222;cursor:grab;touch-action:none;
  box-shadow:0 0 0 3px var(--red)}
.crop-fr.chk{background:repeating-conic-gradient(#ddd 0 25%,#fff 0 50%) 0 0/16px 16px}
.crop-fr:active{cursor:grabbing}
.crop-fr img{position:absolute;left:0;top:0;max-width:none;user-select:none;pointer-events:none;transform-origin:0 0}
.crop-z{display:flex;align-items:center;gap:10px;margin:14px 4px 4px;font-size:14px}
.crop-z input{flex:1;accent-color:var(--red)}
.crop-a{display:flex;gap:9px;margin-top:12px}
.crop-a .btn{flex:1}
.ogrow{flex-wrap:wrap}
.ogsz{display:none;flex-basis:100%;gap:12px;align-items:center;flex-wrap:wrap;background:#fff7f0;border-radius:10px;padding:7px 10px;margin:0 0 4px 0;font-size:12px;font-weight:700;color:var(--ink-2)}
#gRows.hv .ogsz{display:flex}
.ogsz label{display:flex;align-items:center;gap:6px;flex:1 1 180px;white-space:nowrap}
.ogsz input[type=range]{min-width:70px}
.ogsz label b{min-width:38px;color:var(--red)}
.ogsz input[type=range]{flex:1;accent-color:var(--red);padding:0;border:none}
.ogrow.cur .ogsz{background:#ffe9eb}
.ogprev{display:flex;align-items:center;gap:14px;background:#faf8f6;border-radius:14px;padding:10px;margin-bottom:10px}
.ogprev svg{width:150px;height:150px;flex:none}
.ogpc{font-size:13px;line-height:1.7}.ogpc span{color:var(--muted);font-size:12px}
</style>
</head>
<body>

<!-- دخول -->
<div id="login">
  <div class="box">
    <h1>لوحة التحكم</h1>
    <p id="loginSub">مكسيكاني وبيتسا أم الفحم</p>
    <div class="err" id="loginErr"></div>
    <div class="f"><label>البريد الإلكتروني</label><input id="lgEmail" type="email" autocomplete="username"></div>
    <div class="f"><label>كلمة المرور</label><input id="lgPass" type="password" autocomplete="current-password"></div>
    <button class="btn red full" id="lgBtn" onclick="doLogin()">دخول</button>
  </div>
</div>

<header>
  <div class="hrow">
    <div class="t">لوحة التحكم<small id="hSub">—</small></div>
    <button class="hbtn" onclick="doLogout()">خروج</button>
  </div>
  <div class="tabs">
    <button class="tb on" data-v="orders"  onclick="tab('orders')">🧾 الطلبات<span class="n" id="nNew" style="display:none">0</span></button>
    <button class="tb"    data-v="items"   onclick="tab('items')">🍕 المنيو</button>
    <button class="tb"    data-v="cats"    onclick="tab('cats')">🗂️ الأقسام</button>
    <button class="tb"    data-v="groups"  onclick="tab('groups')">⚙️ الخيارات</button>
    <button class="tb"    data-v="deals"   onclick="tab('deals')">🎯 العروض</button>
    <button class="tb"    data-v="cpn"     onclick="tab('cpn')">🎟️ الكوبونات</button>
    <button class="tb"    data-v="set"     onclick="tab('set')">🏪 الإعدادات</button>
  </div>
</header>

<div class="wrap">
  <div id="setupBox"></div>
  <div id="vOrders"></div>
  <div id="vItems"  style="display:none"></div>
  <div id="vCats"   style="display:none"></div>
  <div id="vGroups" style="display:none"></div>
  <div id="vDeals"  style="display:none"></div>
  <div id="vCpn"    style="display:none"></div>
  <div id="vSet"    style="display:none"></div>
</div>

<div class="mbg" id="mbg" onclick="closeModal()"></div>
<div class="modal" id="modal">
  <div class="mh"><b id="mTitle">—</b><button onclick="closeModal()" style="font-size:19px">✕</button></div>
  <div class="mb" id="mBody"></div>
  <div class="mf" id="mFoot"></div>
</div>
<div class="toast" id="toast"></div>

<script src="firebase-config.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
/* ========= الحالة (كلها هون — لا تنقل let لتحت) ========= */
let db = null, auth = null;
let SET = Object.assign({}, (window.FALLBACK || {}));
let CATS = [], ITEMS = [], GROUPS = [], DEALS = [], ORDERS = [], CPNS = [];
let view = 'orders';
let qItems = '', qCat = '';
let ordFilter = 'live';
let armed = null;            // الصنف المحدد للتحريك
let lastNewCount = 0;
let firstOrdersLoad = true;
let modalSave = null;

const DAYS = ['الأحد','الإثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'];
const esc = s => String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money = n => '⁦' + Number(n||0).toFixed(2) + ' ₪⁩';
const $ = id => document.getElementById(id);
const val = id => ($(id) ? $(id).value.trim() : '');
const num = id => Number(val(id) || 0);

function toast(m){ const t=$('toast'); t.textContent=m; t.classList.add('on'); setTimeout(()=>t.classList.remove('on'),2200); }

/* ========= بدء ========= */
function configFilled(){
  const c = window.FB_CONFIG;
  return !!(c && c.apiKey && c.projectId && !/ضع_المفتاح/.test(c.apiKey) && !/اسم-المشروع/.test(c.projectId));
}
if(!configFilled()){
  $('loginErr').style.display = 'block';
  $('loginErr').innerHTML = '⚠️ <b>Firebase مش مربوط بعد.</b><br>افتح ملف <code>firebase-config.js</code> وحط المفاتيح، وبعدين ارفعه على GitHub.';
  $('lgBtn').disabled = true;
}else if(typeof firebase === 'undefined'){
  $('loginErr').style.display = 'block';
  $('loginErr').innerHTML = '⚠️ <b>ما قدرنا نحمّل مكتبة Firebase.</b><br>تأكد إنك متصل بالإنترنت وحدّث الصفحة.';
  $('lgBtn').disabled = true;
}else{
  try{
    firebase.initializeApp(window.FB_CONFIG);
    auth = firebase.auth();
    db = firebase.firestore();
    auth.onAuthStateChanged(u => { if(u) onLogin(u); else $('login').style.display='grid'; });
  }catch(err){
    console.error(err);
    $('loginErr').style.display = 'block';
    $('loginErr').textContent = 'صار خطأ بالاتصال: ' + err.message;
    $('lgBtn').disabled = true;
  }
}

function doLogin(){
  const e = val('lgEmail'), p = val('lgPass');
  if(!e || !p){ showErr('اكتب البريد وكلمة المرور'); return; }
  $('lgBtn').disabled = true; $('lgBtn').textContent = 'جاري الدخول...';
  auth.signInWithEmailAndPassword(e,p).catch(err => {
    $('lgBtn').disabled = false; $('lgBtn').textContent = 'دخول';
    const m = {
      'auth/invalid-credential':'البريد أو كلمة المرور غلط',
      'auth/wrong-password':'كلمة المرور غلط',
      'auth/user-not-found':'ما في حساب بهاض البريد',
      'auth/invalid-email':'صيغة البريد غلط',
      'auth/too-many-requests':'محاولات كثيرة — استنى شوي وجرب كمان مرة',
      'auth/network-request-failed':'ما في اتصال بالإنترنت'
    }[err.code] || err.message;
    showErr(m);
  });
}
function showErr(m){ const el=$('loginErr'); el.style.display='block'; el.textContent=m; }
function doLogout(){ if(auth) auth.signOut().then(()=>location.reload()); }
document.addEventListener('keydown', e => {
  if(e.key === 'Enter' && $('login').style.display !== 'none') doLogin();
});

function onLogin(u){
  $('login').style.display = 'none';
  $('hSub').textContent = u.email;

  db.collection('settings').doc('main').onSnapshot(d => {
    if(d.exists) SET = Object.assign({}, window.FALLBACK, d.data());
    checkSetup(); if(view==='set') render();
  });
  db.collection('categories').onSnapshot(s => {
    CATS = s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(a.order||0)-(b.order||0));
    checkSetup(); render();
  });
  db.collection('items').onSnapshot(s => {
    ITEMS = s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(a.order||0)-(b.order||0));
    checkSetup(); render();

/* صوت التنبيه */
function ding(){
  try{
    const C = window.AudioContext || window.webkitAudioContext;
    const ctx = new C();
    [0,0.22,0.44].forEach(t=>{
      const o=ctx.createOscillator(), g=ctx.createGain();
      o.type='sine'; o.frequency.value = 880;
      o.connect(g); g.connect(ctx.destination);
      g.gain.setValueAtTime(0, ctx.currentTime+t);
      g.gain.linearRampToValueAtTime(.35, ctx.currentTime+t+.02);
      g.gain.exponentialRampToValueAtTime(.001, ctx.currentTime+t+.18);
      o.start(ctx.currentTime+t); o.stop(ctx.currentTime+t+.2);
    });
  }catch(e){}
  if(navigator.vibrate) navigator.vibrate([180,90,180]);
}

/* رسمة البيتسا للطباعة: بتطلع بس إذا في إضافة على نص */
const clean = t => String(t||'').replace(/[\p{Extended_Pictographic}️‍]/gu,'').trim();
function splitLabels(labels){
  const KEYS = {'نص يمين':['rt','rb'], 'نص يسار':['lt','lb'], 'ربع يمين فوق':['rt'],
                'ربع يسار فوق':['lt'], 'ربع يمين تحت':['rb'], 'ربع يسار تحت':['lb']};
  const r = {opts:[], all:[], rt:[], lt:[], rb:[], lb:[], half:false, quarter:false};
  (labels||[]).forEach(t => {
    t = String(t);
    if(!t.startsWith('+ ')){ r.opts.push(t); return; }
    t = t.slice(2);
    const m = t.match(/ \(((?:نص|ربع) [^)]+)\)$/);
    if(m && KEYS[m[1]]){
      const nm = clean(t.slice(0, m.index));
      KEYS[m[1]].forEach(k => { if(r[k].indexOf(nm) < 0) r[k].push(nm); });
      if(m[1].startsWith('ربع')) r.quarter = true; else r.half = true;
    }else r.all.push(clean(t));
  });
  return r;
}
function pizzaPrint(i){
  const s = splitLabels(i.labels);
  if(!s.half && !s.quarter) return null;
  const list = a => a.length ? a.map(x => '<div>' + esc(x) + '</div>').join('') : '<div class="emp">—</div>';
  const top = (s.opts.length ? '<br><small>' + esc(s.opts.join(' · ')) + '</small>' : '') +
    (s.all.length ? '<div class="pall">على كلها: <b>' + esc(s.all.join('، ')) + '</b></div>' : '');
  if(s.quarter) return top + '<div class="pz4">' +
    '<div class="q rt">' + list(s.rt) + '</div><div class="q lt">' + list(s.lt) + '</div>' +
    '<div class="q rb">' + list(s.rb) + '</div><div class="q lb">' + list(s.lb) + '</div></div>';
  const R = s.rt, L = s.lt;
  return top +
    '<div class="pz"><div class="h r"><span class="hl">يمين</span>' + list(R) + '</div>' +
    '<div class="h l"><span class="hl">يسار</span>' + list(L) + '</div></div>';
}

      ${disc ? `<div class="sm"><span>خصم${o.coupon?' ('+esc(o.coupon)+')':''}</span><span>-${disc.toFixed(2)} ₪</span></div>` : ''}
      ${del ? `<div class="sm"><span>توصيل</span><span>${Number(o.fee||0).toFixed(2)} ₪</span></div>` : ''}
      <div class="tot"><span>الإجمالي</span><span>${Number(o.total||0).toFixed(2)} ₪</span></div>

let printQ = [];
function autoPrint(){
  if(!PRN.auto) return;
  const now = Date.now();
  ORDERS.filter(o => o.status === 'new' && PRINTED.indexOf(o.id) < 0 && printQ.indexOf(o.id) < 0 &&
      o.createdAtStr && now - new Date(o.createdAtStr).getTime() < 15*60*1000)
    .sort((a,b) => String(a.createdAtStr).localeCompare(String(b.createdAtStr)))
    .forEach(o => printQ.push(o.id));

/* ========= رقم الطلب اليومي ========= */
let NUMS = {};
const dayKey = s => { const d = new Date(s); return d.getFullYear() + '-' + (d.getMonth()+1) + '-' + d.getDate(); };
function computeNums(){
  NUMS = {};
  const byDay = {};
  ORDERS.forEach(o => { if(!o.createdAtStr) return; (byDay[dayKey(o.createdAtStr)] = byDay[dayKey(o.createdAtStr)] || []).push(o); });
  Object.values(byDay).forEach(a => {
    a.sort((x,y) => String(x.createdAtStr).localeCompare(String(y.createdAtStr)));
    a.forEach((o,i) => { NUMS[o.id] = i + 1; });
  });
}
const ordNo = o => NUMS[o.id] || '—';

/* ========= عدّاد الوقت ========= */
function prepMax(){
  const n = String(SET.prepTime||'').match(/\d+/g);
  return n ? Number(n[n.length-1]) : 35;
}
function ageHtml(o){
  if(!o.createdAtStr || !['new','prep','ready'].includes(o.status)) return '';
  return `<span class="age" data-t="${esc(o.createdAtStr)}" data-s="${esc(o.status)}"></span>`;
}
function tickAges(){
  const lim = prepMax(), now = Date.now();
  document.querySelectorAll('.age').forEach(el => {
    const m = Math.max(0, Math.floor((now - new Date(el.dataset.t).getTime()) / 60000));
    el.textContent = '⏱ ' + (m < 60 ? m + ' د' : Math.floor(m/60) + ' س ' + (m%60) + ' د');
    el.classList.toggle('late', el.dataset.s !== 'ready' && m >= lim);
    el.classList.toggle('warn', el.dataset.s !== 'ready' && m >= lim - 5 && m < lim);
  });
}
setInterval(tickAges, 20000);

function waPhone(p){
  let d = String(p||'').replace(/\D/g,'');

/* ========= ملخص اليوم ========= */
function todaySummary(){
  const k = dayKey(new Date().toISOString());
  const t = ORDERS.filter(o => o.createdAtStr && dayKey(o.createdAtStr) === k && o.status !== 'cancel');
  const rev = t.reduce((s,o) => s + Number(o.total||0), 0);
  const cnt = {};
  t.forEach(o => (o.items||[]).forEach(i => { cnt[i.name] = (cnt[i.name]||0) + (Number(i.qty)||0); }));
  const top = Object.entries(cnt).sort((a,b) => b[1]-a[1])[0];

  const box = (v,l) => `<div class="stt"><div class="v">${v}</div><div class="l">${l}</div></div>`;
  return `<div class="stats">` +

    box(`<span class="ltr">${t.length ? (rev/t.length).toFixed(0) : 0} ₪</span>`, 'معدل الطلب') +

async function moveAbove(srcId, dstId){
  const src = ITEMS.find(i=>i.id===srcId), dst = ITEMS.find(i=>i.id===dstId);
  if(!src || !dst) return;
  const list = ITEMS.filter(i => i.catId === dst.catId && i.id !== srcId);
  const di = list.findIndex(i => i.id === dstId);
  const before = di > 0 ? Number(list[di-1].order||0) : 0;
  const at = Number(dst.order||0);
  const newOrder = before ? (before + at)/2 : at - 5;
  src.order = newOrder; src.catId = dst.catId;
  ITEMS.sort((a,b)=>(a.order||0)-(b.order||0));
  renderItems();
  try{ await db.collection('items').doc(srcId).update({order:newOrder, catId:dst.catId}); }
  catch(e){ alert(e.message); }
}

/* ============ محرّك رسم البيتسا (نفس الكود باللوحة والمتجر) ============ */
function seedRand(str){
  let h = 2166136261;
  for(let i = 0; i < str.length; i++){ h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); }
  return () => { h += 0x6D2B79F5; let t = h; t = Math.imul(t ^ t >>> 15, t | 1); t ^= t + Math.imul(t ^ t >>> 7, t | 61); return ((t ^ t >>> 14) >>> 0) / 4294967296; };
}
/* شكل مرسوم لكل إضافة حسب اسمها، بيستعمل بس إذا الإضافة ما إلها صورة */
function toppingKind(label){
  const t = String(label||'');
  if(/زيتون\s*(اسود|أسود)/.test(t)) return 'olB';
  if(/زيتون/.test(t)) return 'olG';
  if(/فطر|مشروم/.test(t)) return 'mush';
  if(/ذر[ةه]/.test(t)) return 'corn';
  if(/بصل/.test(t)) return 'onion';
  if(/هالبينو|حار|حر\b/.test(t) && /فلفل|هالبينو/.test(t)) return 'jal';
  if(/فلفل/.test(t)) return 'pep';
  if(/طون/.test(t)) return 'tuna';
  if(/سلامي|نقانق|سجق|ببروني|بيبروني/.test(t)) return 'sal';
  if(/دجاج|شاورما|فاهيتا/.test(t)) return 'chk';
  if(/كباب|لحم|انتريكوت|إنتريكوت|برقيت|برجيت|بيف|همبرغر/.test(t)) return 'beef';
  if(/جبن/.test(t)) return 'chz';
  if(/بندور|طماط/.test(t)) return 'tom';
  if(/اناناس|أناناس/.test(t)) return 'pine';
  if(/ريحان|سبانخ|جرجير/.test(t)) return 'leaf';
  return 'dot';
}

    default: return '<circle r="6" fill="#e07b39"/><circle r="6" fill="none" stroke="#a9541e" stroke-width="1"/>';

}
function inRegion(x, y, k){
  const g = 5;
  switch(k){
    case 'r':  return x > g;
    case 'l':  return x < -g;
    case 'rt': return x > g && y < -g;
    case 'lt': return x < -g && y < -g;
    case 'rb': return x > g && y > g;
    case 'lb': return x < -g && y > g;
    default:   return true;
  }
}
/* tops: [{key,label,img,reg,ps,pn}] — ps = حجم القطعة، pn = كثافة/كمية */
function pizzaSvgFrom(tops, o){
  o = o || {};
  const idp = o.idp || 'pz', isNew = o.isNew || (() => false);
  const R = 84;
  let defs = '', body = '', n = 0;
  const regs = {};
  tops.forEach(tp => {
    regs[tp.reg] = 1;
    const ps = Math.max(.4, Math.min(2.5, Number(tp.ps) || 1));
    const pn = Math.max(.3, Math.min(3, Number(tp.pn) || 1));
    const rnd = seedRand(tp.key);
    const isQ = tp.reg.length === 2, isH = tp.reg === 'r' || tp.reg === 'l';
    const want = Math.max(1, Math.round((isQ ? 5 : isH ? 8 : 14) * pn)), pts = [];
    const minD = 18 * ps * Math.min(1, 1 / Math.sqrt(pn)), minD2 = minD * minD;
    for(let tries = 0; pts.length < want && tries < 900; tries++){
      const a = rnd() * Math.PI * 2, r = Math.sqrt(rnd()) * (R - 4 * ps);
      const x = Math.cos(a) * r, y = Math.sin(a) * r;
      if(!inRegion(x, y, tp.reg)) continue;
      if(pts.some(p => (p[0]-x)*(p[0]-x) + (p[1]-y)*(p[1]-y) < minD2)) continue;
      pts.push([x, y, rnd() * 360]);
    }
    let g = '';
    const tf = p => '<g transform="translate(' + p[0].toFixed(1) + ' ' + p[1].toFixed(1) + ') rotate(' + p[2].toFixed(0) + ') scale(' + ps.toFixed(2) + ')">';
    if(tp.img){
      const id = idp + 'c' + (n++);
      const png = /^data:image\/(png|webp)|\.png(\?|$)/i.test(tp.img);
      if(!png) defs += '<clipPath id="' + id + '"><circle r="9"/></clipPath>';
      pts.forEach((p,i) => {
        g += tf(p) + '<g class="pc" style="animation-delay:' + (i * 35) + 'ms">' +
          '<image href="' + esc(tp.img) + '" x="-10" y="-10" width="20" height="20" preserveAspectRatio="xMidYMid slice"' +
          (png ? '' : ' clip-path="url(#' + id + ')"') + '/>' +
          (png ? '' : '<circle r="9" fill="none" stroke="rgba(0,0,0,.18)" stroke-width="1"/>') + '</g></g>';
      });
    }else{
      const shape = pieceSvg(toppingKind(tp.label));
      pts.forEach((p,i) => { g += tf(p) + '<g class="pc" style="animation-delay:' + (i * 35) + 'ms">' + shape + '</g></g>'; });
    }
    body += '<g class="tp ' + (isNew(tp) ? 'drop' : '') + '" filter="url(#' + idp + 'sh)">' + g + '</g>';
  });
  const showH = regs.r || regs.l || regs.rt || regs.lt || regs.rb || regs.lb;
  const showQ = regs.rt || regs.lt || regs.rb || regs.lb;
  const guides = (showH ? '<line x1="0" y1="-96" x2="0" y2="96" class="gd"/>' : '') +
                 (showQ ? '<line x1="-96" y1="0" x2="96" y2="0" class="gd"/>' : '');
  const rb = seedRand('base' + (o.seed || '')); let spots = '';
  for(let i = 0; i < 26; i++){
    const a = rb() * 6.283, r = Math.sqrt(rb()) * 88;
    spots += '<ellipse cx="' + (Math.cos(a)*r).toFixed(1) + '" cy="' + (Math.sin(a)*r).toFixed(1) + '" rx="' + (3 + rb()*6).toFixed(1) +
      '" ry="' + (2 + rb()*4).toFixed(1) + '" fill="' + (rb() < .55 ? '#e3a94a' : '#c97a2c') + '" opacity="' + (.25 + rb()*.35).toFixed(2) + '"/>';
  }
  return '<svg viewBox="-120 -120 240 240" aria-label="معاينة البيتسا">' +
    '<defs>' +
      '<radialGradient id="' + idp + 'cr" r=".5"><stop offset=".78" stop-color="#e8b36a"/><stop offset=".9" stop-color="#d4943f"/><stop offset="1" stop-color="#a8692a"/></radialGradient>' +
      '<radialGradient id="' + idp + 'ch" r=".5"><stop offset="0" stop-color="#fbe39a"/><stop offset=".8" stop-color="#f5cf6b"/><stop offset="1" stop-color="#e3a944"/></radialGradient>' +
      '<filter id="' + idp + 'sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="1.2" stdDeviation="1" flood-opacity=".35"/></filter>' +
      '<filter id="' + idp + 'bs" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="5" stdDeviation="5" flood-opacity=".28"/></filter>' +
      '<filter id="' + idp + 'tx"><feTurbulence type="fractalNoise" baseFrequency=".06" numOctaves="2" seed="4"/><feDisplacementMap in="SourceGraphic" scale="9"/></filter>' +
      defs + '</defs>' +
    '<circle r="114" fill="url(#' + idp + 'cr)" filter="url(#' + idp + 'bs)"/>' +
    '<circle r="99" fill="#b8321f"/>' +
    '<circle r="96" fill="url(#' + idp + 'ch)" filter="url(#' + idp + 'tx)"/>' +
    '<g filter="url(#' + idp + 'tx)">' + spots + '</g>' +
    guides + body + '</svg>';
}

/* ========= أداة قص الصورة (سحب + تكبير) ========= */
function loadImgFile(f){
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(f), im = new Image();
    im.onload = () => res({im, url});
    im.onerror = () => { URL.revokeObjectURL(url); rej(new Error('الملف مش صورة أو نوعه مش مدعوم')); };
    im.src = url;
  });
}
/* بترجع canvas بالجزء المقصوص، أو null إذا لغى */
async function cropDialog(f, aspect, title){
  const {im, url} = await loadImgFile(f);
  const alpha = /png|webp/i.test(f.type || f.name || '');
  return new Promise(resolve => {
    const W = im.naturalWidth, H = im.naturalHeight;
    const maxW = Math.min(window.innerWidth - 48, 460), maxH = Math.min(window.innerHeight * 0.5, 360);
    let FW = maxW, FH = FW / aspect;
    if(FH > maxH){ FH = maxH; FW = FH * aspect; }
    const s0 = Math.max(FW / W, FH / H);
    let z = 1, s = s0, ox = (FW - W * s) / 2, oy = (FH - H * s) / 2;

    const wrap = document.createElement('div');
    wrap.className = 'crop-bg';
    wrap.innerHTML = `<div class="crop-box">
      <div class="crop-h">${esc(title || 'ظبّط الصورة')}</div>
      <div class="crop-tip">اسحب الصورة لتختار شو يبيّن، واستعمل الشريط للتكبير</div>
      <div class="crop-fr ${alpha ? 'chk' : ''}" style="width:${FW}px;height:${FH}px"><img alt="" draggable="false"></div>
      <div class="crop-z"><span>➖</span><input type="range" min="1" max="4" step="0.01" value="1"><span>➕</span></div>
      <div class="crop-a">
        <button type="button" class="btn gh" data-a="x">إلغاء</button>
        <button type="button" class="btn red" data-a="ok">✓ تمام</button>
      </div></div>`;
    document.body.appendChild(wrap);
    const fr = wrap.querySelector('.crop-fr'), img = fr.querySelector('img'), rng = wrap.querySelector('input');
    img.src = url;
    const clamp = () => {
      ox = Math.min(0, Math.max(FW - W * s, ox));
      oy = Math.min(0, Math.max(FH - H * s, oy));
    };
    const draw = () => { clamp(); img.style.width = (W * s) + 'px'; img.style.height = (H * s) + 'px'; img.style.transform = `translate(${ox}px,${oy}px)`; };
    const zoomTo = (nz, cx = FW / 2, cy = FH / 2) => {
      nz = Math.max(1, Math.min(4, nz));
      const ns = s0 * nz;
      ox = cx - (cx - ox) * ns / s; oy = cy - (cy - oy) * ns / s;
      z = nz; s = ns; rng.value = z; draw();
    };
    draw();
    rng.oninput = () => zoomTo(Number(rng.value));
    // سحب بالماوس أو الإصبع، وتكبير بإصبعين
    const pts = new Map(); let pinch0 = 0, z0 = 1;
    fr.onpointerdown = e => { fr.setPointerCapture(e.pointerId); pts.set(e.pointerId, [e.clientX, e.clientY]);
      if(pts.size === 2){ const [a,b] = [...pts.values()]; pinch0 = Math.hypot(a[0]-b[0], a[1]-b[1]); z0 = z; } };
    fr.onpointermove = e => {
      if(!pts.has(e.pointerId)) return;
      const p = pts.get(e.pointerId);
      if(pts.size === 1){ ox += e.clientX - p[0]; oy += e.clientY - p[1]; draw(); }
      pts.set(e.pointerId, [e.clientX, e.clientY]);
      if(pts.size === 2 && pinch0){ const [a,b] = [...pts.values()]; zoomTo(z0 * Math.hypot(a[0]-b[0], a[1]-b[1]) / pinch0); }
    };
    fr.onpointerup = fr.onpointercancel = e => { pts.delete(e.pointerId); if(pts.size < 2) pinch0 = 0; };
    fr.onwheel = e => { e.preventDefault(); const r = fr.getBoundingClientRect(); zoomTo(z * (e.deltaY < 0 ? 1.08 : 0.93), e.clientX - r.left, e.clientY - r.top); };

    const done = ok => {
      let out = null;
      if(ok){
        const sx = -ox / s, sy = -oy / s, sw = FW / s, sh = FH / s;
        const ow = Math.max(1, Math.round(Math.min(sw, 1600))), oh = Math.max(1, Math.round(ow / aspect));
        out = document.createElement('canvas'); out.width = ow; out.height = oh;
        const x = out.getContext('2d');
        if(!alpha){ x.fillStyle = '#fff'; x.fillRect(0, 0, ow, oh); }
        x.imageSmoothingQuality = 'high';
        x.drawImage(im, sx, sy, sw, sh, 0, 0, ow, oh);
        out._alpha = alpha;
      }
      URL.revokeObjectURL(url); wrap.remove(); resolve(out);
    };
    wrap.querySelector('[data-a="ok"]').onclick = () => done(true);
    wrap.querySelector('[data-a="x"]').onclick = () => done(false);
  });
}
/* تصغير canvas وترميزه */
function encodeCanvas(c, max, q){
  const k = Math.min(1, max / Math.max(c.width, c.height));
  let o = c;
  if(k < 1){
    o = document.createElement('canvas'); o.width = Math.round(c.width * k); o.height = Math.round(c.height * k);
    const x = o.getContext('2d');
    if(!c._alpha){ x.fillStyle = '#fff'; x.fillRect(0, 0, o.width, o.height); }
    x.imageSmoothingQuality = 'high'; x.drawImage(c, 0, 0, o.width, o.height);
  }
  const type = c._alpha ? 'image/png' : 'image/jpeg';
  return new Promise((res, rej) => o.toBlob(b => b ? res({blob:b, data:() => o.toDataURL(type, q)}) : rej(new Error('ما قدرت أجهّز الصورة')), type, q));
}
/* بترجع رابط الصورة بعد القص: Cloudinary إذا مفعّل، وإلا محفوظة داخلياً.
   إذا لغى القص بترجع null */
async function makeImg(f, smallMax, q, aspect, title){
  const c = await cropDialog(f, aspect || 1, title);
  if(!c) return null;
  if(hasCloud()){
    const {blob} = await encodeCanvas(c, 1400, 0.85);
    const fd = new FormData();
    fd.append('file', blob, blob.type === 'image/png' ? 'img.png' : 'img.jpg');
    fd.append('upload_preset', window.CLOUDINARY.preset);
    const r = await fetch('https://api.cloudinary.com/v1_1/' + window.CLOUDINARY.cloudName + '/image/upload', {method:'POST', body:fd});
    const j = await r.json();
    if(!j.secure_url) throw new Error(j.error ? j.error.message : 'فشل الرفع');
    return j.secure_url.replace('/upload/', '/upload/w_' + (smallMax < 400 ? 300 : 900) + ',q_auto,f_auto/');
  }
  let sm = await encodeCanvas(c, smallMax, q), d = sm.data();
  if(d.length > 350000){ sm = await encodeCanvas(c, Math.round(smallMax * 0.7), q * 0.85); d = sm.data(); }
  if(d.length > 350000) throw new Error('الصورة كبيرة كثير حتى بعد التصغير');
  return d;
}

async function handleImg(f){
  if(!f) return;
  if(!/^image\//.test(f.type) && !/\.(jpe?g|png|webp|gif|heic)$/i.test(f.name||'')){ alert('اختار صورة'); return; }

  }catch(e){ setPv(prev); alert('ما زبطت: ' + e.message); }
}

function ogHalvesToggle(){

function ogSz(inp){

}
function ogPreview(row){
  const pv = $('ogPrev'); if(!pv || !row) return;
  document.querySelectorAll('#gRows .ogrow.cur').forEach(r => r.classList.remove('cur'));
  row.classList.add('cur');
  const label = row.querySelector('.l').value.trim() || 'إضافة';
  const tp = {key: 'adm:' + label, label, img: row.dataset.img || '', reg: 'f',
              ps: Number(row.querySelector('.ps').value), pn: Number(row.querySelector('.pn').value)};
  pv.innerHTML = pizzaSvgFrom([tp], {idp: 'ad', seed: 'admin'}) +
    `<div class="ogpc"><b>${esc(label)}</b> على البيتسا كاملة<br><span>حرّك الشريطين لحد ما يعجبك الشكل</span></div>`;

/* صورة لكل خيار (مشروب، إضافة، حجم...) */
let _ogBtn = null;
function pickOgImg(btn){
  const row = btn.closest('.ogrow');
  if(row.dataset.img){
    const c = prompt('اكتب 1 لتغيير الصورة، أو 2 لحذفها', '1');
    if(c === '2'){ row.dataset.img = ''; btn.innerHTML = '📷'; return; }
    if(c !== '1') return;
  }
  _ogBtn = btn;
  let inp = $('ogFile');
  if(!inp){
    inp = document.createElement('input'); inp.type = 'file'; inp.accept = 'image/*'; inp.id = 'ogFile'; inp.style.display = 'none';
    inp.onchange = () => { const f = inp.files[0]; inp.value = ''; if(f && _ogBtn) ogImgFile(_ogBtn, f); };
    document.body.appendChild(inp);
  }
  inp.click();
}
async function ogImgFile(btn, f){
  const row = btn.closest('.ogrow');
  btn.innerHTML = '⏳';
  try{
    const url = await makeImg(f, 240, 0.75, 1, 'ظبّط صورة الخيار — للإضافات خلّي القطعة تعبّي المربع');
    if(url === null){ btn.innerHTML = row.dataset.img ? `<img src="${esc(row.dataset.img)}" alt="">` : '📷'; return; }
    row.dataset.img = url;
    btn.innerHTML = `<img src="${esc(url)}" alt="">`;
    if($('gHalves') && $('gHalves').checked) ogPreview(row);
  }catch(e){ btn.innerHTML = row.dataset.img ? `<img src="${esc(row.dataset.img)}" alt="">` : '📷'; alert('ما زبطت: ' + e.message); }
}

  db.collection('optionGroups').doc(id).delete();

    ? `<button class="btn gh" onclick="closeModal()">إلغاء</button><button class="btn red" id="mSave" onclick="doSave()">حفظ</button>`
    : `<button class="btn gh" onclick="closeModal()">إغلاق</button>`;
  $('mbg').classList.add('on'); $('modal').classList.add('on');
}
function closeModal(){
  $('mbg').classList.remove('on'); $('modal').classList.remove('on');
  modalSave = null; window._pickImg = '';
}
async function doSave(){
  if(!modalSave) return closeModal();
  const b = $('mSave'); b.disabled = true; b.textContent = 'جاري الحفظ...';
  try{
    const ok = await modalSave();
    if(ok !== false){ closeModal(); toast('تم ✓'); }
    else { b.disabled = false; b.textContent = 'حفظ'; }
  }catch(e){
    alert('صار خطأ: ' + e.message);
    b.disabled = false; b.textContent = 'حفظ';
  }
}
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover">
<meta name="theme-color" content="#141414">
<title>مكسيكاني وبيتسا أم الفحم - رهط</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --red:#e01a2b; --red-dark:#b3121f;
  --ink:#141414; --ink-2:#4a4a4a; --muted:#8a8a8a;
  --bg:#f6f4f1; --card:#fff; --line:#ececec; --green:#1a9c53;
  --radius:18px;
  --shadow:0 4px 18px rgba(0,0,0,.07);
  --shadow-lg:0 10px 34px rgba(0,0,0,.14);
  --maxw:560px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{font-family:'Cairo',system-ui,-apple-system,'Segoe UI',sans-serif;background:var(--bg);color:var(--ink);padding-bottom:150px;overflow-x:hidden}
.wrap{max-width:var(--maxw);margin:0 auto;position:relative;min-height:100vh}
img{display:block;max-width:100%}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
.ltr{direction:ltr;unicode-bidi:isolate;display:inline-block}

/* شاشة البداية */
#splash{position:fixed;inset:0;z-index:999;background:#141414;display:grid;place-items:center;transition:opacity .45s}
#splash.off{opacity:0;pointer-events:none}
#splash .in{text-align:center;color:#fff}
#splash .logo{width:110px;height:110px;border-radius:50%;background:#000;border:5px solid #fff;margin:0 auto 18px;display:grid;place-items:center;overflow:hidden}
#splash .logo img{width:100%;height:100%;object-fit:cover}
#splash .logo .t{font-weight:900;font-size:13px;line-height:1.3}
#splash .logo .t b{color:#ff3b4a;display:block}
#splash h2{margin:0 0 6px;font-size:21px;font-weight:900}
#splash p{margin:0;opacity:.6;font-size:14px}
#splash .bar{width:120px;height:3px;background:rgba(255,255,255,.18);border-radius:3px;margin:20px auto 0;overflow:hidden}
#splash .bar i{display:block;height:100%;width:40%;background:var(--red);border-radius:3px;animation:sl 1.1s infinite}
@keyframes sl{0%{transform:translateX(150%)}100%{transform:translateX(-300%)}}

/* الغلاف */
.cover{position:relative;height:230px;overflow:hidden;background:#241d18}
.cover img{width:100%;height:100%;object-fit:cover}
.cover::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.45),rgba(0,0,0,0) 38%,rgba(0,0,0,.25))}
.topbar{position:absolute;top:0;left:0;right:0;z-index:5;display:flex;align-items:center;gap:10px;padding:14px 14px 0}
.round-btn{width:46px;height:46px;flex:none;border-radius:50%;background:rgba(255,255,255,.93);backdrop-filter:blur(6px);display:grid;place-items:center;box-shadow:0 2px 10px rgba(0,0,0,.18);font-size:19px;transition:transform .15s}
.round-btn:active{transform:scale(.9)}
.searchbar{flex:1;height:46px;border-radius:999px;background:rgba(255,255,255,.93);backdrop-filter:blur(6px);display:flex;align-items:center;gap:8px;padding:0 16px;box-shadow:0 2px 10px rgba(0,0,0,.18)}
.searchbar input{flex:1;border:none;background:none;outline:none;font-family:inherit;font-size:15px}
.searchbar input::placeholder{color:#9a9a9a}

/* كرت المعلومات */
.info-shell{margin-top:-46px;position:relative;z-index:6;padding:0 12px}
.info-card{background:var(--card);border-radius:24px;box-shadow:var(--shadow);padding:48px 18px 18px;position:relative}
.logo-badge{position:absolute;top:-42px;left:50%;transform:translateX(-50%);width:84px;height:84px;border-radius:50%;background:#111;border:5px solid #fff;box-shadow:0 4px 14px rgba(0,0,0,.2);display:grid;place-items:center;overflow:hidden;text-align:center}
.logo-badge img{width:100%;height:100%;object-fit:cover}
.logo-badge .lg-txt{color:#fff;font-weight:900;font-size:10px;line-height:1.25;padding:4px}
.logo-badge .lg-txt b{color:#ff3b4a;display:block;font-size:11px}
.info-actions{position:absolute;top:14px;left:16px;right:16px;display:flex;justify-content:space-between}
.info-actions button{opacity:.75;width:30px;height:30px;border-radius:50%;background:#f2f0ee;display:grid;place-items:center;font-size:15px}
.rest-name{font-size:26px;font-weight:900;text-align:center;margin:0 0 4px;letter-spacing:-.3px}
.rest-addr{text-align:center;color:var(--ink-2);font-size:14px;margin:0 0 8px}
.status{text-align:center;font-weight:700;font-size:15px;margin-bottom:14px}
.status.open{color:var(--green)} .status.closed{color:var(--red)}
.meta-row{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;border-top:1px solid var(--line);padding-top:16px}
.meta{text-align:center}
.meta .ic{width:46px;height:46px;border-radius:50%;background:#f2f0ee;display:grid;place-items:center;margin:0 auto 8px;font-size:20px}
.meta .v{font-weight:700;font-size:15px}
.meta .s{font-size:12.5px;color:var(--muted);margin-top:2px}
.meta .s del{color:#b9b9b9}
.meta .s .now{color:var(--red);font-weight:700}
.promos{margin-top:14px;display:flex;flex-direction:column;gap:9px}
.promo{background:#f4f3f7;border-radius:14px;padding:13px 14px;display:flex;align-items:center;gap:11px;font-size:14px;font-weight:600;line-height:1.5}
.promo .pi{font-size:19px;flex:none}

/* أيقونات الأقسام */
.cat-icons{display:flex;gap:10px;overflow-x:auto;padding:16px 14px 6px;scrollbar-width:none}
.cat-icons::-webkit-scrollbar{display:none}
.cat-ic{flex:none;width:76px;text-align:center}
.cat-ic .bx{width:64px;height:64px;border-radius:20px;background:#fff;box-shadow:var(--shadow);display:grid;place-items:center;font-size:30px;margin:0 auto 7px;transition:.15s;border:2px solid transparent}
.cat-ic.on .bx{background:var(--red);border-color:var(--red);transform:translateY(-2px)}
.cat-ic .lb{font-size:12.5px;font-weight:700;color:var(--ink-2);line-height:1.3}
.cat-ic.on .lb{color:var(--red)}

/* عناوين */
.sec-head{display:flex;align-items:center;justify-content:space-between;padding:18px 14px 10px}
.sec-head h2{margin:0;font-size:20px;font-weight:900}
.see-all{background:#ffe9eb;color:var(--red);font-weight:700;font-size:13px;padding:7px 14px;border-radius:999px}

/* بانر العرض */
.deal{margin:6px 14px 4px;border-radius:20px;overflow:hidden;position:relative;background:linear-gradient(135deg,#1d1d1d,#3a2017);color:#fff;padding:18px 18px 16px;box-shadow:var(--shadow)}
.deal .t{font-size:20px;font-weight:900;margin-bottom:5px}
.deal .d{font-size:13.5px;opacity:.82;line-height:1.6;margin-bottom:12px}
.deal .p{font-size:30px;font-weight:900;color:#ffd24a;line-height:1}
.deal .p small{font-size:14px;font-weight:700;opacity:.8;margin-inline-end:5px}
.deal .go{margin-top:12px;background:var(--red);color:#fff;font-weight:800;font-size:14px;padding:10px 20px;border-radius:12px;display:inline-block}
.deal .em{position:absolute;left:-6px;bottom:-14px;font-size:84px;opacity:.22}

/* صف أفقي */
.hscroll{display:flex;gap:12px;overflow-x:auto;padding:4px 14px 10px;scrollbar-width:none}
.hscroll::-webkit-scrollbar{display:none}
.hcard{flex:none;width:168px;background:var(--card);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow);position:relative}
.hcard .ph{height:120px;position:relative;overflow:hidden}
.hcard .ph img{width:100%;height:100%;object-fit:cover}
.hcard .body{padding:10px 11px 12px}
.hcard .nm{font-size:14px;font-weight:700;line-height:1.35;height:38px;overflow:hidden}
.hcard .pr{margin-top:6px;font-weight:900;font-size:16px}
.badges{position:absolute;top:8px;right:8px;display:flex;flex-direction:column;gap:5px;align-items:flex-end;z-index:2}
.bdg{font-size:11px;font-weight:800;padding:4px 9px;border-radius:8px;background:#fff6d8;color:#8a6200;box-shadow:0 1px 4px rgba(0,0,0,.12)}
.bdg.sale{background:var(--red);color:#fff}
.bdg.out{background:#444;color:#fff}
.old{color:#b4b4b4;text-decoration:line-through;font-weight:600;font-size:13px;margin-inline-start:6px}

/* شبكة */
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:4px 14px 10px}
.card{background:var(--card);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow);display:flex;flex-direction:column;position:relative;transition:transform .12s}
.card:active{transform:scale(.98)}
.card.soldout{opacity:.55}
.card .ph{height:128px;position:relative;overflow:hidden;background:#eee}
.card .ph img{width:100%;height:100%;object-fit:cover}
.card .body{padding:10px 11px 12px;display:flex;flex-direction:column;flex:1}
.card .nm{font-size:14.5px;font-weight:700;line-height:1.35}
.card .ds{font-size:12px;color:var(--muted);margin-top:3px;line-height:1.45;height:34px;overflow:hidden}
.card .foot{display:flex;align-items:center;justify-content:space-between;margin-top:9px}
.card .pr{font-weight:900;font-size:16.5px}
.add-btn{width:34px;height:34px;border-radius:11px;background:var(--red);color:#fff;font-size:20px;font-weight:700;display:grid;place-items:center;line-height:0}

/* نوافذ */
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:60;opacity:0;pointer-events:none;transition:opacity .25s}
.sheet-bg.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:61;max-width:var(--maxw);margin:0 auto;background:var(--bg);border-radius:26px 26px 0 0;max-height:94vh;display:flex;flex-direction:column;transform:translateY(102%);transition:transform .3s cubic-bezier(.3,.8,.3,1);box-shadow:var(--shadow-lg)}
.sheet.on{transform:translateY(0)}
.sheet-close{position:absolute;top:12px;left:12px;z-index:3;width:38px;height:38px;border-radius:50%;background:rgba(255,255,255,.95);display:grid;place-items:center;font-size:17px;box-shadow:0 2px 8px rgba(0,0,0,.2)}
.sheet-scroll{overflow-y:auto;-webkit-overflow-scrolling:touch;flex:1}
.sheet-hero{height:200px;position:relative;overflow:hidden;background:#ddd}
.sheet-hero img{width:100%;height:100%;object-fit:cover}
.sheet-body{padding:16px 16px 20px}
.sheet-body h3{margin:0 0 6px;font-size:22px;font-weight:900}
.sheet-body .ds{color:var(--ink-2);font-size:14px;line-height:1.6;margin:0 0 16px}

.opt-group{background:#fff;border-radius:16px;padding:4px 14px 12px;margin-bottom:12px;box-shadow:var(--shadow)}
.opt-head{display:flex;align-items:center;justify-content:space-between;padding:13px 0 10px}
.opt-head .t{font-weight:800;font-size:15.5px}
.opt-head .req{font-size:11px;font-weight:700;background:#ffe9eb;color:var(--red);padding:3px 9px;border-radius:7px}
.opt-head .opn{font-size:11px;font-weight:700;background:#eee;color:var(--muted);padding:3px 9px;border-radius:7px}
/* خيارات كمربعات */
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tile{border:2px solid var(--line);border-radius:14px;padding:12px 6px;text-align:center;background:#fff;transition:.15s}
.tile .tl{font-weight:800;font-size:13.5px;line-height:1.3}
.tile .tp{font-size:13px;font-weight:700;color:var(--muted);margin-top:4px}
.tile.sel{border-color:var(--red);background:var(--red);color:#fff}
.tile.sel .tp{color:rgba(255,255,255,.85)}
/* خيارات كسطور */
.opt{display:flex;align-items:center;gap:11px;padding:11px 0;border-top:1px solid #f3f3f3;font-size:14.5px}
.opt .mark{width:22px;height:22px;flex:none;border-radius:7px;border:2px solid #d2d2d2;display:grid;place-items:center;transition:.15s}
.opt.sel .mark{border-color:var(--red);background:var(--red)}
.opt.sel .mark::after{content:'✓';color:#fff;font-size:12px;font-weight:900}
.opt .lb{flex:1;font-weight:600}
.opt .pp{color:var(--muted);font-weight:700;font-size:13.5px}

.note-box{background:#fff;border-radius:16px;padding:14px;margin-bottom:12px;box-shadow:var(--shadow)}
.note-box label{font-weight:800;font-size:15.5px;display:block;margin-bottom:9px}
.note-box textarea{width:100%;border:1.5px solid var(--line);border-radius:12px;padding:11px;font-family:inherit;font-size:14px;resize:none;outline:none}
.note-box textarea:focus{border-color:var(--ink)}

.sheet-foot{padding:12px 16px calc(14px + env(safe-area-inset-bottom));background:#fff;border-top:1px solid var(--line);display:flex;align-items:center;gap:12px}
.qty{display:flex;align-items:center;gap:4px;background:#f2f0ee;border-radius:13px;padding:4px}
.qty button{width:36px;height:38px;font-size:21px;font-weight:700;display:grid;place-items:center;border-radius:10px}
.qty button:active{background:#e2dfdc}
.qty .n{min-width:28px;text-align:center;font-weight:900;font-size:17px}
.cta{flex:1;height:52px;border-radius:15px;background:var(--red);color:#fff;font-weight:800;font-size:16px;display:flex;align-items:center;justify-content:center;gap:10px}
.cta:active{background:var(--red-dark)}
.cta:disabled{background:#c9c9c9}

/* السلة */
.cart-item{display:flex;gap:11px;padding:13px 0;border-bottom:1px solid #f0f0f0}
.cart-item .ph{width:62px;height:62px;border-radius:13px;overflow:hidden;flex:none;background:#eee}
.cart-item .ph img{width:100%;height:100%;object-fit:cover}
.cart-item .mid{flex:1;min-width:0}
.cart-item .nm{font-weight:700;font-size:14.5px}
.cart-item .sub{font-size:12px;color:var(--muted);margin-top:3px;line-height:1.5}
.cart-item .rowb{display:flex;align-items:center;justify-content:space-between;margin-top:7px}
.cart-item .pr{font-weight:900;font-size:15px}
.miniqty{display:flex;align-items:center;gap:2px;background:#f2f0ee;border-radius:10px;padding:2px}
.miniqty button{width:28px;height:28px;font-size:16px;font-weight:700;display:grid;place-items:center;border-radius:8px}
.miniqty .n{min-width:22px;text-align:center;font-weight:800;font-size:14px}
.seg{display:flex;background:#eceae7;border-radius:14px;padding:4px;margin-bottom:14px}
.seg button{flex:1;height:42px;border-radius:11px;font-weight:800;font-size:14.5px;color:var(--ink-2)}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 2px 7px rgba(0,0,0,.09)}
.sum{background:#fff;border-radius:16px;padding:14px 16px;box-shadow:var(--shadow);margin-top:14px}
.sum .r{display:flex;justify-content:space-between;padding:7px 0;font-size:14.5px;color:var(--ink-2)}
.sum .r.total{border-top:1px solid var(--line);margin-top:7px;padding-top:12px;font-size:18px;font-weight:900;color:var(--ink)}
.hint{font-size:12.5px;color:var(--muted);text-align:center;margin-top:10px;line-height:1.6}
.empty{text-align:center;padding:60px 20px;color:var(--muted)}
.empty .e{font-size:54px;margin-bottom:14px}
.field{margin-bottom:12px}
.field label{display:block;font-weight:700;font-size:14px;margin-bottom:6px}
.field input{width:100%;height:48px;border:1.5px solid var(--line);border-radius:13px;padding:0 13px;font-family:inherit;font-size:15px;outline:none;background:#fff}
.field input:focus{border-color:var(--ink)}
.closed-note{background:#fff1f2;color:var(--red-dark);border-radius:14px;padding:13px;font-size:13.5px;font-weight:700;text-align:center;margin-bottom:14px;line-height:1.6}
.pay-note{display:flex;align-items:center;gap:10px;background:#fff;border-radius:14px;padding:13px 14px;margin-top:12px;box-shadow:var(--shadow);font-size:13.5px;font-weight:600}

/* طلباتي */
.ord{background:#fff;border-radius:16px;padding:14px;margin-bottom:11px;box-shadow:var(--shadow)}
.ord .h{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.ord .dt{font-size:12.5px;color:var(--muted)}
.ord .tt{font-weight:900}
.ord .ls{font-size:13px;color:var(--ink-2);line-height:1.7}
.ord .again{margin-top:11px;background:#ffe9eb;color:var(--red);font-weight:800;font-size:13.5px;padding:9px 0;border-radius:11px;width:100%}

/* الشريط السفلي */
.tabbar{position:fixed;bottom:0;left:0;right:0;z-index:40;max-width:var(--maxw);margin:0 auto;background:#fff;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr);padding-bottom:env(safe-area-inset-bottom);box-shadow:0 -4px 18px rgba(0,0,0,.06)}
.tab{padding:9px 0 8px;text-align:center;color:var(--muted);font-size:11.5px;font-weight:700;position:relative}
.tab .i{font-size:21px;display:block;margin-bottom:2px;line-height:1.1}
.tab.on{color:var(--red)}
.tab .dot{position:absolute;top:4px;right:calc(50% - 22px);background:var(--red);color:#fff;font-size:10.5px;font-weight:800;min-width:18px;height:18px;border-radius:9px;display:grid;place-items:center;padding:0 5px}

/* شريط السلة العائم */
.cartbar{position:fixed;bottom:66px;left:0;right:0;z-index:39;max-width:var(--maxw);margin:0 auto;padding:0 14px;transform:translateY(160%);transition:transform .28s cubic-bezier(.3,.8,.3,1)}
.cartbar.on{transform:translateY(0)}
.cartbar-in{background:var(--ink);color:#fff;border-radius:16px;height:54px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;box-shadow:var(--shadow-lg)}
.cartbar .cnt{background:rgba(255,255,255,.18);border-radius:9px;padding:4px 10px;font-weight:800;font-size:14px}
.cartbar .lbl{font-weight:800;font-size:15.5px}
.cartbar .tot{font-weight:900;font-size:17px}

.demo-flag{background:#fff8e1;border:1.5px dashed #e0b73a;color:#7a5c00;border-radius:14px;padding:12px 14px;margin:14px;font-size:13px;line-height:1.7;font-weight:600}
.foot-note{text-align:center;padding:26px 20px 30px;color:var(--muted);font-size:12.5px;line-height:1.8}
.toast{position:fixed;bottom:130px;left:50%;transform:translateX(-50%) translateY(20px);background:#141414;color:#fff;padding:12px 20px;border-radius:13px;font-weight:700;font-size:14px;z-index:90;opacity:0;pointer-events:none;transition:.25s;white-space:nowrap}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.sheet.on ~ .toast{bottom:auto;top:76px;transform:translateX(-50%) translateY(-16px)}
.sheet.on ~ .toast.on{transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>

<!-- شاشة البداية -->
<div id="splash">
  <div class="in">
    <div class="logo" id="splashLogo"><div class="t">مكسيكاني<b>وبيتسا</b>أم الفحم</div></div>
    <h2>مكسيكاني وبيتسا أم الفحم</h2>
    <p>رهط - الشارع الرئيسي</p>
    <div class="bar"><i></i></div>
  </div>
</div>

<div class="wrap">

  <!-- ===== الرئيسية ===== -->
  <div id="viewHome">
    <div class="cover">
      <img id="coverImg" alt="">
      <div class="topbar">
        <button class="round-btn" onclick="go('cart')" aria-label="السلة">🛒</button>
        <div class="searchbar">
          <span>🔍</span>
          <input id="search" type="search" placeholder="ابحث عن وجبتك المفضلة..." oninput="onSearch()">
        </div>
        <button class="round-btn" onclick="shareRest()" aria-label="مشاركة">↗</button>
      </div>
    </div>

    <div class="info-shell">
      <div class="info-card">
        <div class="logo-badge" id="logoBadge"><div class="lg-txt">مكسيكاني<b>وبيتسا</b>أم الفحم</div></div>
        <div class="info-actions">
          <button onclick="openInfo()" aria-label="معلومات" style="font-weight:900;font-family:serif">i</button>
          <button onclick="toggleFav(this)" aria-label="مفضلة">🤍</button>
        </div>
        <h1 class="rest-name" id="restName">...</h1>
        <p class="rest-addr" id="restAddr"></p>
        <div class="status" id="statusEl">...</div>
        <div class="meta-row">
          <div class="meta">
            <div class="ic">🛵</div>
            <div class="v" id="mPrep">—</div>
            <div class="s" id="mFee"></div>
          </div>
          <div class="meta">
            <div class="ic">🕐</div>
            <div class="v" id="dayName">—</div>
            <div class="s" id="dayHours">—</div>
          </div>
          <div class="meta">
            <div class="ic">★</div>
            <div class="v" id="mRate">—</div>
            <div class="s" id="mRateN"></div>
          </div>
        </div>
        <div class="promos" id="promos"></div>
      </div>
    </div>

    <div id="demoFlag"></div>
    <div class="cat-icons" id="catIcons"></div>

/* =====================================================================

function catOf(id){ return CATS.find(c => c.id === id) || {name:'', icon:'🍽️'}; }
function ph(it){
  if(it && it.img) return it.img;
  const c = catOf(it ? it.catId : '');
  const pal = {'🍕':['#f0b64f','#c2451d'],'🌯':['#e08a46','#8c3b1e'],'🍔':['#d79a52','#8a4a17'],
               '🍟':['#edc45a','#b07416'],'🥗':['#8cc45c','#2f6b2a'],'🥤':['#6cb6e4','#1f5880'],
               '🍫':['#b3825e','#4a2c1d']}[c.icon] || ['#ccc','#777'];
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="400" height="300"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="${pal[0]}"/><stop offset="1" stop-color="${pal[1]}"/></linearGradient></defs><rect width="400" height="300" fill="url(#g)"/><text x="200" y="196" font-size="130" text-anchor="middle">${c.icon}</text></svg>`;
  return 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
}
function coverSrc(){
  if(SET.cover) return SET.cover;
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="800" height="460"><defs><linearGradient id="c" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4a2a16"/><stop offset="1" stop-color="#15110e"/></linearGradient></defs><rect width="800" height="460" fill="url(#c)"/><text x="400" y="300" font-size="140" text-anchor="middle" opacity=".9">🍕🌯🍟</text></svg>`;
  return 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
}

/* =====================================================================
   Firebase
   ===================================================================== */
function configFilled(){
  const c = window.FB_CONFIG;
  return !!(c && c.apiKey && c.projectId && !/ضع_المفتاح/.test(c.apiKey) && !/اسم-المشروع/.test(c.projectId));
}
function startFirebase(){
  if(!configFilled()) return false;
  try{
    firebase.initializeApp(window.FB_CONFIG);
    db = firebase.firestore();
  }catch(e){ console.error('Firebase init', e); return false; }
  liveMode = true;

  db.collection('settings').doc('main').onSnapshot(d => {
    if(d.exists) SET = Object.assign({}, window.FALLBACK, d.data());
    ready.set = true; paintInfo(); maybeHideSplash();
  }, err => { console.error(err); ready.set = true; maybeHideSplash(); });

  db.collection('categories').onSnapshot(s => {
    CATS = s.docs.map(d => ({id:d.id, ...d.data()})).sort((a,b)=>(a.order||0)-(b.order||0));
    ready.cats = true; renderAll(); maybeHideSplash();
  }, err => { console.error(err); ready.cats = true; maybeHideSplash(); });

  db.collection('items').onSnapshot(s => {
    ITEMS = s.docs.map(d => ({id:d.id, ...d.data()})).sort((a,b)=>(a.order||0)-(b.order||0));
    ready.items = true; renderAll(); maybeHideSplash();
  }, err => { console.error(err); ready.items = true; maybeHideSplash(); });

  db.collection('optionGroups').onSnapshot(s => {
    GROUPS = {};
    s.docs.forEach(d => GROUPS[d.id] = d.data());
    ready.groups = true; renderAll(); maybeHideSplash();
  }, err => { console.error(err); ready.groups = true; maybeHideSplash(); });

  db.collection('deals').onSnapshot(s => {
    DEALS = s.docs.map(d => ({id:d.id, ...d.data()})).sort((a,b)=>(a.order||0)-(b.order||0));
    renderAll();
  }, () => {});
  return true;
}
function useDemo(){

/* =====================================================================
   حالة المطعم
   ===================================================================== */
function toMin(hm){ const a = String(hm).split(':').map(Number); return a[0]*60 + (a[1]||0); }
function restStatus(){
  const now = new Date(), d = now.getDay();
  const mins = now.getHours()*60 + now.getMinutes();
  const H = (SET.hours || {})[d] || (SET.hours || {})[String(d)];
  if(!H || !H[0]) return {open:false, label:'مغلق اليوم', day:DAYS[d], hours:'مغلق'};
  const o = toMin(H[0]); const c = toMin(H[1]);
  const overnight = c <= o;
  const open = overnight ? (mins >= o || mins < c) : (mins >= o && mins < c);
  return {open, label: open ? 'مفتوح الآن' : 'مغلق', day:DAYS[d], hours:H[0] + ' - ' + H[1]};
}

function paintInfo(){
  document.getElementById('restName').textContent = SET.name || '';
  document.getElementById('restAddr').textContent = SET.addr || '';
  document.getElementById('footName').textContent = (SET.name||'') + ' · ' + (SET.addr||'');

  document.getElementById('footPhone').textContent = wa ? '0' + String(wa).slice(3) : '';
  document.getElementById('mPrep').textContent = SET.prepTime || '25-35 د';
  document.getElementById('mRate').textContent = SET.rating || '4.2';
  document.getElementById('mRateN').innerHTML = '<span class="ltr">' + esc(SET.ratingCount || '') + '</span>';
  const fee = Number(SET.deliveryFee || 0), red = Number(SET.reducedFee || 0);
  document.getElementById('mFee').innerHTML = (red && red < fee)
    ? `<span class="now ltr">${red} ₪</span> <del class="ltr">${fee} ₪</del>`
    : `<span class="ltr">${fee} ₪</span>`;
  document.getElementById('coverImg').src = coverSrc();
  if(SET.logo){
    document.getElementById('logoBadge').innerHTML = `<img src="${esc(SET.logo)}" alt="">`;
    document.getElementById('splashLogo').innerHTML = `<img src="${esc(SET.logo)}" alt="">`;
  }
  document.getElementById('promos').innerHTML = (SET.promos || [])
    .map(p => `<div class="promo"><span class="pi">${esc(p.icon||'🏷️')}</span><span>${esc(p.text||'')}</span></div>`).join('');
  const s = restStatus();
  const st = document.getElementById('statusEl');
  st.textContent = s.label;
  st.className = 'status ' + (s.open ? 'open' : 'closed');
  document.getElementById('dayName').textContent = s.day;
  document.getElementById('dayHours').innerHTML = '<span class="ltr">' + s.hours + '</span>';
  document.getElementById('demoFlag').innerHTML = liveMode ? '' :
    `<div class="demo-flag">⚠️ <b>نسخة تجريبية.</b> المنيو والأسعار والصور وهمية — بتتبدل من صفحة الإدارة بعد ربط Firebase.</div>`;
}

function badgesOf(it){
  const b = [];
  if(it.available === false) b.push('<span class="bdg out">غير متوفر</span>');
  if(it.tag) b.push(`<span class="bdg">🔥 ${esc(it.tag)}</span>`);
  if(it.sale && it.sale < it.price) b.push(`<span class="bdg sale">خصم ${Math.round((1-it.sale/it.price)*100)}%</span>`);
  return b.length ? `<div class="badges">${b.join('')}</div>` : '';
}
function priceHtml(it){
  const p = it.sale && it.sale < it.price ? it.sale : it.price;
  const old = (it.sale && it.sale < it.price) ? `<span class="old ltr">${it.price} ₪</span>` : '';
  return `<span class="ltr">${p} ₪</span>${old}`;
}
function cardHtml(it){
  const off = it.available === false;
  return `<div class="card${off?' soldout':''}" onclick="${off?'':`openProduct('${it.id}')`}">
    <div class="ph">${badgesOf(it)}<img src="${ph(it)}" alt="${esc(it.name)}" loading="lazy"></div>
    <div class="body">
      <div class="nm">${esc(it.name)}</div>
      <div class="ds">${esc(it.desc||'')}</div>
      <div class="foot"><div class="pr">${priceHtml(it)}</div>${off?'':'<div class="add-btn">+</div>'}</div>
    </div></div>`;
}
function hcardHtml(it){
  return `<div class="hcard" onclick="openProduct('${it.id}')">
    <div class="ph">${badgesOf(it)}<img src="${ph(it)}" alt="${esc(it.name)}" loading="lazy"></div>
    <div class="body"><div class="nm">${esc(it.name)}</div><div class="pr">${priceHtml(it)}</div></div>
  </div>`;
}

function renderAll(){
  paintInfo();

  // أيقونات الأقسام
  document.getElementById('catIcons').innerHTML = CATS.map(c =>

  // بانر العرض
  const d = DEALS[0];
  document.getElementById('dealBox').innerHTML = d ? `

      <div class="d">${esc(d.desc||'')}</div>
      <div class="p"><small>فقط</small><span class="ltr">${Number(d.price)} ₪</span></div>
      <div class="go">اطلب الآن</div>
    </div>` : '';

  // الأكثر مبيعاً
  const best = liveItems().filter(i => i.best);
  document.getElementById('bestSec').style.display = best.length ? '' : 'none';
  document.getElementById('bestRow').innerHTML = best.map(hcardHtml).join('');

  renderSections();
  renderCatsView();
  paintCart();
}

function renderSections(){
  const host = document.getElementById('sections');
  if(searchQ){
    const hits = liveItems().filter(i => (i.name + ' ' + (i.desc||'')).includes(searchQ));
    document.getElementById('bestSec').style.display = 'none';
    document.getElementById('dealBox').style.display = 'none';
    host.innerHTML = hits.length
      ? `<div class="sec-head"><h2>نتائج البحث (${hits.length})</h2></div><div class="grid">${hits.map(cardHtml).join('')}</div>`
      : `<div class="empty"><div class="e">🔎</div><div>ما لقينا إشي باسم "${esc(searchQ)}"</div></div>`;
    return;
  }
  document.getElementById('dealBox').style.display = '';
  host.innerHTML = CATS.map(c => {
    const list = liveItems().filter(i => i.catId === c.id);
    if(!list.length) return '';
    return `<section id="sec-${c.id}">
      <div class="sec-head"><h2>${esc(c.icon||'')} ${esc(c.name)}</h2></div>
      <div class="grid">${list.map(cardHtml).join('')}</div></section>`;
  }).join('');
}
function renderCatsView(){
  document.getElementById('catsList').innerHTML = CATS.map(c => {
    const n = liveItems().filter(i => i.catId === c.id).length;
    return `<button class="promo" style="width:100%;margin-bottom:10px;background:#fff;box-shadow:var(--shadow)"
      onclick="go('home');setTimeout(()=>jumpTo('${c.id}'),60)">
      <span class="pi" style="font-size:26px">${esc(c.icon||'🍽️')}</span>
      <span style="flex:1;text-align:right">${esc(c.name)}</span>
      <span style="color:var(--muted);font-size:13px">${n} صنف</span></button>`;
  }).join('');
}
function jumpTo(catId){
  const el = document.getElementById('sec-' + catId);
  if(!el) return;
  window.scrollTo({top: el.getBoundingClientRect().top + window.scrollY - 16, behavior:'smooth'});
}
function onSearch(){ searchQ = document.getElementById('search').value.trim(); renderSections(); }

/* =====================================================================
   التبويبات
   ===================================================================== */
function go(v){
  if(v === 'cart'){ openCart(); return; }
  view = v;
  document.getElementById('viewHome').style.display   = v === 'home'   ? '' : 'none';
  document.getElementById('viewCats').style.display   = v === 'cats'   ? '' : 'none';
  document.getElementById('viewOrders').style.display = v === 'orders' ? '' : 'none';
  ['Home','Cats','Orders'].forEach(k =>
    document.getElementById('tab'+k).classList.toggle('on', v === k.toLowerCase()));
  document.getElementById('tabCart').classList.remove('on');
  if(v === 'orders') renderOrders();
  window.scrollTo({top:0});
}

/* =====================================================================
   نافذة المنتج
   ===================================================================== */
function openProduct(id){
  cur = byId(id); if(!cur) return;
  curQty = 1; curNote = ''; curSel = {};
  (cur.opts || []).forEach(gid => {
    const g = grp(gid); if(!g) return;
    curSel[gid] = g.type === 'one' ? (g.items[0] || {}).id : [];
  });
  drawProduct(); showSheet();
}
function base(it){ return (it.sale && it.sale < it.price) ? Number(it.sale) : Number(it.price); }
function unitPrice(){
  if(!cur) return 0;
  let p = base(cur);
  (cur.opts || []).forEach(gid => {
    const g = grp(gid); if(!g) return;
    if(g.type === 'one'){
      const o = g.items.find(x => x.id === curSel[gid]);
      if(o) p += Number(o.delta || 0);
    }else{
      (curSel[gid] || []).forEach(sid => {
        const o = g.items.find(x => x.id === sid);
        if(o) p += Number(o.delta || 0);
      });
    }
  });
  return p;
}
function drawProduct(){
  const it = cur;
  const groups = (it.opts || []).map(gid => {
    const g = grp(gid); if(!g) return '';
    let inner;
    if(g.type === 'one' && (g.style === 'tiles' || g.items.length <= 3)){
      const full = g.priceMode === 'full';
      inner = `<div class="tiles">` + g.items.map(o => {
        const sel = curSel[gid] === o.id;
        const d = Number(o.delta||0);
        const lbl = full ? (base(it) + d) + ' ₪' : (d ? '+ ' + d + ' ₪' : '');
        return `<button class="tile ${sel?'sel':''}" onclick="pick('${gid}','${o.id}')">
          <div class="tl">${esc(o.label)}</div>${lbl?`<div class="tp ltr">${lbl}</div>`:''}</button>`;
      }).join('') + `</div>`;
    }else{
      inner = g.items.map(o => {
        const sel = g.type === 'one' ? curSel[gid] === o.id : (curSel[gid]||[]).includes(o.id);
        return `<div class="opt ${sel?'sel':''}" onclick="pick('${gid}','${o.id}')">
          <div class="mark"></div><div class="lb">${esc(o.label)}</div>
          <div class="pp ltr">${Number(o.delta)? '+ '+Number(o.delta)+' ₪' : ''}</div></div>`;
      }).join('');
    }
    return `<div class="opt-group"><div class="opt-head">
        <span class="t">${esc(g.title)}</span>
        <span class="${g.required?'req':'opn'}">${g.required?'إلزامي':'اختياري'}</span>
      </div>${inner}</div>`;
  }).join('');

  document.getElementById('sheetScroll').innerHTML = `
    <div class="sheet-hero">${badgesOf(it)}<img src="${ph(it)}" alt=""></div>
    <div class="sheet-body">
      <h3>${esc(it.name)}</h3>
      <p class="ds">${esc(it.desc||'')}</p>
      <div style="font-size:24px;font-weight:900;color:var(--red);margin:-8px 0 16px">${priceHtml(it)}</div>
      ${groups}
      <div class="note-box">
        <label>ملاحظات خاصة</label>
        <textarea id="noteTa" rows="2" placeholder="مثال: بدون بصل، أو صوص خفيف..." oninput="curNote=this.value">${esc(curNote)}</textarea>
      </div>
    </div>`;
  drawProductFoot();
}
function drawProductFoot(){
  document.getElementById('sheetFoot').innerHTML = `
    <div class="qty">
      <button onclick="bumpQty(-1)">−</button>
      <span class="n" id="qtyN">${curQty}</span>
      <button onclick="bumpQty(1)">+</button>
    </div>
    <button class="cta" onclick="addToCart()">
      <span>إضافة للسلة</span><span id="curPrice">${money(unitPrice()*curQty)}</span>
    </button>`;
}
function pick(gid, oid){
  const g = grp(gid); if(!g) return;
  if(g.type === 'one') curSel[gid] = oid;
  else{
    const arr = curSel[gid] || [];
    const i = arr.indexOf(oid);
    if(i >= 0) arr.splice(i,1); else arr.push(oid);
    curSel[gid] = arr;
  }
  const sc = document.getElementById('sheetScroll').scrollTop;
  drawProduct();
  document.getElementById('sheetScroll').scrollTop = sc;
}
function bumpQty(d){
  curQty = Math.max(1, Math.min(50, curQty + d));
  document.getElementById('qtyN').textContent = curQty;
  document.getElementById('curPrice').textContent = money(unitPrice()*curQty);
}
function selLabels(){
  const out = [];
  (cur.opts || []).forEach(gid => {
    const g = grp(gid); if(!g) return;
    if(g.type === 'one'){
      const o = g.items.find(x => x.id === curSel[gid]);
      if(o && g.items.length > 1) out.push(o.label);
    }else{
      (curSel[gid] || []).forEach(sid => {
        const o = g.items.find(x => x.id === sid);
        if(o) out.push('+ ' + o.label);
      });
    }
  });
  return out;
}
function addToCart(){
  cart.push({
    key: Date.now() + '_' + Math.random().toString(36).slice(2,7),
    id: cur.id, n: cur.name, img: cur.img || '', catId: cur.catId,
    unit: unitPrice(), qty: curQty, note: curNote.trim(), labels: selLabels()
  });
  saveCart(); paintCart(); closeSheet(); toast('أُضيف للسلة ✓');
}
function openDeal(){
  const d = DEALS[0]; if(!d) return;
  cart.push({key:Date.now()+'_d', id:d.id, n:d.title, img:d.img||'', catId:'',
    unit:Number(d.price), qty:1, note:'', labels:[d.desc||'']});
  saveCart(); paintCart(); toast('أُضيف العرض للسلة ✓');
}

/* =====================================================================
   السلة
   ===================================================================== */
function saveCart(){ try{ localStorage.setItem('pz_cart', JSON.stringify(cart)); }catch(e){} }
function subtotal(){ return cart.reduce((s,l) => s + l.unit*l.qty, 0); }
function deliveryFee(){
  if(orderType === 'pickup') return 0;
  const f = Number(SET.deliveryFee||0), r = Number(SET.reducedFee||0), over = Number(SET.freeishOver||0);
  return (over && subtotal() >= over) ? r : f;
}
function grandTotal(){ return subtotal() + deliveryFee(); }
function cartCount(){ return cart.reduce((s,l) => s + l.qty, 0); }
function paintCart(){
  const n = cartCount();
  document.getElementById('cartCount').textContent = n;
  document.getElementById('cartTotal').textContent = money(subtotal());
  document.getElementById('cartbar').classList.toggle('on', n > 0);
  const dot = document.getElementById('tabDot');
  dot.style.display = n > 0 ? '' : 'none';
  dot.textContent = n;
}
function imgOfLine(l){ return ph({img:l.img, catId:l.catId}); }

function openCart(){
  const s = restStatus();
  const lines = cart.map((l,i) => `
    <div class="cart-item">
      <div class="ph"><img src="${imgOfLine(l)}" alt=""></div>
      <div class="mid">
        <div class="nm">${esc(l.n)}</div>
        ${l.labels.length ? `<div class="sub">${esc(l.labels.join(' · '))}</div>` : ''}
        ${l.note ? `<div class="sub">📝 ${esc(l.note)}</div>` : ''}
        <div class="rowb">
          <div class="pr">${money(l.unit*l.qty)}</div>
          <div class="miniqty">
            <button onclick="lineQty(${i},-1)">${l.qty===1?'🗑':'−'}</button>
            <span class="n">${l.qty}</span>
            <button onclick="lineQty(${i},1)">+</button>
          </div>
        </div>
      </div>
    </div>`).join('');

  const over = Number(SET.freeishOver||0);
  const body = cart.length ? `
    <div class="sheet-body">
      <h3>سلة المشتريات</h3>
      ${!s.open ? `<div class="closed-note">المطعم مغلق حالياً 🌙<br>جهّز طلبك وابعته لما يفتح (<span class="ltr">${s.hours}</span>)</div>` : ''}
      <div class="seg">
        <button class="${orderType==='delivery'?'on':''}" onclick="setType('delivery')">🛵 توصيل</button>
        <button class="${orderType==='pickup'?'on':''}" onclick="setType('pickup')">🏪 استلام من المحل</button>
      </div>
      ${lines}
      <div class="field" style="margin-top:18px"><label>الاسم</label>
        <input id="cName" placeholder="اسمك" value="${esc(localStorage.getItem('pz_name')||'')}"></div>
      <div class="field"><label>رقم الهاتف</label>
        <input id="cPhone" type="tel" inputmode="tel" placeholder="05x-xxxxxxx" value="${esc(localStorage.getItem('pz_phone')||'')}"></div>
      ${orderType==='delivery' ? `<div class="field"><label>العنوان</label>
        <input id="cAddr" placeholder="الحي، الشارع، رقم البيت" value="${esc(localStorage.getItem('pz_addr')||'')}"></div>` : ''}
      <div class="sum">
        <div class="r"><span>المجموع الفرعي</span><span>${money(subtotal())}</span></div>
        <div class="r"><span>رسوم التوصيل</span><span>${orderType==='pickup'?'مجاني':money(deliveryFee())}</span></div>
        <div class="r total"><span>المجموع الكلي</span><span>${money(grandTotal())}</span></div>
      </div>
      <div class="pay-note"><span style="font-size:19px">🕐</span>
        <span>وقت التوصيل المتوقع: <b>${esc(SET.prepTime||'25-35 د')}</b></span></div>
      <div class="pay-note"><span style="font-size:19px">💵</span>
        <span>الدفع عند الاستلام — <b>متاح دائماً</b></span></div>
      <div class="hint">
        ${orderType==='delivery' && over && subtotal() < over
          ? `كمّل لـ <span class="ltr">${over} ₪</span> وخلّي التوصيل <span class="ltr">${Number(SET.reducedFee)} ₪</span> بدل <span class="ltr">${Number(SET.deliveryFee)} ₪</span>`
          : 'الطلب بوصل للمطعم مباشرة'}
      </div>
    </div>` : `<div class="empty"><div class="e">🛒</div><div>السلة فاضية</div></div>`;

  document.getElementById('sheetScroll').innerHTML = body;
  const min = Number(SET.minOrder || 0);
  const ok = subtotal() >= min;
  document.getElementById('sheetFoot').innerHTML = cart.length ? `
    <button class="cta" id="sendBtn" onclick="sendOrder()" ${ok?'':'disabled'}>
      ${ok ? `<span>✅ إتمام الطلب</span><span>${money(grandTotal())}</span>`
           : `<span>أقل طلبية <span class="ltr">${min} ₪</span></span>`}
    </button>` : `<button class="cta" onclick="closeSheet()">تصفّح المنيو</button>`;
  cur = null; showSheet();
}
function setType(t){ orderType = t; openCart(); }
function lineQty(i, d){
  cart[i].qty += d;
  if(cart[i].qty <= 0) cart.splice(i,1);
  saveCart(); paintCart(); openCart();
}

async function sendOrder(){
  const name  = (document.getElementById('cName')?.value || '').trim();
  const phone = (document.getElementById('cPhone')?.value || '').trim();
  const addr  = (document.getElementById('cAddr')?.value || '').trim();
  if(!name || !phone){ alert('لو سمحت اكتب الاسم ورقم الهاتف'); return; }
  if(orderType === 'delivery' && !addr){ alert('لو سمحت اكتب العنوان للتوصيل'); return; }
  try{
    localStorage.setItem('pz_name', name);
    localStorage.setItem('pz_phone', phone);
    localStorage.setItem('pz_addr', addr);
  }catch(e){}

  const btn = document.getElementById('sendBtn');
  if(btn){ btn.disabled = true; btn.innerHTML = '<span>جاري الإرسال...</span>'; }

  const order = {
    items: cart.map(l => ({name:l.n, qty:l.qty, unit:l.unit, labels:l.labels, note:l.note})),
    customer:{name, phone, addr},
    type: orderType,
    subtotal: subtotal(),
    fee: deliveryFee(),
    total: grandTotal(),
    status: 'new',
    createdAt: new Date().toISOString()
  };

  let saved = false;
  if(liveMode && db){
    try{
      await db.collection('orders').add(
        Object.assign({}, order, {createdAt: firebase.firestore.FieldValue.serverTimestamp(), createdAtStr: order.createdAt}));
      saved = true;
    }catch(e){ console.error('order save', e); }
  }

  try{
    history_.unshift(order);
    history_ = history_.slice(0,20);
    localStorage.setItem('pz_orders', JSON.stringify(history_));
  }catch(e){}

  // واتساب — دائماً، حتى لو انحفظ بالنظام
  let t = `*طلب جديد - ${SET.name || ''}*\n\n`;
  cart.forEach(l => {
    t += `• ${l.qty}× ${l.n} — ${(l.unit*l.qty).toFixed(2)} ₪\n`;
    if(l.labels.length) t += `   ${l.labels.join(' · ')}\n`;
    if(l.note) t += `   📝 ${l.note}\n`;
  });
  t += `\nالمجموع: ${subtotal().toFixed(2)} ₪`;
  t += `\nالتوصيل: ${orderType === 'pickup' ? 'استلام من المحل' : deliveryFee().toFixed(2) + ' ₪'}`;
  t += `\n*الإجمالي: ${grandTotal().toFixed(2)} ₪*`;
  t += `\n\n👤 ${name}\n📞 ${phone}`;
  if(orderType === 'delivery') t += `\n📍 ${addr}`;
  const wa = SET.phone || window.WHATSAPP;
  window.open('https://wa.me/' + wa + '?text=' + encodeURIComponent(t), '_blank');

  cart = []; saveCart(); paintCart(); closeSheet();
  toast(saved ? 'تم إرسال طلبك ✓' : 'تم فتح واتساب — ابعت الرسالة');
}

/* =====================================================================
   طلباتي
   ===================================================================== */
function renderOrders(){
  const host = document.getElementById('ordersList');
  if(!history_.length){
    host.innerHTML = `<div class="empty"><div class="e">🧾</div><div>ما عندك طلبات بعد</div></div>`;
    return;
  }
  host.innerHTML = history_.map((o,i) => {
    const d = new Date(o.createdAt);
    const ds = d.toLocaleDateString('ar-EG') + ' · ' + d.toLocaleTimeString('ar-EG',{hour:'2-digit',minute:'2-digit'});
    return `<div class="ord">
      <div class="h"><span class="dt">${esc(ds)}</span><span class="tt">${money(o.total)}</span></div>
      <div class="ls">${o.items.map(it => `${it.qty}× ${esc(it.name)}`).join('<br>')}</div>
      <button class="again" onclick="reorder(${i})">🔁 اطلب نفس الطلب</button>
    </div>`;
  }).join('');
}
function reorder(i){
  const o = history_[i]; if(!o) return;
  o.items.forEach(it => cart.push({
    key: Date.now()+'_'+Math.random().toString(36).slice(2,7),
    id:'', n:it.name, img:'', catId:'',
    unit:it.unit, qty:it.qty, note:it.note||'', labels:it.labels||[]
  }));
  saveCart(); paintCart(); toast('أُضيف للسلة ✓'); go('home');
}

/* =====================================================================
   أدوات
   ===================================================================== */
function showSheet(){
  document.getElementById('sheetBg').classList.add('on');
  document.getElementById('sheet').classList.add('on');
  document.body.style.overflow = 'hidden';
}
function closeSheet(){
  document.getElementById('sheetBg').classList.remove('on');
  document.getElementById('sheet').classList.remove('on');
  document.body.style.overflow = '';
  document.getElementById('sheetScroll').scrollTop = 0;
}
let toastT = null;
function toast(msg){
  const el = document.getElementById('toast');
  el.textContent = msg; el.classList.add('on');
  clearTimeout(toastT);
  toastT = setTimeout(() => el.classList.remove('on'), 2200);
}
function toggleFav(b){ b.textContent = b.textContent.trim() === '🤍' ? '❤️' : '🤍'; }
function shareRest(){
  const d = {title:SET.name, text:'اطلب من ' + SET.name, url:location.href};
  if(navigator.share) navigator.share(d).catch(()=>{});
  else{ try{navigator.clipboard.writeText(location.href);}catch(e){} toast('تم نسخ الرابط'); }
}
function openInfo(){
  const s = restStatus();
  const rows = DAYS.map((nm,d) => {
    const H = (SET.hours||{})[d] || (SET.hours||{})[String(d)];
    return `<div class="r"><span>${nm}</span><span class="ltr">${H&&H[0] ? H[0]+' - '+H[1] : 'مغلق'}</span></div>`;
  }).join('');
  document.getElementById('sheetScroll').innerHTML = `
    <div class="sheet-body">
      <h3>${esc(SET.name||'')}</h3>
      <p class="ds">${esc(SET.addr||'')}</p>
      <div class="sum" style="margin-top:0">
        <div class="r" style="font-weight:800;color:var(--ink)"><span>ساعات الدوام</span><span>${s.open?'مفتوح الآن':'مغلق'}</span></div>
        ${rows}
      </div>
      <div class="sum">
        <div class="r"><span>رسوم التوصيل</span><span class="ltr">${Number(SET.deliveryFee||0)} ₪</span></div>
        <div class="r"><span>فوق <span class="ltr">${Number(SET.freeishOver||0)} ₪</span></span><span class="ltr">${Number(SET.reducedFee||0)} ₪</span></div>
        <div class="r"><span>أقل طلبية</span><span class="ltr">${Number(SET.minOrder||0)} ₪</span></div>
        <div class="r"><span>وقت التحضير</span><span>${esc(SET.prepTime||'')}</span></div>
      </div>
    </div>`;
  document.getElementById('sheetFoot').innerHTML = `<button class="cta" onclick="closeSheet()">تمام</button>`;
  cur = null; showSheet();
}

/* تمييز القسم أثناء التمرير */
let ticking = false;
window.addEventListener('scroll', () => {
  if(ticking || view !== 'home') return;
  ticking = true;
  requestAnimationFrame(() => {
    ticking = false;
    let found = null;
    CATS.forEach(c => {
      const el = document.getElementById('sec-' + c.id);
      if(el && el.getBoundingClientRect().top <= 120) found = c.id;
    });
    document.querySelectorAll('.cat-ic').forEach(b =>
      b.classList.toggle('on', b.dataset.cat === found));
  });
}, {passive:true});

/* البداية */
function maybeHideSplash(){
  if(splashDone) return;
  if(!(ready.cats && ready.items && ready.groups && ready.set)) return;
  const wait = Math.max(0, SPLASH_MIN - (Date.now() - splashStart));
  setTimeout(hideSplash, wait);
}
function hideSplash(){
  if(splashDone) return;
  splashDone = true;
  const s = document.getElementById('splash');
  s.classList.add('off');
  setTimeout(() => { s.style.display = 'none'; }, 500);
}
setTimeout(hideSplash, 9000);   // شبكة أمان

(function boot(){
  if(!startFirebase()) useDemo();
  renderAll();
  maybeHideSplash();
  setInterval(paintInfo, 60000);
})();
</script>

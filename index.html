<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover">
<meta name="theme-color" content="#121212">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png?v=2">
<link rel="icon" href="icon-192.png?v=2">

<meta property="og:title" content="مكسيكاني وبيتسا أم الفحم">
<meta property="og:description" content="اطلب أونلاين — توصيل بنص السعر وممكن ببلاش!">
<meta property="og:image" content="https://sambosicamalfham.github.io/og.jpg?v=2">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">

<meta name="twitter:image" content="https://sambosicamalfham.github.io/og.jpg?v=2">

<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="مكسيكاني وبيتسا">
<title>مكسيكاني وبيتسا أم الفحم - رهط</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&family=Heebo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --red:#e3242b; --red-2:#c3161d; --red-soft:#ffeaeb;
  --ink:#1a1a1a; --ink-2:#555; --muted:#6b6b6b;
  --bg:#f7f6f5; --card:#fff; --line:#eee;
  --gold:#f5b228; --green:#1a9c53;
  --r:18px; --r-lg:22px;
  --sh:0 2px 12px rgba(0,0,0,.06);
  --sh-2:0 6px 22px rgba(0,0,0,.09);
  --sh-lg:0 14px 40px rgba(0,0,0,.18);
  --w:560px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{font-family:'Cairo',system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--ink);
  padding-bottom:84px;overflow-x:hidden;-webkit-font-smoothing:antialiased}
.app{max-width:var(--w);margin:0 auto;position:relative;min-height:100vh}
img{display:block;max-width:100%}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;padding:0}
.ltr{direction:ltr;unicode-bidi:isolate;display:inline-block}

/* ============ شاشة البداية ============ */
#splash{position:fixed;inset:0;z-index:999;background:#121212;display:grid;place-items:center;transition:opacity .45s}
#splash.off{opacity:0;pointer-events:none}
#splash .in{text-align:center;color:#fff}
#splash .lg{width:112px;height:112px;border-radius:50%;background:#000;border:5px solid #fff;margin:0 auto 20px;
  display:grid;place-items:center;overflow:hidden}
#splash .lg img{width:100%;height:100%;object-fit:cover}
#splash .lg .t{font-weight:900;font-size:13px;line-height:1.3}
#splash .lg .t b{color:#ff3b4a;display:block}
#splash h2{margin:0 0 6px;font-size:21px;font-weight:900}
#splash p{margin:0;opacity:.55;font-size:14px}
#splash .bar{width:120px;height:3px;background:rgba(255,255,255,.16);border-radius:3px;margin:22px auto 0;overflow:hidden}
#splash .bar i{display:block;height:100%;width:40%;background:var(--red);border-radius:3px;animation:sl 1.1s infinite}
@keyframes sl{0%{transform:translateX(150%)}100%{transform:translateX(-300%)}}

/* ============ الغلاف ============ */
.hero{position:relative;min-height:268px;background:#20150f;overflow:hidden;padding-bottom:34px}
.hero .bgimg{position:absolute;inset:0}
.hero .bgimg img{width:100%;height:100%;object-fit:cover}
.hero .shade{position:absolute;inset:0;
  background:linear-gradient(180deg,rgba(10,6,4,.72) 0%,rgba(10,6,4,.28) 42%,rgba(10,6,4,.86) 100%)}
.hero-in{position:relative;z-index:2;padding:16px 16px 0}
.hero-top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.icn-btn{width:42px;height:42px;flex:none;border-radius:13px;display:grid;place-items:center;font-size:19px;color:#fff;
  background:rgba(255,255,255,.14);backdrop-filter:blur(8px)}
.brand{text-align:center;color:#fff;flex:1}
.brand .mark{width:62px;height:62px;border-radius:50%;overflow:hidden;margin:0 auto 6px;
  background:rgba(0,0,0,.35);display:grid;place-items:center}
.brand .mark img{width:100%;height:100%;object-fit:cover}
.brand .mark .e{font-size:30px}
.brand .nm{font-size:20px;font-weight:900;line-height:1.2}
.brand .tg{font-size:11.5px;opacity:.72;margin-top:2px}

.hero-badge{position:relative;z-index:2;margin:18px 16px 0 auto;max-width:238px;
  background:var(--red);color:#fff;border-radius:16px;padding:13px 15px;box-shadow:0 8px 22px rgba(227,36,43,.4)}
.hero-badge .t{font-size:16.5px;font-weight:900;line-height:1.25}
.hero-badge .s{font-size:12.5px;opacity:.9;margin-top:3px;line-height:1.45}
.hero-badge .go{width:34px;height:34px;border-radius:50%;background:#fff;color:var(--red);
  display:grid;place-items:center;font-size:17px;font-weight:900;margin-top:10px}

.searchwrap{position:relative;z-index:3;margin:-22px 16px 0}
.searchbar{height:52px;border-radius:999px;background:#fff;box-shadow:var(--sh-2);
  display:flex;align-items:center;gap:10px;padding:0 18px}
.searchbar input{flex:1;border:none;background:none;outline:none;font-family:inherit;font-size:15px;color:var(--ink)}
.searchbar input::placeholder{color:#b0b0b0}
.searchbar .si{color:var(--muted);font-size:17px}

/* ============ أيقونات الأقسام ============ */
.cats{display:flex;gap:10px;overflow-x:auto;padding:18px 16px 8px;scrollbar-width:none}
.cats::-webkit-scrollbar{display:none}
.cat{flex:none;width:78px;text-align:center}
.cat .bx{height:64px;border-radius:18px;background:#fff;box-shadow:var(--sh);
  display:grid;place-items:center;font-size:30px;margin-bottom:7px;transition:.18s;border:2px solid transparent}
.cat.on .bx{background:var(--red);border-color:var(--red);box-shadow:0 6px 18px rgba(227,36,43,.32);transform:translateY(-2px)}
.cat .lb{font-size:12.5px;font-weight:700;color:var(--ink-2);line-height:1.3}
.cat.on .lb{color:var(--red)}

/* ============ عناوين الأقسام ============ */
.sh{display:flex;align-items:center;justify-content:space-between;padding:20px 16px 11px}
.sh h2{margin:0;font-size:18.5px;font-weight:900}
.sh .all{color:var(--red);font-weight:700;font-size:13.5px}

/* ============ بانر العرض ============ */
.deal{margin:0 16px;border-radius:var(--r-lg);overflow:hidden;position:relative;
  background:linear-gradient(120deg,#1c1c1c 0%,#30190f 100%);color:#fff;box-shadow:var(--sh-2);
  min-height:150px;display:flex;align-items:center}
.deal .txt{padding:18px;flex:1;position:relative;z-index:2;max-width:70%}
.deal .t{font-size:19px;font-weight:900;margin-bottom:5px}
.deal .d{font-size:12.5px;opacity:.78;line-height:1.6;margin-bottom:11px}
.deal .p{font-size:30px;font-weight:900;color:var(--gold);line-height:1;display:flex;align-items:baseline;gap:6px}
.deal .p small{font-size:13px;font-weight:700;color:#fff;opacity:.75}
.deal .go{margin-top:12px;background:var(--red);color:#fff;font-weight:800;font-size:13.5px;
  padding:9px 20px;border-radius:11px;display:inline-block}
.deal .pic{position:absolute;inset-inline-start:-8px;top:0;bottom:0;width:46%;z-index:1}
.deal .pic img{width:100%;height:100%;object-fit:cover;
  -webkit-mask-image:linear-gradient(to right,transparent,#000 42%);mask-image:linear-gradient(to right,transparent,#000 42%)}
.deal .em{position:absolute;inset-inline-start:6px;bottom:-16px;font-size:86px;opacity:.2;z-index:1}

/* ============ بانر عرض خاص ============ */
.wide{margin:0 16px 12px;border-radius:var(--r-lg);overflow:hidden;position:relative;height:150px;
  box-shadow:var(--sh-2);background:#2a1a12}
.wide>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.wide .ov{position:absolute;inset:0;background:linear-gradient(90deg,rgba(0,0,0,.86) 36%,rgba(0,0,0,.1) 100%)}
.wide .c{position:relative;z-index:2;padding:16px;color:#fff;height:100%;
  display:flex;flex-direction:column;justify-content:center;max-width:66%}
.wide .t{font-size:17px;font-weight:900;line-height:1.3}
.wide .d{font-size:12px;opacity:.78;margin-top:3px}
.wide .pr{margin-top:9px;display:flex;align-items:baseline;gap:8px}
.wide .pr b{font-size:27px;font-weight:900;color:var(--gold)}
.wide .pr s{font-size:14px;opacity:.6}
.wide .tag{position:absolute;bottom:14px;inset-inline-start:14px;z-index:3;background:var(--red);color:#fff;
  font-size:11.5px;font-weight:800;padding:5px 11px;border-radius:9px}

/* ============ كروت المنتجات ============ */
.row{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;padding:2px 16px 8px}
.row::-webkit-scrollbar{display:none}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:2px 16px 10px}
.pc{background:var(--card);border-radius:var(--r);overflow:hidden;box-shadow:var(--sh);
  display:flex;flex-direction:column;position:relative;transition:transform .12s}
.row .pc{width:auto;min-width:0}
.pc:active{transform:scale(.98)}
.pc.off{opacity:.5}
.pc .ph{height:118px;position:relative;overflow:hidden;background:#eee}
.pc .ph img{width:100%;height:100%;object-fit:cover}
img.tall{object-fit:contain!important;background:#fff;padding:6px 0}
.pc .bd{padding:11px 12px 12px;display:flex;flex-direction:column;flex:1}
.pc .nm{font-size:14px;font-weight:800;line-height:1.35}
.pc .ds{font-size:11.5px;color:var(--muted);margin-top:4px;line-height:1.5;height:34px;overflow:hidden}
.pc .ft{display:flex;align-items:center;justify-content:space-between;margin-top:10px}
.pc .pr{font-weight:900;font-size:16px;color:var(--red)}
.pc .pr s{color:#c4c4c4;font-size:12.5px;font-weight:600;margin-inline-start:5px}
.plus{width:32px;height:32px;flex:none;border-radius:50%;background:var(--red);color:#fff;font-size:19px;font-weight:700;
  display:grid;place-items:center;line-height:0;box-shadow:0 3px 9px rgba(227,36,43,.34)}
.bdgs{position:absolute;top:8px;inset-inline-end:8px;display:flex;flex-direction:column;gap:5px;align-items:flex-end;z-index:2}
.bdg{font-size:10.5px;font-weight:800;padding:4px 9px;border-radius:8px;background:#fff;color:var(--ink-2);box-shadow:0 1px 5px rgba(0,0,0,.14)}
.bdg.r{background:var(--red);color:#fff}
.bdg.k{background:#2b2b2b;color:#fff}

/* ============ النوافذ ============ */
.bg{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:60;opacity:0;pointer-events:none;transition:opacity .25s}
.bg.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:61;max-width:var(--w);margin:0 auto;background:var(--bg);
  border-radius:24px 24px 0 0;height:96vh;display:flex;flex-direction:column;
  transform:translateY(102%);transition:transform .32s cubic-bezier(.3,.85,.3,1);box-shadow:var(--sh-lg);overflow:hidden}
.sheet.on{transform:translateY(0)}
.sc{overflow-y:auto;-webkit-overflow-scrolling:touch;flex:1}
.float{position:absolute;top:14px;z-index:5;direction:ltr;width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.95);
  display:grid;place-items:center;font-size:17px;box-shadow:0 3px 10px rgba(0,0,0,.22)}
.float.a{inset-inline-end:14px} .float.b{inset-inline-start:14px} .float.c{inset-inline-start:62px}

/* صفحة المنتج */
.phero{height:242px;position:relative;overflow:hidden;background:#ddd}
.phero>img{width:100%;height:100%;object-fit:cover}
.pbody{background:var(--bg);border-radius:24px 24px 0 0;margin-top:-26px;position:relative;z-index:2;padding:20px 16px 24px}
.pbody h3{margin:0 0 7px;font-size:22px;font-weight:900}
.pbody .ds{color:var(--ink-2);font-size:13.5px;line-height:1.65;margin:0 0 12px}
.pbody .price{font-size:27px;font-weight:900;color:var(--red);margin-bottom:12px}
.rrow{display:flex;align-items:center;gap:9px;margin-bottom:20px;flex-wrap:wrap}
.rrow .st{display:flex;align-items:center;gap:5px;font-weight:800;font-size:14px}
.rrow .st span{color:var(--muted);font-weight:600;font-size:13px}
.rrow .hot{background:var(--red-soft);color:var(--red);font-size:11.5px;font-weight:800;padding:5px 11px;border-radius:9px}

.og{margin-bottom:20px}
.og .t{font-weight:900;font-size:16px;margin-bottom:11px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.og .t .rq{font-size:11px;font-weight:700;background:var(--red-soft);color:var(--red);padding:3px 9px;border-radius:7px}
.og .t .op{font-size:11px;font-weight:700;background:#ececec;color:var(--muted);padding:3px 9px;border-radius:7px}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.tile{background:#fff;border:1.5px solid var(--line);border-radius:15px;padding:13px 6px;text-align:center;transition:.16s}
.tile .ic{font-size:22px;margin-bottom:5px}
.tile .l{font-weight:800;font-size:13px;line-height:1.3}
.tile .p{font-size:12.5px;font-weight:700;color:var(--muted);margin-top:4px}
.tile.sel{background:var(--red);border-color:var(--red);color:#fff;box-shadow:0 5px 15px rgba(227,36,43,.3)}
.tile.sel .p{color:rgba(255,255,255,.88)}
.olist{background:#fff;border:1.5px solid var(--line);border-radius:15px;overflow:hidden}
.o{display:flex;align-items:center;gap:11px;padding:13px 14px;border-bottom:1px solid #f4f4f4;font-size:14px}
.o:last-child{border-bottom:none}
.o .mk{width:21px;height:21px;flex:none;border-radius:6px;border:2px solid #d6d6d6;display:grid;place-items:center;transition:.14s}
.o.sel .mk{border-color:var(--red);background:var(--red)}
.o.sel .mk::after{content:'✓';color:#fff;font-size:11.5px;font-weight:900}
.o .l{flex:1;font-weight:700}
.o .p{color:var(--muted);font-weight:700;font-size:13.5px}
.ta{width:100%;background:#fff;border:1.5px solid var(--line);border-radius:15px;padding:13px;
  font-family:inherit;font-size:14px;resize:none;outline:none;min-height:70px}
.ta:focus{border-color:var(--red)}

.foot{padding:12px 16px calc(14px + env(safe-area-inset-bottom));background:#fff;border-top:1px solid var(--line);
  display:flex;align-items:center;gap:12px}
.qty{display:flex;align-items:center;gap:11px;direction:ltr}
.qc{width:38px;height:38px;flex:none;border-radius:50%;background:var(--red);color:#fff;font-size:21px;font-weight:700;
  display:grid;place-items:center;line-height:0;box-shadow:0 3px 10px rgba(227,36,43,.3)}
.qc:disabled{background:#d8d8d8;box-shadow:none}
.qty .n{min-width:22px;text-align:center;font-weight:900;font-size:17px}
.cta{flex:1;height:52px;border-radius:15px;background:var(--red);color:#fff;font-weight:800;font-size:15.5px;
  display:flex;align-items:center;justify-content:center;gap:10px;box-shadow:0 5px 16px rgba(227,36,43,.3)}
.cta:active{background:var(--red-2)}
.cta:disabled{background:#cfcfcf;box-shadow:none}

/* السلة */
.ctop{display:flex;align-items:center;justify-content:space-between;padding:16px;background:#fff;border-bottom:1px solid var(--line)}
.ctop h3{margin:0;font-size:18px;font-weight:900}
.ctop button{font-size:19px;color:var(--muted)}
.cwrap{padding:16px}
.ci{background:#fff;border-radius:var(--r);padding:12px;box-shadow:var(--sh);margin-bottom:10px;display:flex;gap:12px}
.ci .ph{width:68px;height:68px;border-radius:14px;overflow:hidden;flex:none;background:#eee}
.ci .ph img{width:100%;height:100%;object-fit:cover}
.ci .m{flex:1;min-width:0}
.ci .nm{font-weight:800;font-size:14.5px}
.ci .op{font-size:11.5px;color:var(--muted);margin-top:3px;line-height:1.55}
.ci .b{display:flex;align-items:center;justify-content:space-between;margin-top:9px}
.ci .pr{font-weight:900;font-size:16px;color:var(--red)}
.mq{display:flex;align-items:center;gap:9px}
.mq button{width:30px;height:30px;border-radius:9px;background:#f3f1ef;display:grid;place-items:center;font-size:15px;font-weight:700}
.mq button.p{background:var(--red);color:#fff}
.mq .n{min-width:18px;text-align:center;font-weight:800;font-size:14px}

.seg{display:flex;background:#eceae8;border-radius:15px;padding:4px;margin-bottom:14px}
.seg button{flex:1;height:42px;border-radius:12px;font-weight:800;font-size:14px;color:var(--ink-2)}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 2px 8px rgba(0,0,0,.1)}

.rowcard{background:#fff;border-radius:var(--r);padding:14px;box-shadow:var(--sh);margin-bottom:10px}
.rowcard .hd{display:flex;align-items:center;gap:10px;font-weight:800;font-size:14.5px}
.rowcard .hd .ic{width:30px;height:30px;border-radius:9px;background:var(--red-soft);color:var(--red);
  display:grid;place-items:center;font-size:14px;flex:none;font-weight:900}
.inp{width:100%;height:46px;border:1.5px solid var(--line);border-radius:13px;padding:0 13px;
  font-family:inherit;font-size:14.5px;outline:none;background:#fafafa}
.inp:focus{border-color:var(--red);background:#fff}
.cpn-row{display:flex;gap:9px;margin-top:10px}
.cpn-row .inp{flex:1}
.cpn-row button{padding:0 20px;border-radius:13px;background:var(--ink);color:#fff;font-weight:800;font-size:14px}
.cpn-ok{margin-top:10px;background:#e8f7ee;color:var(--green);border-radius:11px;padding:10px 12px;font-size:13px;
  font-weight:700;display:flex;justify-content:space-between;align-items:center;gap:8px}
.cpn-ok button{color:var(--red);font-weight:800;font-size:12.5px}
.cpn-no{margin-top:10px;background:var(--red-soft);color:var(--red-2);border-radius:11px;padding:10px 12px;font-size:13px;font-weight:700}

.sum{background:#fff;border-radius:var(--r);padding:16px;box-shadow:var(--sh);margin-bottom:12px}
.sum h4{margin:0 0 10px;font-size:16px;font-weight:900}
.sum .r{display:flex;justify-content:space-between;padding:7px 0;font-size:14px;color:var(--ink-2)}
.sum .r.disc{color:var(--red);font-weight:700}
.sum .tot{display:flex;justify-content:space-between;align-items:center;background:var(--red-soft);
  border-radius:13px;padding:13px 14px;margin-top:11px;font-size:17px;font-weight:900}
.sum .tot b{color:var(--red)}

.inf{background:#fff;border-radius:var(--r);box-shadow:var(--sh);overflow:hidden;margin-top:12px}
.inf .r{display:flex;align-items:center;gap:12px;padding:14px;border-bottom:1px solid #f5f5f5}
.inf .r:last-child{border-bottom:none}
.inf .ic{width:36px;height:36px;border-radius:11px;background:#f5f3f1;display:grid;place-items:center;font-size:17px;flex:none}
.inf .tx{flex:1;font-size:13.5px}
.inf .tx b{display:block;font-weight:700;color:var(--ink)}
.inf .tx span{color:var(--muted);font-size:12.5px}
.inf .tx span.hot{color:var(--red);font-weight:800}

.closed{background:var(--red-soft);color:var(--red-2);border-radius:14px;padding:13px;font-size:13.5px;
  font-weight:700;text-align:center;margin-bottom:14px;line-height:1.65}
.empty{text-align:center;padding:60px 20px;color:var(--muted)}
.empty .e{font-size:52px;margin-bottom:14px}
.fld{margin-bottom:11px}
.fld label{display:block;font-weight:700;font-size:13.5px;margin-bottom:6px}

/* طلباتي */
.ord{background:#fff;border-radius:var(--r);padding:14px;box-shadow:var(--sh);margin-bottom:10px}
.ord .h{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;gap:8px}
.ord .dt{font-size:12px;color:var(--muted)}
.ord .tt{font-weight:900;color:var(--red)}
.ord .ls{font-size:13px;color:var(--ink-2);line-height:1.8}
.ord .ag{margin-top:11px;background:var(--red-soft);color:var(--red);font-weight:800;font-size:13.5px;
  padding:10px 0;border-radius:12px;width:100%}

/* الشريط السفلي */
.tabs{position:fixed;bottom:0;left:0;right:0;z-index:40;max-width:var(--w);margin:0 auto;background:#fff;
  border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);
  padding-bottom:env(safe-area-inset-bottom);box-shadow:0 -3px 18px rgba(0,0,0,.05)}
.tab{padding:10px 0 9px;text-align:center;color:#767676;font-size:11px;font-weight:700;position:relative}
.tab .i{font-size:20px;display:block;margin-bottom:2px;line-height:1.1}
.tab.on{color:var(--red)}
.tab .dot{position:absolute;top:5px;right:calc(50% - 21px);background:var(--red);color:#fff;font-size:10px;
  font-weight:800;min-width:17px;height:17px;border-radius:9px;display:grid;place-items:center;padding:0 5px}

.cartbar{position:fixed;bottom:72px;left:0;right:0;z-index:39;max-width:var(--w);margin:0 auto;padding:0 16px;
  transform:translateY(170%);transition:transform .28s cubic-bezier(.3,.85,.3,1)}
.cartbar.on{transform:translateY(0)}
.cartbar .in{background:var(--ink);color:#fff;border-radius:16px;height:54px;display:flex;align-items:center;
  justify-content:space-between;padding:0 16px;box-shadow:var(--sh-lg)}
.cartbar .c{background:rgba(255,255,255,.17);border-radius:9px;padding:4px 10px;font-weight:800;font-size:13.5px}
.cartbar .l{font-weight:800;font-size:15px}
.cartbar .t{font-weight:900;font-size:17px}

.demo{background:#fff8e1;border:1.5px dashed #e0b73a;color:#7a5c00;border-radius:14px;padding:12px 14px;
  margin:14px 16px 0;font-size:12.5px;line-height:1.7;font-weight:600}
.fn{text-align:center;padding:24px 20px 30px;color:var(--muted);font-size:12.5px;line-height:1.8}
.toast{position:fixed;bottom:140px;left:50%;transform:translateX(-50%) translateY(16px);background:#1a1a1a;color:#fff;
  padding:12px 20px;border-radius:13px;font-weight:700;font-size:14px;z-index:95;opacity:0;pointer-events:none;transition:.25s}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.sheet.on ~ .toast{bottom:auto;top:78px;transform:translateX(-50%) translateY(-16px)}
.sheet.on ~ .toast.on{transform:translateX(-50%) translateY(0)}
.vh{padding-top:22px}
.vh h2{margin:0 0 14px;font-size:21px;font-weight:900;padding:0 16px}
/* ===== مكان الإضافة على البيتسا ===== */
.sidebox{background:var(--red-soft);border-bottom:1px solid var(--line);padding:10px 14px 14px}
.side{display:flex;gap:8px}
.side.q{margin-top:8px;gap:6px}
.side.q button{font-size:11px;padding:6px 2px;line-height:1.3}
.side.q button svg{width:32px;height:32px}
.side button{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 4px;
  background:#fff;border:2px solid transparent;border-radius:14px;font:inherit;font-size:12px;font-weight:700;
  color:var(--ink-2);cursor:pointer;transition:border-color .15s,transform .15s}
.side button svg{width:38px;height:38px}
.side button.on{border-color:var(--red);color:var(--red);transform:translateY(-1px)}
/* صور الخيارات */
.o .oi{width:46px;height:46px;flex:none;border-radius:11px;object-fit:cover;background:#f4f2f0}
.o.sel .oi{box-shadow:0 0 0 2px var(--red)}
.tile .ti{width:64px;height:64px;margin:0 auto 7px;border-radius:13px;overflow:hidden;background:#f4f2f0}
.tile .ti img{width:100%;height:100%;object-fit:cover}
.tile.sel .ti{box-shadow:0 0 0 2px #fff}
/* معاينة البيتسا */
.pzview{position:sticky;top:0;z-index:6;background:linear-gradient(var(--bg) 88%,rgba(247,246,245,0));margin:0 -16px 6px;padding:8px 16px 12px;text-align:center}
.pzview svg{width:min(52vw,205px);height:auto;display:block;margin:0 auto}
.pzview .gd{stroke:#fff;stroke-width:1.6;stroke-dasharray:4 4;opacity:.85}
.pzcap{font-size:12.5px;font-weight:800;color:var(--ink-2);margin-top:4px}
.tp.drop .pc{animation:pzdrop .42s cubic-bezier(.3,1.5,.5,1) both}
.pc{transform-box:fill-box;transform-origin:center}
@keyframes pzdrop{from{transform:scale(2.2);opacity:0}to{transform:scale(1);opacity:1}}
@media (prefers-reduced-motion:reduce){.tp.drop .pc{animation:none}}
.cat .bx{overflow:hidden}
.cat .bx img{width:100%;height:100%;object-fit:cover}
.cat.on .bx:has(img){padding:3px}
.cat.on .bx:has(img) img{border-radius:15px}
/* لغة */
body.lang-he{font-family:'Heebo','Cairo',system-ui,sans-serif}
.hero-top .hr{display:flex;gap:7px;align-items:center}
.icn-btn.langsw{width:auto;padding:0 11px;font-size:12.5px;font-weight:800;font-family:'Heebo','Cairo',sans-serif}
/* موقع التوصيل */
.locc{cursor:pointer}
.locc.need{box-shadow:0 0 0 2px var(--red)}
.locc small{font-size:12.5px;color:var(--ink-2);font-weight:600}
.locc .chg{color:var(--red);font-weight:800;font-size:13px}
.zl{display:flex;flex-wrap:wrap;gap:4px 10px;margin-top:4px;font-size:12.5px;color:var(--ink-2)}
#mapPick{position:fixed;inset:0;z-index:95;background:#e9e6e1;display:none}
#mapPick.on{display:block}
#mapPick .mp-map{position:absolute;inset:0}
#mapPick .zload{display:grid;place-items:center;height:100%;color:var(--muted);font-weight:700}
.mp-top{position:absolute;top:0;left:0;right:0;z-index:1000;display:flex;align-items:center;justify-content:space-between;padding:12px;
  background:linear-gradient(#fff 70%,rgba(255,255,255,0));font-size:16px}
.mp-top button{width:40px;height:40px;border-radius:50%;background:#fff;box-shadow:var(--sh);font-size:17px}
.mp-top span{width:40px}
.mp-pin{position:absolute;left:50%;top:50%;z-index:999;pointer-events:none;transform:translate(-50%,-100%);font-size:40px;line-height:1;filter:drop-shadow(0 4px 4px rgba(0,0,0,.35))}
.mp-pin::after{content:'';position:absolute;left:50%;bottom:-3px;width:10px;height:4px;margin-left:-5px;border-radius:50%;background:rgba(0,0,0,.35)}
.mp-gps{position:absolute;z-index:1000;inset-inline-end:14px;bottom:170px;background:#fff;border-radius:999px;padding:10px 14px;font-weight:800;box-shadow:var(--sh);font-size:14px}
.mp-tip{position:absolute;z-index:1000;top:66px;left:50%;transform:translateX(-50%);background:rgba(26,26,26,.85);color:#fff;font-size:12.5px;font-weight:700;padding:6px 12px;border-radius:999px;white-space:nowrap}
.mp-bot{position:absolute;z-index:1000;left:0;right:0;bottom:0;background:#fff;border-radius:22px 22px 0 0;padding:14px 16px calc(14px + env(safe-area-inset-bottom));box-shadow:0 -6px 24px rgba(0,0,0,.15)}
.mp-bot .cta{width:100%;justify-content:center}
.mp-info{font-size:14.5px;line-height:1.6;margin-bottom:10px;text-align:center}
.mp-info.ok b{color:var(--ink)}.mp-info.bad{color:var(--red)}
.ztip{background:rgba(255,255,255,.92);border:none;box-shadow:0 2px 8px rgba(0,0,0,.2);font-weight:800;font-family:inherit;font-size:12px;border-radius:8px}
.zshop{font-size:24px;line-height:30px;text-align:center}
/* الدفع */
.pays{display:flex;flex-direction:column;gap:8px;margin-top:6px}
.pay{display:flex;align-items:center;gap:11px;width:100%;text-align:start;background:#fff;border:1.5px solid var(--line);border-radius:14px;padding:11px 12px;font-family:inherit}
.pay .pi{font-size:22px;width:30px;text-align:center}
.pay .pt{flex:1;display:flex;flex-direction:column;gap:1px}.pay .pt b{font-size:14px}.pay .pt small{font-size:12px;color:var(--muted)}
.pay .pr{width:20px;height:20px;border-radius:50%;border:2px solid #d6d6d6;flex:none}
.pay.on{border-color:var(--red);background:var(--red-soft)}
.pay.on .pr{border:6px solid var(--red)}
.payok{font-size:22px;font-weight:900;margin:14px 0 6px}
.payamt{font-size:15px;margin-bottom:16px}.payamt b{font-size:24px;color:var(--red)}
.paystep{font-size:14.5px;margin-bottom:8px}
.payph{display:inline-block;font-size:24px;font-weight:900;background:#fff;border:2px dashed var(--red);border-radius:14px;padding:10px 18px;margin-bottom:10px;cursor:pointer}
a.cta{text-decoration:none;justify-content:center}
/* بناء العرض */
.dl-hero{height:190px;position:relative;overflow:hidden;background:linear-gradient(135deg,#2a1a12,#1a1a1a);display:grid;place-items:center}
.dl-hero img{width:100%;height:100%;object-fit:cover}
.dl-hero .em{font-size:90px}
.price small{font-size:13px;color:var(--ink-2);font-weight:700}
.dl-slot .t .ok{background:#e6f6ec;color:#1e8e4e;font-size:11px;font-weight:800;padding:3px 9px;border-radius:8px}
.dl-ch{display:flex;flex-wrap:wrap;align-items:center;gap:4px 8px;background:#fff;border:1.5px solid #1e8e4e;border-radius:12px;padding:9px 11px;margin-bottom:7px}
.dl-ch .n{font-weight:800;font-size:14px;flex:1}
.dl-ch small{flex-basis:100%;font-size:12px;color:var(--ink-2)}
.dl-ch{position:relative;padding-inline-end:48px}
.dl-ch button{position:absolute;inset-inline-end:10px;top:50%;transform:translateY(-50%);width:30px;height:30px;border-radius:50%;background:#ffe9eb;color:var(--red);font-weight:900}
.dl-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}
.dl-it{background:#fff;border:1.5px solid var(--line);border-radius:14px;overflow:hidden;text-align:start;display:flex;flex-direction:column;font-family:inherit;padding:0}
.dl-it .ph{height:86px;background:#eee;overflow:hidden}.dl-it .ph img{width:100%;height:100%;object-fit:cover}
.dl-it .nm{font-weight:800;font-size:13px;padding:8px 9px 2px}
.dl-it .op{font-size:11px;color:var(--muted);padding:0 9px 8px}
.dl-it:active{transform:scale(.97)}
/* العروض */
.alldeals{display:flex;align-items:center;gap:10px;width:calc(100% - 32px);margin:12px 16px 0;background:#fff;border:2px solid var(--red);color:var(--red);
  border-radius:16px;padding:13px 16px;font-family:inherit;font-weight:900;font-size:15px}
.alldeals b{background:var(--red);color:#fff;border-radius:999px;padding:1px 10px;font-size:13px}
.alldeals .ar{margin-inline-start:auto;font-size:18px}
.cat.dealchip .bx{background:linear-gradient(135deg,#e3242b,#ff7a3d);color:#fff;border-color:transparent}
.cat.dealchip .lb{color:var(--red);font-weight:900}
.deal .fbadge{display:inline-block;background:#f5b301;color:#1a1a1a;font-size:11px;font-weight:900;border-radius:999px;padding:2px 9px;margin-bottom:6px}
.dscroll{display:flex;gap:10px;overflow-x:auto;padding:8px 16px 10px;scroll-snap-type:x mandatory;scrollbar-width:none}
.dscroll::-webkit-scrollbar{display:none}
.dscroll .dtile{flex:0 0 44%;max-width:210px;scroll-snap-align:start}
.dscroll .dtile .ph{height:96px}
.dtile .ft s{color:var(--muted);font-size:11px;font-weight:600}
.dgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.dtile{background:var(--card);border-radius:var(--r);overflow:hidden;box-shadow:var(--sh);text-align:start;display:flex;flex-direction:column;font-family:inherit;padding:0;border:none}
.dtile .ph{height:120px;position:relative;background:linear-gradient(135deg,#2a1a12,#1a1a1a);display:grid;place-items:center;overflow:hidden}
.dtile .ph img{width:100%;height:100%;object-fit:cover}
.dtile .ph .em{font-size:52px}
.dtile .fb{position:absolute;top:8px;inset-inline-start:8px;background:#f5b301;border-radius:999px;font-size:12px;padding:2px 7px}
.dtile .bd{padding:10px 11px 11px;display:flex;flex-direction:column;flex:1}
.dtile .nm{font-weight:900;font-size:14px;line-height:1.35}
.dtile .ds{font-size:11.5px;color:var(--muted);margin-top:3px;line-height:1.45;max-height:34px;overflow:hidden}
.dtile .ft{display:flex;align-items:center;justify-content:space-between;margin-top:auto;padding-top:9px}
.dtile .ft b{color:var(--red);font-size:17px}
.dtile .go{background:var(--red);color:#fff;border-radius:999px;font-size:12px;font-weight:800;padding:5px 12px}
/* تتبّع الطلب */
#trkPill{position:fixed;z-index:39;left:50%;transform:translateX(-50%);bottom:calc(140px + env(safe-area-inset-bottom));display:flex;align-items:center;gap:9px;
  background:#1a1a1a;color:#fff;border-radius:999px;padding:10px 16px;font-family:inherit;font-weight:800;font-size:13.5px;box-shadow:0 8px 24px rgba(0,0,0,.3);white-space:nowrap;max-width:calc(100% - 32px)}
#trkPill .go{color:#f5b301}
#trkPill .trkx{background:rgba(255,255,255,.15);border-radius:50%;width:24px;height:24px;display:grid;place-items:center;font-size:12px;margin-inline-start:2px}
#trkPill .pulse{width:10px;height:10px;border-radius:50%;background:#3ddc84;box-shadow:0 0 0 0 rgba(61,220,132,.7);animation:pl 1.6s infinite}
@keyframes pl{70%{box-shadow:0 0 0 10px rgba(61,220,132,0)}100%{box-shadow:0 0 0 0 rgba(61,220,132,0)}}
.trk-no{text-align:center;color:var(--ink-2);margin-top:6px}.trk-no b{color:var(--ink);font-size:18px}
.trk-big{font-size:64px;text-align:center;margin:10px 0 2px;animation:bob 2s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-6px)}}
.trk-t{text-align:center;font-size:21px;font-weight:900}
.trk-eta{text-align:center;margin-top:6px;color:var(--ink-2)}.trk-eta b{color:var(--red);font-size:18px}
.trk-x{font-size:56px;text-align:center;margin-top:16px}
.trk-steps{margin:20px 4px 0;position:relative}
.trk-steps .ts{display:flex;align-items:center;gap:12px;padding:9px 0;position:relative;color:#b8b8b8;font-weight:700}
.trk-steps .ts:not(:last-child)::after{content:'';position:absolute;inset-inline-start:17px;top:44px;width:2px;height:calc(100% - 26px);background:#e5e5e5}
.trk-steps .ts.done::after{background:#1e8e4e}
.trk-steps .dot{width:36px;height:36px;border-radius:50%;background:#f0f0f0;display:grid;place-items:center;font-size:17px;flex:none;z-index:1}
.trk-steps .ts.done{color:var(--ink-2)}.trk-steps .ts.done .dot{background:#1e8e4e;color:#fff;font-weight:900}
.trk-steps .ts.now{color:var(--ink);font-size:16px}.trk-steps .ts.now .dot{background:var(--red);box-shadow:0 0 0 5px var(--red-soft)}
.cta.gh2{background:#fff;color:var(--ink);border:1.5px solid var(--line);box-shadow:none}
/* تنزيل التطبيق */
#instBar{display:flex;align-items:center;gap:10px;margin:12px 16px 0;background:linear-gradient(135deg,#1a1a1a,#3a1d12);color:#fff;border-radius:16px;padding:11px 12px}
#instBar .ic{font-size:26px}
#instBar .tx{flex:1;display:flex;flex-direction:column}#instBar .tx b{font-size:14.5px}#instBar .tx small{font-size:12px;opacity:.75}
#instBar .ok{background:var(--red);color:#fff;border-radius:999px;padding:8px 14px;font-weight:800;font-family:inherit}
#instBar .x{color:#fff;opacity:.6;font-size:16px;padding:4px}
.iosg .st{display:flex;gap:12px;align-items:center;background:#fff;border-radius:14px;padding:13px;margin-bottom:9px;font-size:14.5px;line-height:1.6}
.iosg .st>b{width:30px;height:30px;border-radius:50%;background:var(--red);color:#fff;display:grid;place-items:center;flex:none}
/* اقتراحات */
.ups h4{margin-bottom:8px}
.upg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.up{background:#fff;border:1.5px solid var(--line);border-radius:12px;overflow:hidden;padding:0;display:flex;flex-direction:column;text-align:start;font-family:inherit}
.up .ph{height:62px;background:#eee;overflow:hidden}.up .ph img{width:100%;height:100%;object-fit:cover}
.up .nm{font-size:11.5px;font-weight:800;padding:5px 7px 0;line-height:1.3;max-height:30px;overflow:hidden}
.up .pr{display:flex;justify-content:space-between;align-items:center;padding:4px 7px 7px}.up .pr b{color:var(--red);font-size:13px}
.up .pr i{font-style:normal;width:22px;height:22px;border-radius:50%;background:var(--red);color:#fff;display:grid;place-items:center;font-weight:900}
/* ولاء */
.loy{background:linear-gradient(135deg,#fff7e6,#fff);border:1.5px solid #f5d27a;border-radius:16px;padding:12px 13px;margin-bottom:12px}
.loy.win{background:linear-gradient(135deg,#e9fbef,#fff);border-color:#1e8e4e}
.loy .lt{font-size:14px;line-height:1.6}
.stamps{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
.stamps span{width:26px;height:26px;border-radius:50%;border:2px dashed #e0c27a;display:grid;place-items:center;font-size:14px}
.stamps span.on{border:2px solid #f5b301;background:#fff3cc}
.usew{display:flex;align-items:center;gap:8px;margin-top:10px;font-weight:800;font-size:14px}
.usew input{width:20px;height:20px;accent-color:var(--red)}
/* عجلة */
.wh-t{font-size:15px;font-weight:700;margin:6px 0 12px;text-align:center}
.wh{position:relative;width:min(78vw,290px);margin:0 auto}
.wh svg{width:100%;height:auto;display:block;filter:drop-shadow(0 8px 18px rgba(0,0,0,.25))}
.wh-pin{position:absolute;top:-14px;left:50%;transform:translateX(-50%);font-size:30px;color:var(--ink);z-index:2;text-shadow:0 2px 0 #fff}
.wh-r{font-size:20px;font-weight:900;margin-top:16px}
.reg-hero{font-size:60px;text-align:center}
.logout{display:block;width:100%;margin:22px 0 10px;background:#fff;border:1.5px solid var(--line);color:var(--red);border-radius:15px;padding:13px;font-family:inherit;font-weight:800;font-size:15px;cursor:pointer}
.bdr{display:flex;gap:8px}.bdr select{flex:1}
.loy.bday{background:linear-gradient(135deg,#fff3e0,#fff);border-color:#f5b301}
.sched select{font-weight:800}
.bdg.so{background:#1a1a1a;color:#fff}
.whc{border:1.5px solid #f5b301}
.prof{cursor:pointer}.prof .chg{color:var(--red);font-weight:800;font-size:13px}
/* عروض بأوقات */
.dtimer{display:inline-block;background:#fff;color:var(--red);font-size:11.5px;font-weight:900;border-radius:999px;padding:2px 9px;margin:0 4px 6px 0}
.dtile .dtimer{position:absolute;bottom:8px;inset-inline-start:8px;margin:0}
/* تقييم */
.rate{margin-top:18px;background:#fff;border-radius:16px;padding:14px;text-align:center}
.rate .rt{font-weight:900;font-size:16px}
.stars{display:flex;justify-content:center;gap:6px;margin:8px 0}
.stars button{font-size:34px;color:#ddd;line-height:1}.stars button.on{color:#f5b301}
.btn-rate{margin-top:8px;background:var(--red);color:#fff;border-radius:12px;padding:11px 18px;font-weight:800;font-family:inherit;width:100%}

/* العرض خطوة خطوة */
.wzt{position:sticky;top:0;z-index:7;background:var(--bg)}.wzt h3{font-size:15px;flex:1;text-align:center}
.pbody.wz{margin-top:0;border-radius:0;padding-top:10px}
.wz .wzh h3{margin:0 0 4px}.wz .price s{font-size:14px;color:var(--muted);margin-inline-start:6px}
.wzbar{display:flex;justify-content:space-between;align-items:center;margin-top:12px;font-size:16px}.wzbar span{color:var(--muted);font-weight:800}
.wzdots{display:flex;gap:4px;margin:8px 0 4px}.wzdots i{flex:1;height:4px;border-radius:2px;background:#e4e1dd}.wzdots i.d{background:#1e8e4e}.wzdots i.on{background:var(--red)}
.wzl{display:flex;flex-direction:column;gap:8px;padding:6px 16px 20px}
.wzi{background:#fff;border:1.5px solid var(--line);border-radius:16px;overflow:hidden}.wzi.on{border-color:var(--red)}
.wzr{display:flex;align-items:center;gap:12px;width:100%;padding:9px 12px;text-align:start;font-family:inherit}
.wzr .rd{width:22px;height:22px;border-radius:50%;border:2px solid #cfcfcf;flex:none}.wzi.on .wzr .rd{border:7px solid var(--red)}
.wzr .nm{flex:1;font-weight:800;font-size:14.5px}.wzr .ph{width:58px;height:46px;border-radius:10px;overflow:hidden;background:#eee;flex:none}.wzr .ph img{width:100%;height:100%;object-fit:cover}
.wzo{padding:0 12px 10px;border-top:1px dashed var(--line)}
.wzhide{display:block;width:calc(100% - 24px);margin:6px 12px 10px;background:#f4f2f0;border-radius:10px;padding:7px;font-weight:800;font-size:13px;color:var(--ink-2)}
.omax{font-size:12px;color:var(--muted);margin:-4px 0 6px}
.olist.rmv .o{cursor:pointer}.olist.rmv .o .rx{margin-inline-start:auto;width:28px;height:28px;border-radius:50%;background:#f4f2f0;font-weight:900}

const AR_RE = /[؀-ۿ]/;
/* مفاتيح القاموس اللي فيها نقط أو إيموجي بالأطراف: بنخزنها كمان بدون الأطراف */
Object.keys(HE).forEach(k => {
  const m = k.match(/^([^؀-ۿ]*)([\s\S]*?)([^؀-ۿ]*)$/);
  if(!m || m[2] === k || Object.prototype.hasOwnProperty.call(HE, m[2])) return;
  let v = HE[k];
  if(m[1] && v.startsWith(m[1])) v = v.slice(m[1].length);
  if(m[3] && v.endsWith(m[3])) v = v.slice(0, -m[3].length);
  HE[m[2]] = v;
});
function trCore(core){
  if(Object.prototype.hasOwnProperty.call(HE, core)) return HE[core];
  for(const [re, fn] of HE_RULES){ const m = core.match(re); if(m) return fn(m); }
  return null;
}
/* بيترجم نص كامل مع الحفاظ على الإيموجي والأرقام بالأطراف */
function trText(s, force){
  if((LANG !== 'he' && !force) || !s || !AR_RE.test(s)) return s;
  const m = s.match(/^([^؀-ۿ]*)([\s\S]*?)([^؀-ۿ]*)$/);
  if(!m) return s;
  const t = trCore(m[2]);
  return t == null ? s : m[1] + t + m[3];
}
function trNode(root){
  if(LANG !== 'he' || !root) return;
  if(root.nodeType === 3){
    if(root.parentNode && (root.parentNode.tagName === 'TEXTAREA' || (root.parentNode.closest && root.parentNode.closest('[data-nt]')))) return;
    const t = trText(root.nodeValue); if(t !== root.nodeValue) root.nodeValue = t; return;
  }
  if(root.nodeType !== 1) return;
  if(root.closest && root.closest('[data-nt]')) return;
  ['placeholder', 'title', 'aria-label'].forEach(a => {
    const v = root.getAttribute && root.getAttribute(a);
    if(v){ const t = trText(v); if(t !== v) root.setAttribute(a, t); }
  });
  const w = (root.ownerDocument || document).createTreeWalker(root, NodeFilter.SHOW_TEXT | NodeFilter.SHOW_ELEMENT);
  let n;
  while((n = w.nextNode())){
    if(n.nodeType === 1){
      if(n.hasAttribute('data-nt')){ continue; }
      ['placeholder', 'title', 'aria-label'].forEach(a => {
        const v = n.getAttribute(a);
        if(v){ const t = trText(v); if(t !== v) n.setAttribute(a, t); }
      });
    }else if(!(n.parentNode && (n.parentNode.tagName === 'TEXTAREA' || n.parentNode.closest('[data-nt]')))){
      const t = trText(n.nodeValue); if(t !== n.nodeValue) n.nodeValue = t;
    }
  }
}

/* ============ Firebase ============ */
function cfgOk(){
  const c = window.FB_CONFIG;
  return !!(c && c.apiKey && c.projectId && !/ضع_المفتاح/.test(c.apiKey) && !/اسم-المشروع/.test(c.projectId));
}
function boot(){
  if(!cfgOk()){ demo(); return; }
  try{ firebase.initializeApp(window.FB_CONFIG); db = firebase.firestore(); }
  catch(e){ console.error(e); demo(); return; }
  live = true;
  const on = (col, fn, key) => db.collection(col).onSnapshot(
    s => { fn(s); rdy[key] = true; paint(); hideSoon(); },
    e => { console.error(col, e); rdy[key] = true; hideSoon(); });

  db.collection('settings').doc('main').onSnapshot(d => {
    if(d.exists) SET = normZones(Object.assign({}, window.FALLBACK, d.data()));
    rdy.s = true; paint(); hideSoon();
  }, e => { console.error(e); rdy.s = true; hideSoon(); });

  on('categories', s => { CATS = s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(a.order||0)-(b.order||0)); }, 'c');
  on('items',      s => { ITEMS = s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(a.order||0)-(b.order||0)); }, 'i');
  on('optionGroups', s => { GROUPS = {}; s.docs.forEach(d => { GROUPS[d.id] = d.data(); }); }, 'g');
  db.collection('deals').onSnapshot(
    s => { DEALS = s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(a.order||0)-(b.order||0)); paint(); }, ()=>{});
}
function demo(){
  SET = Object.assign({}, window.FALLBACK);
  CATS = D_CATS.slice(); ITEMS = D_ITEMS.slice(); GROUPS = D_GROUPS; DEALS = D_DEALS.slice();
  live = false; rdy = {c:true,i:true,g:true,s:true};
}

/* ============ حالة المطعم ============ */
function mins(hm){ const a = String(hm).split(':').map(Number); return a[0]*60 + (a[1]||0); }
function status(){
  const n = new Date(), d = n.getDay(), m = n.getHours()*60 + n.getMinutes();
  const H = (SET.hours||{})[d] || (SET.hours||{})[String(d)];
  if(!H || !H[0]) return {open:false, label:'مغلق اليوم', day:DAYS[d], hours:'مغلق'};
  const o = mins(H[0]), c = mins(H[1]);
  const open = (c <= o) ? (m >= o || m < c) : (m >= o && m < c);
  return {open, label: open?'مفتوح الآن':'مغلق', day:DAYS[d], hours:H[0]+' - '+H[1]};
}

  if(it.available === false) b.push('<span class="bdg k">غير متوفر</span>');

function unit(){
  if(!cur) return 0;
  let p = base(cur);
  (cur.opts||[]).forEach(g => {
    const G = grp(g); if(!G) return;
    if(G.type === 'one'){
      const o = G.items.find(x => x.id === sel[g]);
      if(o) p += Number(o.delta||0);
    }else if(G.style !== 'remove') (sel[g]||[]).forEach(s => {
      const o = G.items.find(x => x.id === s);
      if(o) p += Number(o.delta||0);
    });
  });
  return p;
}
/* ============ محرّك رسم البيتسا (نفس الكود باللوحة والمتجر) ============ */
function seedRand(str){
  let h = 2166136261;
  for(let i = 0; i < str.length; i++){ h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); }
  return () => { h += 0x6D2B79F5; let t = h; t = Math.imul(t ^ t >>> 15, t | 1); t ^= t + Math.imul(t ^ t >>> 7, t | 61); return ((t ^ t >>> 14) >>> 0) / 4294967296; };
}
/* شكل مرسوم لكل إضافة حسب اسمها، بيستعمل بس إذا الإضافة ما إلها صورة */
function toppingKind(label){
  const t = String(label||'');
  if(/زيتون\s*(اسود|أسود)/.test(t)) return 'olB';
  if(/زيتون/.test(t)) return 'olG';
  if(/فطر|مشروم/.test(t)) return 'mush';
  if(/ذر[ةه]/.test(t)) return 'corn';
  if(/بصل/.test(t)) return 'onion';
  if(/هالبينو|حار|حر\b/.test(t) && /فلفل|هالبينو/.test(t)) return 'jal';
  if(/فلفل/.test(t)) return 'pep';
  if(/طون/.test(t)) return 'tuna';
  if(/سلامي|نقانق|سجق|ببروني|بيبروني/.test(t)) return 'sal';
  if(/دجاج|شاورما|فاهيتا/.test(t)) return 'chk';
  if(/كباب|لحم|انتريكوت|إنتريكوت|برقيت|برجيت|بيف|همبرغر/.test(t)) return 'beef';
  if(/جبن/.test(t)) return 'chz';
  if(/بندور|طماط/.test(t)) return 'tom';
  if(/اناناس|أناناس/.test(t)) return 'pine';
  if(/ريحان|سبانخ|جرجير/.test(t)) return 'leaf';
  return 'dot';
}

function inRegion(x, y, k){
  const g = 5;
  switch(k){
    case 'r':  return x > g;
    case 'l':  return x < -g;
    case 'rt': return x > g && y < -g;
    case 'lt': return x < -g && y < -g;
    case 'rb': return x > g && y > g;
    case 'lb': return x < -g && y > g;
    default:   return true;
  }
}
/* tops: [{key,label,img,reg,ps,pn}] — ps = حجم القطعة، pn = كثافة/كمية */
function pizzaSvgFrom(tops, o){
  o = o || {};
  const idp = o.idp || 'pz', isNew = o.isNew || (() => false);
  const R = 84;
  let defs = '', body = '', n = 0;
  const regs = {};
  tops.forEach(tp => {
    regs[tp.reg] = 1;
    const ps = Math.max(.4, Math.min(2.5, Number(tp.ps) || 1));
    const pn = Math.max(.3, Math.min(3, Number(tp.pn) || 1));
    const rnd = seedRand(tp.key);
    const isQ = tp.reg.length === 2, isH = tp.reg === 'r' || tp.reg === 'l';
    const want = Math.max(1, Math.round((isQ ? 5 : isH ? 8 : 14) * pn)), pts = [];
    const minD = 18 * ps * Math.min(1, 1 / Math.sqrt(pn)), minD2 = minD * minD;
    for(let tries = 0; pts.length < want && tries < 900; tries++){
      const a = rnd() * Math.PI * 2, r = Math.sqrt(rnd()) * (R - 4 * ps);
      const x = Math.cos(a) * r, y = Math.sin(a) * r;
      if(!inRegion(x, y, tp.reg)) continue;
      if(pts.some(p => (p[0]-x)*(p[0]-x) + (p[1]-y)*(p[1]-y) < minD2)) continue;
      pts.push([x, y, rnd() * 360]);
    }
    let g = '';
    const tf = p => '<g transform="translate(' + p[0].toFixed(1) + ' ' + p[1].toFixed(1) + ') rotate(' + p[2].toFixed(0) + ') scale(' + ps.toFixed(2) + ')">';
    if(tp.img){
      const id = idp + 'c' + (n++);
      const png = /^data:image\/(png|webp)|\.png(\?|$)/i.test(tp.img);
      if(!png) defs += '<clipPath id="' + id + '"><circle r="9"/></clipPath>';
      pts.forEach((p,i) => {
        g += tf(p) + '<g class="pc" style="animation-delay:' + (i * 35) + 'ms">' +
          '<image href="' + esc(tp.img) + '" x="-10" y="-10" width="20" height="20" preserveAspectRatio="xMidYMid slice"' +
          (png ? '' : ' clip-path="url(#' + id + ')"') + '/>' +
          (png ? '' : '<circle r="9" fill="none" stroke="rgba(0,0,0,.18)" stroke-width="1"/>') + '</g></g>';
      });
    }else{
      const shape = pieceSvg(toppingKind(tp.label));
      pts.forEach((p,i) => { g += tf(p) + '<g class="pc" style="animation-delay:' + (i * 35) + 'ms">' + shape + '</g></g>'; });
    }
    body += '<g class="tp ' + (isNew(tp) ? 'drop' : '') + '" filter="url(#' + idp + 'sh)">' + g + '</g>';
  });
  const showH = regs.r || regs.l || regs.rt || regs.lt || regs.rb || regs.lb;
  const showQ = regs.rt || regs.lt || regs.rb || regs.lb;
  const guides = (showH ? '<line x1="0" y1="-96" x2="0" y2="96" class="gd"/>' : '') +
                 (showQ ? '<line x1="-96" y1="0" x2="96" y2="0" class="gd"/>' : '');
  const rb = seedRand('base' + (o.seed || '')); let spots = '';
  for(let i = 0; i < 26; i++){
    const a = rb() * 6.283, r = Math.sqrt(rb()) * 88;
    spots += '<ellipse cx="' + (Math.cos(a)*r).toFixed(1) + '" cy="' + (Math.sin(a)*r).toFixed(1) + '" rx="' + (3 + rb()*6).toFixed(1) +
      '" ry="' + (2 + rb()*4).toFixed(1) + '" fill="' + (rb() < .55 ? '#e3a94a' : '#c97a2c') + '" opacity="' + (.25 + rb()*.35).toFixed(2) + '"/>';
  }
  return '<svg viewBox="-120 -120 240 240" aria-label="معاينة البيتسا">' +
    '<defs>' +
      '<radialGradient id="' + idp + 'cr" r=".5"><stop offset=".78" stop-color="#e8b36a"/><stop offset=".9" stop-color="#d4943f"/><stop offset="1" stop-color="#a8692a"/></radialGradient>' +
      '<radialGradient id="' + idp + 'ch" r=".5"><stop offset="0" stop-color="#fbe39a"/><stop offset=".8" stop-color="#f5cf6b"/><stop offset="1" stop-color="#e3a944"/></radialGradient>' +
      '<filter id="' + idp + 'sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="1.2" stdDeviation="1" flood-opacity=".35"/></filter>' +
      '<filter id="' + idp + 'bs" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="5" stdDeviation="5" flood-opacity=".28"/></filter>' +
      '<filter id="' + idp + 'tx"><feTurbulence type="fractalNoise" baseFrequency=".06" numOctaves="2" seed="4"/><feDisplacementMap in="SourceGraphic" scale="9"/></filter>' +
      defs + '</defs>' +
    '<circle r="114" fill="url(#' + idp + 'cr)" filter="url(#' + idp + 'bs)"/>' +
    '<circle r="99" fill="#b8321f"/>' +
    '<circle r="96" fill="url(#' + idp + 'ch)" filter="url(#' + idp + 'tx)"/>' +
    '<g filter="url(#' + idp + 'tx)">' + spots + '</g>' +
    guides + body + '</svg>';
}

    steps: dealSlots(d).flatMap((s, i) => fixed(s) ? [] : Array.from({length: Number(s.count)}, (_, k) => ({slot: i, k, n: Number(s.count)})))};

/* الصنف جوّا خطوة العرض — بدون مجموعات الإضافات اللي العرض مخبّيها (مثلاً مشروب 330 لما العرض فيه 1.5 لتر) */
function wizItem(i, id){
  const it = byId(id); if(!it) return null;

function wizLoad(st, i){

  [cur, sel, side, note] = keep; return r;
}
const wizTotal = () => Number(DL.d.price) + DL.st.reduce((s, x, i) => s + (x.id ? wizCalc(i).extra : 0), 0);
function wizPick(id){

let TRK = null, trkUnsub = null, trkDoc = null;
try{ TRK = JSON.parse(localStorage.getItem('pz_track') || 'null'); }catch(e){}

const TSTEPS = {
  delivery: [['new','📥','استلمنا طلبك'], ['prep','👨‍🍳','عم نحضّره'], ['ready','🛵','طالع مع السائق'], ['done','✅','وصل — بالهنا والشفا']],
  pickup:   [['new','📥','استلمنا طلبك'], ['prep','👨‍🍳','عم نحضّره'], ['ready','🏪','جاهز للاستلام'], ['done','✅','استلمته — بالهنا والشفا']]
};
function trkStart(id, order){
  TRK = {id, at: order.createdAt, type: order.type, total: order.total, status: 'new', no: '', sched: (order.customer || {}).sched || ''};
  try{ localStorage.setItem('pz_track', JSON.stringify(TRK)); }catch(e){}

}
function trkListen(){
  if(!TRK || !live || !db) return;
  if(trkUnsub) trkUnsub();
  trkUnsub = db.collection('track').doc(TRK.id).onSnapshot(d => {
    if(!d.exists) return;
    const x = d.data(), was = TRK.status;
    TRK.status = x.status || TRK.status; TRK.no = x.no || TRK.no; if(x.outside) TRK.outside = x.outside;
    try{ localStorage.setItem('pz_track', JSON.stringify(TRK)); }catch(e){}
    if(['done','cancel'].includes(TRK.status) && !TRK.end){ TRK.end = Date.now(); try{ localStorage.setItem('pz_track', JSON.stringify(TRK)); }catch(e){} }
    if(was && was !== TRK.status){
      try{ navigator.vibrate && navigator.vibrate([120, 60, 120]); }catch(e){}
      const st = (TSTEPS[TRK.type] || TSTEPS.delivery).find(s => s[0] === TRK.status);
      toast(TRK.status === 'cancel' ? '❌ انلغى الطلب' : (st ? st[1] + ' ' + st[2] : ''));
    }
    trkPill(); if($('trkBox')) trkDraw();
  }, () => {});
}
/* الشارة بتختفي: الطلب الملغي بعد دقيقة، الواصل بعد 15 دقيقة (عشان التقييم) — أو لما الزبون يكبس ✕ */
function trkActive(){
  if(!TRK || TRK.hide || TRK.rated) return false;

  return Date.now() - (TRK.end || 0) < (TRK.status === 'cancel' ? 60e3 : 15 * 60e3);
}

const hm2m = t => { const m = String(t || '').match(/^(\d{1,2}):(\d{2})$/); return m ? Number(m[1]) * 60 + Number(m[2]) : null; };
function dealWindow(d){
  const days = Array.isArray(d.days) && d.days.length ? d.days.map(Number) : null;
  const f = hm2m(d.from), t = hm2m(d.to);
  if(!days && f == null && t == null) return {on: true, left: 0};
  const n = new Date(), day = n.getDay(), m = n.getHours() * 60 + n.getMinutes();
  if(days && !days.includes(day)) return {on: false};
  if(f == null || t == null) return {on: true, left: 0};
  const on = t > f ? (m >= f && m < t) : (m >= f || m < t);
  if(!on) return {on: false};
  const left = t > f ? t - m : (m >= f ? 1440 - m + t : t - m);
  return {on: true, left};
}
function dealTimer(d){
  const w = dealWindow(d); if(!w.on || !w.left) return '';
  const h = Math.floor(w.left / 60), mm = w.left % 60;
  return '<span class="dtimer">⏰ ضايل ' + (h ? h + ' س ' : '') + mm + ' د</span>';
}

function inPoly(pt, poly){
  const x = pt[1], y = pt[0]; let ins = false;
  for(let i = 0, j = poly.length - 1; i < poly.length; j = i++){
    const xi = poly[i][1], yi = poly[i][0], xj = poly[j][1], yj = poly[j][0];
    if(((yi > y) !== (yj > y)) && (x < (xj - xi) * (y - yi) / (yj - yi) + xi)) ins = !ins;

}

function dayLabel(t){
  const a = new Date(), d0 = new Date(a.getFullYear(), a.getMonth(), a.getDate()), d1 = new Date(t.getFullYear(), t.getMonth(), t.getDate());
  const k = Math.round((d1 - d0) / 864e5);
  return k === 0 ? 'اليوم' : k === 1 ? 'بكرا' : DAYS[t.getDay()] + ' ' + t.getDate() + '/' + (t.getMonth() + 1);

function preSlots(){
  const c = preCfg(); if(!c) return [];
  const lead = Math.max(10, Number(c.lead) || 30), days = Math.min(6, Math.max(0, Number(c.days == null ? 1 : c.days)));
  const now = new Date(), min = now.getTime() + lead * 60e3, out = [];
  for(let k = 0; k <= days; k++){
    const d0 = new Date(now.getFullYear(), now.getMonth(), now.getDate() + k), wd = d0.getDay();
    const H = (SET.hours || {})[wd] || (SET.hours || {})[String(wd)];
    if(!H || !H[0] || !H[1]) continue;
    const o = mins(H[0]); let cl = mins(H[1]); if(cl <= o) cl += 1440;
    for(let m = Math.ceil((o + 15) / 15) * 15; m <= cl - 15; m += 15){
      const t = new Date(d0.getFullYear(), d0.getMonth(), d0.getDate(), 0, m);
      if(t.getTime() >= min) out.push(t);
    }
  }
  try{ const t = ramCfg() && iftarNext(); if(t && t.getTime() >= min && !out.some(x => x.getTime() === t.getTime())){ out.push(t); out.sort((a, b) => a - b); } }catch(e){}

}

  try{ at = localStorage.getItem('pz_bday_at') || ''; used = localStorage.getItem('pz_bday_used') || ''; }catch(e){}
  if(!at || Date.now() - new Date(at).getTime() < 14 * 864e5) return 0;
  const now = new Date(), [mm, dd] = b.split('-').map(Number), w = Math.max(0, Math.min(15, Number(c.days == null ? 3 : c.days)));

function sunsetAt(d){
  const lat = 32.517, lng = 35.153, r = Math.PI / 180, y = d.getFullYear(), m = d.getMonth(), dd = d.getDate();
  const N = Math.round((Date.UTC(y, m, dd) - Date.UTC(y, 0, 0)) / 864e5), lh = lng / 15, t = N + (18 - lh) / 24, M = 0.9856 * t - 3.289;
  let L = (M + 1.916 * Math.sin(M * r) + 0.020 * Math.sin(2 * M * r) + 282.634) % 360; if(L < 0) L += 360;
  let RA = (Math.atan(0.91764 * Math.tan(L * r)) / r + 360) % 360; RA = (RA + Math.floor(L / 90) * 90 - Math.floor(RA / 90) * 90) / 15;
  const sd = 0.39782 * Math.sin(L * r), cd = Math.cos(Math.asin(sd)), ch = (Math.cos(90.833 * r) - sd * Math.sin(lat * r)) / (cd * Math.cos(lat * r));
  let UT = ((Math.acos(ch) / r / 15 + RA - 0.06571 * t - 6.622 - lh) % 24 + 24) % 24;
  return new Date(Date.UTC(y, m, dd) + UT * 3600e3);
}
const ramCfg = () => (SET.ramadan && SET.ramadan.on) ? SET.ramadan : null;
function iftarAt(d){ const c = ramCfg() || {}; const t = sunsetAt(d || new Date()); t.setSeconds(0, 0); return new Date(t.getTime() + Number(c.offset == null ? 2 : c.offset) * 60e3); }
function iftarNext(){ const t = iftarAt(new Date()); return t.getTime() > Date.now() + 20 * 60e3 ? t : null; }
function ramHtml(){

/* ============ 📲 عدّاد مسح الـ QR ============
   الرابط بالملصق فيه ?src=qr. كل جهاز بيتعدّ مرة كزائر جديد (مش حسب IP — الـ IP بيتغيّر
   وبيتشارك بين ناس كثير على شبكة الموبايل، فالجهاز أدق). الطلب اللي بييجي خلال أسبوع بيتسجّل إنه من الـ QR. */
function qrTrack(){
  let src = '';
  try{ src = (new URLSearchParams(location.search).get('src') || '').replace(/[^\w-]/g, '').slice(0, 20); }catch(e){}
  if(!src || !live || !db) return;
  let dev = '', first = false;
  try{
    dev = localStorage.getItem('pz_dev') || '';
    if(!dev){ dev = Date.now().toString(36) + Math.random().toString(36).slice(2, 10); localStorage.setItem('pz_dev', dev); }
    first = !localStorage.getItem('pz_seen_' + src);
    localStorage.setItem('pz_seen_' + src, '1');
    localStorage.setItem('pz_ref', JSON.stringify({src, at: Date.now()}));
    if(sessionStorage.getItem('pz_scan_' + src)) return;   // تحديث الصفحة ما بينعدّ مرة ثانية
    sessionStorage.setItem('pz_scan_' + src, '1');
  }catch(e){}
  db.collection('scans').add({at: new Date().toISOString(), dev: dev.slice(0, 30), src, first}).catch(() => {});
  try{ history.replaceState(null, '', location.pathname + location.hash); }catch(e){}
}
function qrRef(){
  try{ const r = JSON.parse(localStorage.getItem('pz_ref') || 'null'); return r && Date.now() - r.at < 7 * 864e5 ? String(r.src || '') : ''; }catch(e){ return ''; }
}

function smsFailOpen(e){
  // إذا الخدمة مش مفعّلة بـ Firebase — ما بنوقّف الطلبات
  console.warn('sms', e && e.code, e && e.message);
  smsMark(_smsPh); const n = _smsNext; _smsNext = null; if(n) n();
}
async function smsSend(){
  const b = $('smsBtn'); if(b){ b.disabled = true; b.innerHTML = '<span>جاري الإرسال...</span>'; }
  try{
    const auth = custAuth();
    let box = $('rcap'); if(!box){ box = document.createElement('div'); box.id = 'rcap'; document.body.appendChild(box); }
    if(!_rcv) _rcv = new firebase.auth.RecaptchaVerifier('rcap', {size: 'invisible'}, _custApp);
    _smsConf = await auth.signInWithPhoneNumber('+972' + _smsPh.slice(1), _rcv);
    smsDraw('');
  }catch(e){
    try{ if(_rcv){ _rcv.clear(); } }catch(x){} _rcv = null; const bx = $('rcap'); if(bx) bx.remove();
    const c = (e && e.code) || '';
    if(['auth/operation-not-allowed','auth/billing-not-enabled','auth/internal-error','auth/unauthorized-domain','auth/admin-restricted-operation','auth/quota-exceeded'].includes(c)) return smsFailOpen(e);
    smsDraw(c === 'auth/too-many-requests' ? 'محاولات كثيرة — استنى شوي وجرّب كمان مرة' : c === 'auth/invalid-phone-number' ? 'رقم التلفون مش صحيح' : 'ما زبط الإرسال، جرّب كمان مرة');
  }
}
async function smsCheck(){
  const code = (($('smsCode') || {}).value || '').replace(/\D/g, '');
  if(code.length !== 6 || !_smsConf) return;
  const b = $('smsBtn'); if(b){ b.disabled = true; b.innerHTML = '<span>جاري التأكيد...</span>'; }
  try{
    await _smsConf.confirm(code);
    smsMark(_smsPh); toast('✅ الرقم تأكّد');
    try{ custAuth().signOut(); }catch(e){}
    const n = _smsNext; _smsNext = null; if(n) n();
  }catch(e){
    const c = (e && e.code) || '';
    smsDraw(c === 'auth/invalid-verification-code' ? 'الكود غلط — تأكد وجرّب كمان مرة' : c === 'auth/code-expired' ? 'الكود انتهى — اطلب كود جديد' : 'ما زبط التأكيد، جرّب كمان مرة');
  }
}

/* ============ ♿ נגישות (תקן 5568 / WCAG 2.0 AA) ============ */
let A11Y = {z: 0, hc: false, links: false, font: false, still: false};
try{ Object.assign(A11Y, JSON.parse(localStorage.getItem('pz_a11y') || '{}')); }catch(e){}
function a11yApply(){
  const h = document.documentElement;
  ['a11y-z1','a11y-z2','a11y-z3'].forEach((c, i) => h.classList.toggle(c, A11Y.z === i + 1));
  h.classList.toggle('a11y-hc', !!A11Y.hc); h.classList.toggle('a11y-links', !!A11Y.links);
  h.classList.toggle('a11y-font', !!A11Y.font); h.classList.toggle('a11y-still', !!A11Y.still);
  try{ localStorage.setItem('pz_a11y', JSON.stringify(A11Y)); }catch(e){}
}
a11yApply();
function a11ySet(k){
  if(k === 'reset') A11Y = {z: 0, hc: false, links: false, font: false, still: false};
  else if(k === 'z+') A11Y.z = Math.min(3, A11Y.z + 1);
  else if(k === 'z-') A11Y.z = Math.max(0, A11Y.z - 1);
  else A11Y[k] = !A11Y[k];
  a11yApply(); openA11y(true);
}
function openA11y(keep){
  const he = LANG === 'he';
  const b = (k, ic, ar, hb, on) => '<button class="' + (on ? 'on' : '') + '" aria-pressed="' + (on ? 'true' : 'false') + '" onclick="a11ySet(\'' + k + '\')" data-nt><span>' + ic + '</span>' + (he ? hb : ar) + '</button>';
  $('sc').innerHTML = '<div class="ctop"><h3 data-nt>♿ ' + (he ? 'נגישות' : 'إمكانية الوصول') + '</h3><button onclick="closeSheet()" aria-label="סגירה">✕</button></div><div class="cwrap"><div class="a11y-g">' +
    b('z+', '🔍➕', 'تكبير الخط', 'הגדלת טקסט', false) +
    b('z-', '🔍➖', 'تصغير الخط', 'הקטנת טקסט', false) +
    b('hc', '◐', 'تباين عالي', 'ניגודיות גבוהה', A11Y.hc) +
    b('links', '🔗', 'تمييز الروابط', 'הדגשת קישורים', A11Y.links) +
    b('font', 'Aa', 'خط واضح', 'גופן קריא', A11Y.font) +
    b('still', '⏸️', 'إيقاف الحركة', 'עצירת אנימציות', A11Y.still) +
    b('reset', '↺', 'رجوع للأصل', 'איפוס', false) +
    '<button onclick="openA11yStatement()" data-nt><span>📄</span>' + (he ? 'הצהרת נגישות' : 'بيان إمكانية الوصول') + '</button>' +
    '</div>' + (A11Y.z ? '<div class="muted" style="text-align:center;margin-top:10px" data-nt>' + (he ? 'גודל טקסט: ' : 'حجم الخط: ') + (100 + [0, 12, 25, 40][A11Y.z]) + '%</div>' : '') + '</div>';
  $('ft').innerHTML = '<button class="cta" onclick="closeSheet()" data-nt>' + (he ? 'סגירה' : 'تمام') + '</button>';
  cur = null; if(!keep) show();
}
function openA11yStatement(){
  const he = LANG === 'he', A = SET.a11y || {}, nm = esc(LX(SET, 'name'));
  const who = [A.name, A.phone ? '<span class="ltr">' + esc(A.phone) + '</span>' : '', A.email ? '<span class="ltr">' + esc(A.email) + '</span>' : ''].filter(Boolean).join(' · ');
  const body = he
    ? '<p>' + nm + ' רואה חשיבות רבה במתן שירות שוויוני לכלל הלקוחות, ובכלל זה לאנשים עם מוגבלות, ופועלת להנגיש את האתר בהתאם לתקנות שוויון זכויות לאנשים עם מוגבלות (התאמות נגישות לשירות), התשע״ג-2013, ולתקן הישראלי 5568 ברמה AA.</p>' +
      '<h4>מה הונגש באתר</h4><ul><li>תפריט נגישות: הגדלת טקסט, ניגודיות גבוהה, הדגשת קישורים, גופן קריא ועצירת אנימציות.</li><li>ניווט מלא במקלדת (Tab, Enter, Esc) וסימון פוקוס ברור.</li><li>קישור "דלג לתוכן", תיאורים לתמונות ולכפתורים, ותמיכה בקוראי מסך.</li><li>האתר מותאם לנייד ולהגדלה עד 500%.</li></ul>' +
      '<h4>מגבלות ידועות</h4><p>חלק מהתמונות של המנות ומפת המשלוחים עשויים לא להיות נגישים במלואם. אפשר תמיד להזמין בטלפון.</p>' +
      '<h4>נתקלתם בבעיה?</h4><p>נשמח לשמוע ולתקן. רכז/ת הנגישות: ' + (who || '<span class="ltr">0' + esc(String(SET.phone || '').slice(3)) + '</span>') + '</p>' +
      '<p class="muted">עודכן לאחרונה: ' + esc(A.date || '10/2026') + '</p>'
    : '<p>' + nm + ' بيهمّه يعطي خدمة متساوية لكل الزباين، ومنهم الأشخاص مع إعاقة. عشان هيك منعمل على إتاحة الموقع حسب أنظمة المساواة بالحقوق للأشخاص مع إعاقة (התאמות נגישות לשירות) 2013، والمعيار الإسرائيلي 5568 بمستوى AA.</p>' +
      '<h4>شو عملنا بالموقع</h4><ul><li>قائمة إتاحة: تكبير الخط، تباين عالي، تمييز الروابط، خط واضح، وإيقاف الحركة.</li><li>تنقّل كامل بلوحة المفاتيح (Tab، Enter، Esc) مع تحديد واضح للعنصر.</li><li>رابط "تخطّى للمحتوى"، وأوصاف للصور والأزرار، ودعم قارئات الشاشة.</li><li>الموقع مناسب للتلفون وللتكبير حتى 500%.</li></ul>' +
      '<h4>قيود معروفة</h4><p>ممكن بعض صور الأكل وخريطة التوصيل ما تكون متاحة بشكل كامل. بتقدر دايماً تطلب بالتلفون.</p>' +
      '<h4>واجهتك مشكلة؟</h4><p>بنحب نسمع ونصلّح. مسؤول الإتاحة: ' + (who || '<span class="ltr">0' + esc(String(SET.phone || '').slice(3)) + '</span>') + '</p>' +
      '<p class="muted">آخر تحديث: ' + esc(A.date || '10/2026') + '</p>';
  $('sc').innerHTML = '<div class="ctop"><h3 data-nt>📄 ' + (he ? 'הצהרת נגישות' : 'بيان إمكانية الوصول') + '</h3><button onclick="openA11y(true)" aria-label="חזרה">→</button></div><div class="cwrap a11y-st" data-nt>' + body + '</div>';
  $('ft').innerHTML = '<button class="cta" onclick="closeSheet()" data-nt>' + (he ? 'סגירה' : 'تمام') + '</button>';
  $('sc').scrollTop = 0;
}
/* لوحة المفاتيح: كل إشي بينكبس بالماوس بينكبس كمان بـ Enter/مسافة، و Esc بيسكّر النافذة */
function a11yMark(root){
  (root && root.querySelectorAll ? root : document).querySelectorAll('[onclick]:not(button):not(a):not(input):not(label):not(select):not(textarea):not(#bg)').forEach(el => {
    if(!el.hasAttribute('tabindex')) el.setAttribute('tabindex', '0');
    if(!el.hasAttribute('role')) el.setAttribute('role', 'button');
  });
}
new MutationObserver(ms => ms.forEach(m => m.addedNodes.forEach(n => { if(n.nodeType === 1){ a11yMark(n); if(n.matches && n.matches('[onclick]')) a11yMark(n.parentNode); } })))
  .observe(document.body, {childList: true, subtree: true});
document.addEventListener('keydown', e => {
  if(e.key === 'Escape' && $('sheet').classList.contains('on')){ closeSheet(); return; }
  const t = e.target;
  if((e.key === 'Enter' || e.key === ' ') && t && t.getAttribute && t.getAttribute('role') === 'button' && t.tagName !== 'BUTTON'){ e.preventDefault(); t.click(); }
});
/* لما تنفتح نافذة بنحط التركيز جواتها، ولما تتسكّر بنرجعه */
let _a11yFocus = null;
const _show0 = show, _close0 = closeSheet;
show = function(){ if(!$('sheet').classList.contains('on')) _a11yFocus = document.activeElement; _show0(); setTimeout(() => { const f = $('sheet').querySelector('button,[href],input,select,textarea,[tabindex="0"]'); if(f) try{ f.focus({preventScroll: true}); }catch(e){} }, 60); };
closeSheet = function(){ try{ $('sc').querySelectorAll('video').forEach(v => v.pause()); $('sc').querySelectorAll('iframe').forEach(f => f.remove()); }catch(e){} _close0(); if(!$('sheet').classList.contains('on') && _a11yFocus && _a11yFocus.focus) try{ _a11yFocus.focus({preventScroll: true}); }catch(e){} };

/* ============ البداية ============ */
function hideSoon(){
  if(splashDone) return;
  if(!(rdy.c && rdy.i && rdy.g && rdy.s)) return;
  setTimeout(hideSplash, Math.max(0, SPLASH_MIN - (Date.now() - splashAt)));
}
function hideSplash(){
  if(splashDone) return;
  splashDone = true;
  const s = $('splash'); s.classList.add('off');
  setTimeout(function(){ s.style.display = 'none'; }, 500);
}
setTimeout(hideSplash, 9000);

boot();
paint();
hideSoon();
setInterval(function(){ if(view === 'me') renderMe(); }, 60000);

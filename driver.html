<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#111111">
<title>🛵 السائق</title>
<link rel="manifest" href="driver.webmanifest">
<link rel="apple-touch-icon" href="driver-icon-180.png">
<link rel="icon" href="driver-icon-192.png">
<meta property="og:type" content="website">
<meta property="og:title" content="السائق — مكسيكاني وبيتسا أم الفحم">
<meta property="og:description" content="توصيلة جديدة على الطريق">
<meta property="og:image" content="https://sambosicamalfham.github.io/og-driver.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:url" content="https://sambosicamalfham.github.io/driver.html">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://sambosicamalfham.github.io/og-driver.jpg">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&family=Heebo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--red:#e3242b;--ink:#141414;--muted:#777;--bg:#f2f0ee;--line:#e7e4e1;--green:#1e8e4e;--blue:#1f7ae0}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:'Cairo',system-ui,sans-serif;background:var(--bg);color:var(--ink);padding-bottom:40px}
html[lang="he"] body{font-family:'Heebo','Cairo',system-ui,sans-serif}
button,input{font-family:inherit}
button{cursor:pointer;border:0}
.ltr{direction:ltr;unicode-bidi:isolate;display:inline-block}
#login{position:fixed;inset:0;display:none;place-items:center;padding:20px;background:#111;z-index:20}
#login .box{background:#fff;border-radius:22px;padding:26px 22px;width:100%;max-width:380px}
#login h1{margin:0 0 4px;font-size:24px;text-align:center}
#login p{margin:0 0 18px;text-align:center;color:var(--muted);font-size:14px}
.inp{width:100%;border:1.5px solid var(--line);border-radius:13px;padding:13px 14px;font-size:16px;margin-bottom:10px;background:#fff}
.btn{border-radius:13px;padding:13px 16px;font-weight:800;font-size:15px;background:#eee;color:var(--ink);display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none}
.btn.red{background:var(--red);color:#fff}.btn.green{background:var(--green);color:#fff}.btn.blue{background:var(--blue);color:#fff}.btn.dark{background:#111;color:#fff}
.btn.full{width:100%}.btn.sm{padding:9px 12px;font-size:13.5px;border-radius:11px}
.btn:disabled{opacity:.5}
.err{background:#fff1f2;color:#a3141a;border-radius:11px;padding:10px;font-size:13.5px;font-weight:700;margin-bottom:10px;display:none}
header{background:#111;color:#fff;padding:14px 16px 0;position:sticky;top:0;z-index:5}
.hrow{display:flex;align-items:center;gap:10px}
.hrow .t{flex:1;font-weight:900;font-size:18px;line-height:1.25}
.hrow .t small{display:block;font-weight:600;font-size:12px;opacity:.6}
.hb{background:rgba(255,255,255,.14);color:#fff;border-radius:10px;padding:7px 11px;font-weight:700;font-size:13px}
.tabs{display:flex;gap:4px;margin-top:12px}
.tab{flex:1;background:none;color:rgba(255,255,255,.55);font-weight:800;font-size:14.5px;padding:11px 4px;border-bottom:3px solid transparent}
.tab.on{color:#fff;border-color:var(--red)}
.tab .n{background:var(--red);color:#fff;border-radius:9px;font-size:11px;padding:1px 7px;margin-inline-start:4px}
main{padding:14px 14px;max-width:640px;margin:0 auto}
.sum{display:flex;gap:8px;margin-bottom:12px}
.sum>div{flex:1;background:#fff;border-radius:14px;padding:10px 12px;text-align:center}
.sum b{display:block;font-size:20px}.sum span{font-size:12px;color:var(--muted)}
.card{background:#fff;border-radius:18px;padding:14px;margin-bottom:12px;box-shadow:0 1px 3px rgba(0,0,0,.05);border-inline-start:6px solid var(--line)}
.card.ready{border-color:var(--green)}.card.mine{border-color:var(--blue)}.card.prep{border-color:#f5b301;opacity:.8}.card.done{border-color:#bbb}
.top{display:flex;align-items:center;gap:10px}
.no{font-size:30px;font-weight:900;line-height:1}
.who{flex:1;min-width:0}.who b{font-size:17px}.who .muted{font-size:12.5px}
.muted{color:var(--muted)}
.pill{display:inline-block;background:#f0eeec;border-radius:9px;padding:2px 9px;font-size:12.5px;font-weight:800}
.pill.g{background:#e6f6ec;color:var(--green)}.pill.a{background:#fff3d6;color:#8a5a00}.pill.b{background:#e8f0fe;color:#174ea6}.pill.r{background:#ffe9eb;color:#b3141b}
.addr{font-size:17px;font-weight:800;margin:10px 0 4px;line-height:1.5}
.note{background:#fff8e1;border-radius:10px;padding:7px 10px;font-size:14px;margin:6px 0;font-weight:700}
.money{margin:10px 0;border-radius:12px;padding:10px 12px;font-weight:900;font-size:17px;display:flex;justify-content:space-between;align-items:center}
.money.due{background:#111;color:#fff}.money.paid{background:#e6f6ec;color:var(--green)}
.acts{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:8px}
.acts .btn{flex-direction:column;gap:2px;font-size:12px;padding:9px 4px}
.acts .btn i{font-style:normal;font-size:20px}
.big{display:grid;gap:8px;margin-top:10px}
details{margin-top:8px}summary{font-weight:800;font-size:13.5px;color:var(--muted);cursor:pointer}
details div{font-size:14px;padding:3px 0}
.empty{text-align:center;color:var(--muted);padding:50px 10px}.empty .e{font-size:50px}
.sec{font-size:15px;margin:16px 4px 8px;color:var(--muted)}
.duty{display:flex;align-items:center;gap:10px;background:#e6f6ec;color:#155e34;border-radius:14px;padding:10px 12px;margin-bottom:12px}
.duty.off{background:#f0eeec;color:#444}.duty.bad{background:#fff1f2;color:#a3141a}.duty small{opacity:.8;font-size:12px}
.snd{display:flex;align-items:center;gap:12px;width:100%;background:#e3242b;color:#fff;border-radius:16px;padding:14px;margin-bottom:12px;font-family:inherit;font-size:15px;animation:sndp 1.4s infinite}
.snd .ic{font-size:30px}.snd small{opacity:.85;font-size:12px}
@keyframes sndp{50%{box-shadow:0 0 0 8px rgba(227,36,43,.25)}}
.inst{display:flex;align-items:center;gap:10px;background:#111;color:#fff;border-radius:16px;padding:11px 12px;margin-bottom:12px}
.inst .ic{font-size:26px}.inst small{opacity:.7}.inst .x{background:none;color:#fff;opacity:.6;font-size:16px;padding:4px}
#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(120px);background:#111;color:#fff;border-radius:14px;padding:12px 18px;font-weight:800;transition:.3s;z-index:30;max-width:90%}
#toast.on{transform:translateX(-50%) translateY(0)}
#who{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;place-items:center;padding:20px;z-index:25}
#who .box{background:#fff;border-radius:20px;padding:20px;width:100%;max-width:360px}
</style>
</head>
<body>
<div id="login"><div class="box">
  <h1>🛵</h1><p id="lgSub">دخول السائق</p>
  <div class="err" id="lgErr"></div>
  <input class="inp" id="lgEmail" type="tel" inputmode="tel" dir="ltr" placeholder="05xxxxxxxx" autocomplete="username">
  <input class="inp" id="lgPass" type="password" inputmode="numeric" dir="ltr" placeholder="🔑 ••••••" autocomplete="current-password">
  <button class="btn red full" id="lgBtn" onclick="doLogin()">دخول</button>
  <div style="text-align:center;margin-top:12px"><button class="btn sm" onclick="toggleLang()" id="lgLang">עברית</button></div>
</div></div>
<header>
  <div class="hrow">
    <div class="t">🛵 <span id="hName">السائق</span><small id="hShop"></small></div>
    <button class="hb" onclick="toggleLang()" id="hLang">עברית</button>
    <button class="hb" onclick="doLogout()" id="hOut">خروج</button>
  </div>
  <div class="tabs">
    <button class="tab on" data-v="ready" onclick="go('ready')"><span data-t="طلبات">طلبات</span><span class="n" id="nReady" style="display:none"></span></button>
    <button class="tab" data-v="mine" onclick="go('mine')"><span data-t="معي">معي</span><span class="n" id="nMine" style="display:none"></span></button>
  </div>
</header>
<main id="main"><div class="empty"><div class="e">⏳</div></div></main>
<div id="toast"></div>

<script src="firebase-config.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-messaging-compat.js"></script>
<script>
/* ============ صفحة السائق ============
   بيشوف طلبات التوصيل الجاهزة، بياخذها، بيوصل وبيعلّم "وصلت".
   الدخول بنفس حساب اللوحة (أو أي حساب موظف). */
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let LANG = 'ar';
try{ const v = localStorage.getItem('pz_drv_lang'); LANG = v === 'he' || v === 'ar' ? v : (/^he|^iw/i.test(navigator.language || '') ? 'he' : 'ar'); }catch(e){}
const HE = {
  'دخول السائق':'כניסת שליח','دخول':'כניסה','جاري الدخول...':'נכנס...','شو اسمك؟':'מה השם שלך?','بيطلع للمحل مين أخذ الطلب':'המסעדה תראה מי לקח את ההזמנה',
  'الاسم':'שם','حفظ':'שמירה','السائق':'שליח','خروج':'יציאה','جاهزة':'מוכנות','معي':'אצלי','وصلت اليوم':'נמסרו היום',
  'ما في طلبات جاهزة هلأ':'אין הזמנות מוכנות כרגע','بنرنّ لما يجهز طلب':'נשמע צלצול כשהזמנה מוכנה','ما معك طلبات':'אין לך הזמנות',
  'ما وصّلت إشي اليوم':'עוד לא מסרת היום','عم يتحضّروا':'בהכנה','اتصال':'חיוג','واتساب':'וואטסאפ','خريطة':'מפה',
  'أخذت الطلب':'לקחתי את ההזמנה','رجّعها':'החזר','وصلت وقبضت':'נמסר + גביתי','وصلت (مدفوع)':'נמסר (שולם)','وصلت بدون ما يدفع':'נמסר בלי תשלום',
  'لازم تجمع':'לגבות','مدفوع':'שולם','كاش':'מזומן','بطاقة عند الاستلام':'אשראי במסירה','بطاقة أونلاين':'אשראי אונליין',
  'وصّلت':'מסרתי','كاش معك':'מזומן אצלך','بالطريق':'בדרך','أصناف':'פריטים','طلب مسبق':'הזמנה מראש','مع':'אצל',
  'أخذها سائق ثاني':'שליח אחר כבר לקח','تم ✓':'בוצע ✓','قبضت':'גבית','من الزبون؟':'מהלקוח?','طلب جاهز للتوصيل!':'הזמנה מוכנה למשלוח!',
  'هاد الحساب مش موظف — اطلب من صاحب المحل يضيفك':'החשבון הזה לא מוגדר כעובד — בקשו מבעל העסק להוסיף אותך',
  'البريد أو كلمة المرور غلط':'אימייל או סיסמה שגויים','اكتب البريد وكلمة المرور':'כתבו אימייל וסיסמה','ما في اتصال بالإنترنت':'אין חיבור לאינטרנט',
  'مرحبا، أنا السائق من':'שלום, אני השליח של','أنا بالطريق لعندك 🛵':'אני בדרך אליך 🛵','ملاحظة':'הערה','منطقة':'אזור',
  'طلبات':'הזמנות','ما في طلبات هلأ':'אין הזמנות כרגע','بنرنّ لما يوصل طلب':'נשמע צלצול כשמגיעה הזמנה','جاهز':'מוכן','عم يتحضّر':'בהכנה','طلب جديد':'הזמנה חדשה',
  'المحل أعطاك طلب!':'המסעדה העבירה לך הזמנה!','طلب جديد للتوصيل!':'הזמנה חדשה למשלוח!',
  'نزّل صفحة السائق كتطبيق':'התקינו את דף השליח כאפליקציה','بتفتح بكبسة من شاشة التلفون':'נפתח בלחיצה ממסך הטלפון','تنزيل':'התקנה','تم التنزيل':'הותקן',
  'بالآيفون: اكبس زر المشاركة ⬆️ تحت بـ Safari، وبعدين "إضافة إلى الشاشة الرئيسية" ➕':'באייפון: לחצו על כפתור השיתוף ⬆️ למטה ב־Safari, ואז "הוספה למסך הבית" ➕',
  'بالأندرويد: اكبس ⋮ فوق بـ Chrome، وبعدين "تثبيت التطبيق" أو "إضافة إلى الشاشة الرئيسية"':'באנדרואיד: לחצו ⋮ למעלה ב־Chrome, ואז "התקנת האפליקציה" או "הוספה למסך הבית"',
  'الرنّة شغّالة':'הצלצול פועל','اكبس هون لتشغيل الرنّة':'לחצו כאן להפעלת הצלצול','لازم كل مرة بتفتح الصفحة — عشان التلفون يرنّ لما يوصل طلب':'בכל פעם שפותחים את הדף — כדי שהטלפון יצלצל כשמגיעה הזמנה',
  'بلّشت الشغل':'התחלת משמרת','خلّصت الشغل':'סיימת משמרת','خارج الشغل':'לא במשמרת','موقعك مش ظاهر للمحل':'המיקום שלך לא מוצג למסעדה','بلّش الشغل':'התחלת משמרת',
  'لازم تسمح بالموقع':'צריך לאשר מיקום','اكبس 🔒 جنب العنوان فوق ← الموقع ← سماح، وبعدين حدّث الصفحة':'לחצו על 🔒 ליד הכתובת למעלה ← מיקום ← אישור, ואז רעננו את הדף',
  'بالشغل':'במשמרת','موقعك ظاهر للمحل':'המיקום שלך מוצג למסעדה','عم ندوّر على موقعك...':'מחפשים את המיקום שלך...','خلّصت':'סיום',
  'اليوم':'היום','بكرا':'מחר','الإجمالي':'סה״כ','الزبون دفع':'הלקוח שילם',
  'اكتب رقم التلفون والكود':'כתבו טלפון וקוד','رقم التلفون أو الكود غلط':'טלפון או קוד שגויים','حسابك موقّف — احكي مع صاحب المحل':'החשבון שלך מושבת — דברו עם בעל העסק','المحل':'המסעדה'
};
const t = s => (LANG === 'he' && HE[s]) ? HE[s] : s;
function applyLang(){
  document.documentElement.lang = LANG; document.documentElement.dir = 'rtl';
  $('hLang').textContent = $('lgLang').textContent = LANG === 'he' ? 'العربية' : 'עברית';
  $('lgSub').textContent = t('دخول السائق'); $('lgBtn').textContent = t('دخول'); $('hOut').textContent = t('خروج');
  document.querySelectorAll('[data-t]').forEach(el => el.textContent = t(el.dataset.t));
  $('hName').textContent = ME || t('السائق');
}
function toggleLang(){ LANG = LANG === 'he' ? 'ar' : 'he'; try{ localStorage.setItem('pz_drv_lang', LANG); }catch(e){} applyLang(); render(); }
function toast(m){ const el = $('toast'); el.textContent = m; el.classList.add('on'); clearTimeout(toast._t); toast._t = setTimeout(() => el.classList.remove('on'), 2400); }

let auth = null, db = null, SET = {}, ORDERS = [], view = 'ready', ME = '', UID = '', MYPH = '', ROLE = '', first = true, lastReady = new Set();
const DRV_DOMAIN = '@drivers.pizza-app.com';
const normPh = p => { let d = String(p || '').replace(/\D/g, ''); if(d.startsWith('972')) d = '0' + d.slice(3); return d; };

if(typeof firebase === 'undefined' || !window.FB_CONFIG){
  $('login').style.display = 'grid'; $('lgErr').style.display = 'block'; $('lgErr').textContent = t('ما في اتصال بالإنترنت'); $('lgBtn').disabled = true;
}else{
  firebase.initializeApp(window.FB_CONFIG);
  auth = firebase.auth(); db = firebase.firestore();
  auth.onAuthStateChanged(u => { if(u) start(u); else $('login').style.display = 'grid'; });
}
applyLang();
document.addEventListener('keydown', e => { if(e.key === 'Enter' && $('login').style.display === 'grid') doLogin(); });
function doLogin(){
  const raw = $('lgEmail').value.trim(), p = $('lgPass').value.trim();
  const er = $('lgErr'); er.style.display = 'none';
  if(!raw || !p){ er.style.display = 'block'; er.textContent = t('اكتب رقم التلفون والكود'); return; }
  const e = raw.includes('@') ? raw : 'd' + normPh(raw) + DRV_DOMAIN;
  $('lgBtn').disabled = true; $('lgBtn').textContent = t('جاري الدخول...');
  auth.signInWithEmailAndPassword(e, p).catch(x => {
    er.style.display = 'block';
    er.textContent = x.code === 'auth/network-request-failed' ? t('ما في اتصال بالإنترنت') : t('رقم التلفون أو الكود غلط');
    $('lgBtn').disabled = false; $('lgBtn').textContent = t('دخول');
  });
}
async function doLogout(){
  try{ geoStop(); }catch(e){}
  // التلفون ما عاد يرنّ بعد الخروج
  try{ const tk = localStorage.getItem('pz_fcm'); if(tk && UID && ROLE === 'driver') await db.collection('drivers').doc(UID).update({fcm: firebase.firestore.FieldValue.arrayRemove(tk)}); localStorage.removeItem('pz_fcm'); }catch(e){}
  auth.signOut().then(() => location.reload());
}
/* 🔔 إشعارات حقيقية (Firebase) — بترنّ حتى لو الشاشة مسكّرة */
let PUSH_OK = false, _pushBusy = false;
async function registerPush(){
  if(PUSH_OK || _pushBusy) return;
  try{
    if(ROLE !== 'driver' || !SET.vapid || !('Notification' in window) || Notification.permission !== 'granted') return;
    if(!firebase.messaging || (firebase.messaging.isSupported && !firebase.messaging.isSupported())) return;
    _pushBusy = true;
    const reg = await navigator.serviceWorker.register('sw.js'); await navigator.serviceWorker.ready;
    const tok = await firebase.messaging().getToken({vapidKey: SET.vapid, serviceWorkerRegistration: reg});
    if(tok){
      await db.collection('drivers').doc(UID).update({fcm: firebase.firestore.FieldValue.arrayUnion(tok), lang: LANG});
      try{ localStorage.setItem('pz_fcm', tok); }catch(e){}
      PUSH_OK = true; render();
    }
  }catch(e){ console.error('push', e); }
  _pushBusy = false;
}
function denied(msg){
  $('main').innerHTML = '<div class="empty"><div class="e">🔒</div><div>' + esc(t(msg)) + '</div><br><button class="btn" onclick="doLogout()">' + t('خروج') + '</button></div>';
}
/* السائق لازم يكون مفتوح من اللوحة (drivers) — أو موظف */
async function start(u){
  $('login').style.display = 'none'; UID = u.uid;
  try{
    const d = await db.collection('drivers').doc(u.uid).get();
    if(d.exists && d.data().active && !d.data().removed){ ME = d.data().name || ''; MYPH = d.data().phone || ''; ROLE = 'driver'; }
    else if(d.exists){ denied('حسابك موقّف — احكي مع صاحب المحل'); return; }
    else{
      const st = await db.collection('staff').doc(u.uid).get().catch(() => null);
      if(!st || !st.exists){ denied('هاد الحساب مش موظف — اطلب من صاحب المحل يضيفك'); return; }
      ME = t('المحل'); ROLE = 'staff';
    }
  }catch(e){ denied('حسابك موقّف — احكي مع صاحب المحل'); return; }
  applyLang();
  geoStart();
  db.collection('drivers').doc(u.uid).onSnapshot(d => { if(d.exists && (!d.data().active || d.data().removed)) denied('حسابك موقّف — احكي مع صاحب المحل'); }, () => {});
  db.collection('settings').doc('main').onSnapshot(d => { SET = d.exists ? d.data() : {}; $('hShop').textContent = (LANG === 'he' && SET.name_he) || SET.name || ''; registerPush(); });
  db.collection('orders').where('type', '==', 'delivery').where('status', 'in', ['new', 'prep', 'ready']).onSnapshot(s => {
    ORDERS = s.docs.map(d => ({id: d.id, ...d.data()})).sort((a, b) => String(a.createdAtStr).localeCompare(String(b.createdAtStr)));
    const seen = ORDERS.filter(o => !o.driverUid || o.driverUid === UID).map(o => o.id + ':' + (o.driverUid === UID ? 'm' : 'f'));
    const fresh = seen.filter(k => !lastReady.has(k));
    if(!first && fresh.length){ const m = fresh.some(k => k.endsWith(':m')) ? t('المحل أعطاك طلب!') : t('طلب جديد للتوصيل!'); ding(m); toast('🔔 ' + m); }
    lastReady = new Set(seen); first = false;
    render();
  }, err => {
    console.error(err);
    $('main').innerHTML = '<div class="empty"><div class="e">🔒</div><div>' + esc(t('هاد الحساب مش موظف — اطلب من صاحب المحل يضيفك')) + '</div></div>';
  });
  setInterval(render, 60000);
}
const isDel = o => o.type !== 'pickup';
const recent = o => o.createdAtStr && Date.now() - new Date(o.createdAtStr).getTime() < 36 * 3600e3;
const nm = i => LANG === 'he' && i.name_he ? i.name_he : i.name;
const PAY = {cash:'💵 كاش', card:'💳 بطاقة عند الاستلام', bit:'📱 Bit', paybox:'📲 PayBox', online:'🌐 بطاقة أونلاين'};
const payT = k => { const s = PAY[k] || PAY.cash, i = s.indexOf(' '); return s.slice(0, i) + ' ' + t(s.slice(i + 1)); };
const wa = p => { let d = String(p || '').replace(/\D/g, ''); if(d.startsWith('0')) d = '972' + d.slice(1); return d; };
const hm = d => String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
function schedTxt(iso){
  const x = new Date(iso), a = new Date();
  const k = Math.round((new Date(x.getFullYear(), x.getMonth(), x.getDate()) - new Date(a.getFullYear(), a.getMonth(), a.getDate())) / 864e5);
  return (k === 0 ? t('اليوم') : k === 1 ? t('بكرا') : x.getDate() + '/' + (x.getMonth() + 1)) + ' ' + hm(x);
}
function mapUrl(o){
  const c = o.customer || {};
  return c.loc ? 'https://www.google.com/maps/dir/?api=1&destination=' + c.loc[0] + ',' + c.loc[1]
    : 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent((c.addr || '') + ' רהט');
}
function wazeUrl(o){ const c = o.customer || {}; return c.loc ? 'https://waze.com/ul?ll=' + c.loc[0] + ',' + c.loc[1] + '&navigate=yes' : 'https://waze.com/ul?q=' + encodeURIComponent((c.addr || '') + ' רהט') + '&navigate=yes'; }
function go(v){ view = v; document.querySelectorAll('.tab').forEach(b => b.classList.toggle('on', b.dataset.v === v)); render(); window.scrollTo({top: 0}); }

function card(o, mode){
  const c = o.customer || {}, due = !o.paid;
  const items = (o.items || []).filter(i => !i.sub);
  const waMsg = t('مرحبا، أنا السائق من') + ' ' + ((LANG === 'he' && SET.name_he) || SET.name || '') + ' — ' + t('أنا بالطريق لعندك 🛵');
  return `<div class="card ${mode}">
    <div class="top"><div class="no">${o.no ? '#' + esc(o.no) : '🛵'}</div>
      <div class="who"><b>${esc(c.name || '—')}</b><div class="muted ltr">${esc(c.phone || '')}</div></div>
      ${o.driver && mode !== 'ready' ? `<span class="pill b">🛵 ${esc(o.driver)}</span>` : ''}</div>
    <div style="margin-top:8px">${o.status === 'ready' ? `<span class="pill g">✅ ${t('جاهز')}</span>` : o.status === 'prep' ? `<span class="pill a">👨‍🍳 ${t('عم يتحضّر')}</span>` : `<span class="pill r">🆕 ${t('طلب جديد')}</span>`}</div>
    ${c.sched ? `<div style="margin-top:8px"><span class="pill b">⏰ ${t('طلب مسبق')}: ${esc(schedTxt(c.sched))}</span></div>` : ''}
    <div class="addr">📍 ${esc(c.addr || '—')}</div>
    ${c.zone ? `<span class="pill">🗺️ ${esc(c.zone)}</span>` : ''}
    ${o.note ? `<div class="note">📝 ${esc(o.note)}</div>` : ''}
    <div class="money ${due ? 'due' : 'paid'}"><span>${due ? '💰 ' + t('لازم تجمع') : '✅ ' + t('مدفوع')} · ${esc(payT(c.pay))}</span><span class="ltr">₪${Number(o.total || 0).toFixed(2)}</span></div>
    <details open><summary>🧾 ${items.length} ${t('أصناف')}</summary>${(o.items || []).map(i => { const lb = LANG === 'he' && (i.labels_he || []).length ? i.labels_he : (i.labels || []);
      return `<div>${i.sub ? '&nbsp;&nbsp;↳ ' : (Number(i.qty) || 0) + '× '}<b>${esc(nm(i))}</b>${lb.length ? `<br><small class="muted">${esc(lb.join(' · '))}</small>` : ''}${i.note ? `<br><small>📝 ${esc(i.note)}</small>` : ''}</div>`; }).join('')}</details>
    ${mode === 'done' ? '' : `<div class="acts">
      <a class="btn" href="tel:${esc(c.phone || '')}"><i>📞</i>${t('اتصال')}</a>
      <a class="btn" target="_blank" href="https://wa.me/${wa(c.phone)}?text=${encodeURIComponent(waMsg)}"><i>💬</i>${t('واتساب')}</a>
      <a class="btn" target="_blank" href="${mapUrl(o)}"><i>🗺️</i>Google</a>
      <a class="btn" target="_blank" href="${wazeUrl(o)}"><i>🚗</i>Waze</a></div>`}
    ${mode === 'ready' ? `<div class="big"><button class="btn blue full" onclick="take('${o.id}')">🛵 ${t('أخذت الطلب')}</button></div>` : ''}
    ${mode === 'mine' ? `<div class="big">
      ${due ? `<button class="btn green full" onclick="deliver('${o.id}',true)">✅ ${t('وصلت وقبضت')} <span class="ltr">₪${Number(o.total || 0).toFixed(0)}</span></button>
              <button class="btn sm" onclick="deliver('${o.id}',false)">${t('وصلت بدون ما يدفع')}</button>`
            : `<button class="btn green full" onclick="deliver('${o.id}',false)">✅ ${t('وصلت (مدفوع)')}</button>`}
      <button class="btn sm" onclick="untake('${o.id}')">↩️ ${t('رجّعها')}</button></div>` : ''}
    ${mode === 'done' ? `<div class="muted" style="margin-top:6px">✅ ${o.deliveredAt ? hm(new Date(o.deliveredAt)) : ''} ${o.collected ? '· 💰 ' + t('قبضت') : ''}</div>` : ''}
  </div>`;
}
function render(){
  if(!db || first) return;
  const del = ORDERS.filter(o => isDel(o) && recent(o));
  const isMine = o => o.driverUid ? o.driverUid === UID : (o.driver && o.driver === ME);
  const ready = del.filter(o => !o.driverUid && !o.driver);
  const mine = del.filter(o => isMine(o));
  const n1 = $('nReady'), n2 = $('nMine');
  n1.style.display = ready.length ? '' : 'none'; n1.textContent = ready.length;
  n2.style.display = mine.length ? '' : 'none'; n2.textContent = mine.length;
  const sum = '';
  let h = '';
  if(view === 'ready'){
    h = ready.length ? ready.sort((a, b) => String(a.createdAtStr).localeCompare(String(b.createdAtStr))).map(o => card(o, 'ready')).join('')
      : `<div class="empty"><div class="e">😴</div><div>${t('ما في طلبات هلأ')}</div><div class="muted">${t('بنرنّ لما يوصل طلب')}</div></div>`;
  }else{
    h = mine.length ? mine.map(o => card(o, 'mine')).join('') : `<div class="empty"><div class="e">🛵</div><div>${t('ما معك طلبات')}</div></div>`;
  }
  $('main').innerHTML = dutyHtml() + soundHtml() + instHtml() + sum + h;
}
async function take(id){
  const ref = db.collection('orders').doc(id);
  try{
    await db.runTransaction(async tx => {
      const d = await tx.get(ref);
      if(!d.exists) throw new Error('x');
      if(d.data().driverUid && d.data().driverUid !== UID) throw new Error(t('أخذها سائق ثاني'));
      tx.update(ref, {driver: ME, driverUid: UID, driverPhone: MYPH, driverAt: new Date().toISOString()});
    });
    toast(t('تم ✓')); go('mine');
  }catch(e){ toast(e.message === 'x' ? '⚠️' : '⚠️ ' + e.message); }
}
async function untake(id){
  try{ await db.collection('orders').doc(id).update({driver: '', driverUid: '', driverPhone: '', driverAt: ''}); go('ready'); }catch(e){ toast('⚠️ ' + e.message); }
}
async function deliver(id, collected){
  const o = ORDERS.find(x => x.id === id); if(!o) return;
  if(collected && !confirm(t('قبضت') + ' ₪' + Number(o.total || 0).toFixed(2) + ' ' + t('من الزبون؟'))) return;
  const upd = {status: 'done', deliveredAt: new Date().toISOString()};
  if(collected){ upd.paid = true; upd.collected = true; }
  try{
    await db.collection('orders').doc(id).update(upd);
    db.collection('track').doc(id).set({status: 'done'}, {merge: true}).catch(() => {});
    toast(t('تم ✓'));
  }catch(e){ toast('⚠️ ' + e.message); }
}
/* ============ 🔔 الرنّة ============
   المتصفح ما بيسمح بصوت إلا بعد ما السائق يكبس على الصفحة مرة —
   عشان هيك في زر "🔔 شغّل الرنّة" أول الشغل. وبنخلّي الشاشة مضوية عشان الصفحة تضل شغّالة. */
let ACTX = null, SOUND_OK = false, RING_T = null, UNSEEN = false, WAKE = null;
try{ SOUND_OK = sessionStorage.getItem('pz_drv_snd') === '1'; }catch(e){}
function audioUnlock(){
  try{
    if(!ACTX){ const C = window.AudioContext || window.webkitAudioContext; ACTX = new C(); }
    if(ACTX.state === 'suspended') ACTX.resume();
    const b = ACTX.createBuffer(1, 1, 22050), s = ACTX.createBufferSource(); s.buffer = b; s.connect(ACTX.destination); s.start(0);
  }catch(e){}
}
['touchstart', 'click', 'keydown'].forEach(ev => document.addEventListener(ev, () => { audioUnlock(); if(UNSEEN) ack(); }, {passive: true}));
async function wakeOn(){
  try{ if('wakeLock' in navigator && !WAKE){ WAKE = await navigator.wakeLock.request('screen'); WAKE.addEventListener('release', () => { WAKE = null; }); } }catch(e){}
}
document.addEventListener('visibilitychange', () => { if(document.visibilityState === 'visible' && SOUND_OK) wakeOn(); });
async function soundOn(){
  audioUnlock(); SOUND_OK = true; try{ sessionStorage.setItem('pz_drv_snd', '1'); }catch(e){}
  try{ if('Notification' in window && Notification.permission === 'default') await Notification.requestPermission(); }catch(e){}
  wakeOn(); beep(); toast('🔔 ' + t('الرنّة شغّالة')); render(); registerPush(); geoStart();
}
function beep(){
  try{
    if(!ACTX) audioUnlock();
    const ctx = ACTX, now = ctx.currentTime;
    for(let r = 0; r < 3; r++) [0, .18, .36].forEach((x, k) => {
      const at = now + r * .9 + x, o = ctx.createOscillator(), g = ctx.createGain();
      o.type = 'square'; o.frequency.value = k === 1 ? 1320 : 990; o.connect(g); g.connect(ctx.destination);
      g.gain.setValueAtTime(0, at); g.gain.linearRampToValueAtTime(.5, at + .02); g.gain.exponentialRampToValueAtTime(.001, at + .16);
      o.start(at); o.stop(at + .17);
    });
  }catch(e){}
  try{ navigator.vibrate && navigator.vibrate([400, 150, 400, 150, 400]); }catch(e){}
}
/* بترنّ كل 15 ثانية لحد ما السائق يكبس على الشاشة */
function ding(msg){
  UNSEEN = true; beep();
  clearInterval(RING_T); RING_T = setInterval(() => { if(UNSEEN) beep(); else clearInterval(RING_T); }, 15000);
  try{
    if('Notification' in window && Notification.permission === 'granted' && navigator.serviceWorker)
      navigator.serviceWorker.ready.then(r => r.showNotification('🛵 ' + (msg || t('طلب جديد للتوصيل!')), {body: (SET.name || ''), tag: 'pz-order', renotify: true, requireInteraction: true, vibrate: [400, 150, 400, 150, 400], icon: 'icon-192.png', badge: 'icon-192.png', data: {url: location.href}}));
  }catch(e){}
}
function ack(){ UNSEEN = false; clearInterval(RING_T); try{ navigator.serviceWorker && navigator.serviceWorker.ready.then(r => r.getNotifications({tag: 'pz-order'}).then(ns => ns.forEach(n => n.close()))); }catch(e){} }
function soundHtml(){
  if(SOUND_OK && (PUSH_OK || !SET.vapid || ROLE !== 'driver' || !('Notification' in window) || Notification.permission === 'denied')) return '';
  return `<button class="snd" onclick="soundOn()"><span class="ic">🔔</span><span style="flex:1;text-align:start"><b>${t('اكبس هون لتشغيل الرنّة')}</b><br><small>${t('لازم كل مرة بتفتح الصفحة — عشان التلفون يرنّ لما يوصل طلب')}</small></span></button>`;
}
/* ============ 📍 مشاركة الموقع مع المحل — وقت الشغل بس ============ */
let GEO_W = null, GEO_LAST = null, GEO_SENT = 0, GEO_ERR = '', ONDUTY = true, GEO_HB = null;
try{ ONDUTY = localStorage.getItem('pz_drv_duty') !== '0'; }catch(e){}
function distM(a, b){
  const R = 6371000, r = x => x * Math.PI / 180, dLa = r(b.lat - a.lat), dLo = r(b.lng - a.lng);
  const h = Math.sin(dLa / 2) ** 2 + Math.cos(r(a.lat)) * Math.cos(r(b.lat)) * Math.sin(dLo / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(h));
}
function geoSend(on){
  if(ROLE !== 'driver' || !UID) return;
  const L = GEO_LAST || {lat: 0, lng: 0, acc: 0};
  GEO_SENT = Date.now();
  db.collection('driverLoc').doc(UID).set({lat: L.lat, lng: L.lng, acc: L.acc, at: new Date().toISOString(), name: ME, on: !!on}).catch(e => console.error('loc', e));
}
function geoStart(){
  if(ROLE !== 'driver' || !ONDUTY || GEO_W != null) return;
  if(!navigator.geolocation){ GEO_ERR = 'err'; render(); return; }
  GEO_W = navigator.geolocation.watchPosition(p => {
    const c = p.coords, pt = {lat: +c.latitude.toFixed(6), lng: +c.longitude.toFixed(6), acc: Math.round(c.accuracy || 0)};
    const moved = !GEO_LAST || distM(GEO_LAST, pt) > 40, wasErr = GEO_ERR;
    GEO_ERR = ''; GEO_LAST = pt;
    if(Date.now() - GEO_SENT > 25000 || (moved && Date.now() - GEO_SENT > 8000)) geoSend(true);
    if(wasErr) render();
  }, e => { GEO_ERR = e.code === 1 ? 'denied' : 'err'; render(); }, {enableHighAccuracy: true, maximumAge: 10000, timeout: 30000});
  clearInterval(GEO_HB); GEO_HB = setInterval(() => { if(ONDUTY && GEO_LAST && Date.now() - GEO_SENT > 55000) geoSend(true); }, 20000);
}
function geoStop(){
  if(GEO_W != null){ try{ navigator.geolocation.clearWatch(GEO_W); }catch(e){} GEO_W = null; }
  clearInterval(GEO_HB); geoSend(false);
}
function setDuty(on){
  ONDUTY = on; try{ localStorage.setItem('pz_drv_duty', on ? '1' : '0'); }catch(e){}
  if(on) geoStart(); else geoStop();
  toast(on ? '🟢 ' + t('بلّشت الشغل') : '🔴 ' + t('خلّصت الشغل')); render();
}
function dutyHtml(){
  if(ROLE !== 'driver') return '';
  if(!ONDUTY) return `<div class="duty off"><span style="flex:1">🔴 <b>${t('خارج الشغل')}</b><br><small>${t('موقعك مش ظاهر للمحل')}</small></span><button class="btn green sm" onclick="setDuty(true)">🟢 ${t('بلّش الشغل')}</button></div>`;
  if(GEO_ERR === 'denied') return `<div class="duty bad"><span style="flex:1">📍 <b>${t('لازم تسمح بالموقع')}</b><br><small>${t('اكبس 🔒 جنب العنوان فوق ← الموقع ← سماح، وبعدين حدّث الصفحة')}</small></span></div>`;
  return `<div class="duty"><span style="flex:1">🟢 <b>${t('بالشغل')}</b><br><small>${GEO_LAST ? t('موقعك ظاهر للمحل') : t('عم ندوّر على موقعك...')}</small></span><button class="btn sm" onclick="setDuty(false)">🔴 ${t('خلّصت')}</button></div>`;
}
if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
/* 📲 تنزيل الصفحة كتطبيق على التلفون */
let instEvt = null;
const isStandalone = () => window.matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
const isIOS = () => /iphone|ipad|ipod/i.test(navigator.userAgent);
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); instEvt = e; render(); });
window.addEventListener('appinstalled', () => { instEvt = null; toast('✓ ' + t('تم التنزيل')); render(); });
function instHtml(){
  if(isStandalone()) return '';
  let off = false; try{ off = localStorage.getItem('pz_drv_inst_off') === '1'; }catch(e){}
  if(off) return '';
  return `<div class="inst"><span class="ic">📲</span><span style="flex:1"><b>${t('نزّل صفحة السائق كتطبيق')}</b><br><small>${t('بتفتح بكبسة من شاشة التلفون')}</small></span>
    <button class="btn red sm" onclick="doInstall()">${t('تنزيل')}</button><button class="x" onclick="instOff()">✕</button></div>`;
}
function instOff(){ try{ localStorage.setItem('pz_drv_inst_off', '1'); }catch(e){} render(); }
async function doInstall(){
  if(instEvt){ instEvt.prompt(); try{ await instEvt.userChoice; }catch(e){} instEvt = null; render(); return; }
  alert(isIOS() ? t('بالآيفون: اكبس زر المشاركة ⬆️ تحت بـ Safari، وبعدين "إضافة إلى الشاشة الرئيسية" ➕')
               : t('بالأندرويد: اكبس ⋮ فوق بـ Chrome، وبعدين "تثبيت التطبيق" أو "إضافة إلى الشاشة الرئيسية"'));
}
</script>

<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#111111">
<title>🛵 السائق</title>
<link rel="manifest" href="driver.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&family=Heebo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--red:#e3242b;--ink:#141414;--muted:#777;--bg:#f2f0ee;--line:#e7e4e1;--green:#1e8e4e;--blue:#1f7ae0}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:'Cairo',system-ui,sans-serif;background:var(--bg);color:var(--ink);padding-bottom:40px}
html[lang="he"] body{font-family:'Heebo','Cairo',system-ui,sans-serif}
button,input{font-family:inherit}
button{cursor:pointer;border:0}
.ltr{direction:ltr;unicode-bidi:isolate;display:inline-block}
#login{position:fixed;inset:0;display:none;place-items:center;padding:20px;background:#111;z-index:20}
#login .box{background:#fff;border-radius:22px;padding:26px 22px;width:100%;max-width:380px}
#login h1{margin:0 0 4px;font-size:24px;text-align:center}
#login p{margin:0 0 18px;text-align:center;color:var(--muted);font-size:14px}
.inp{width:100%;border:1.5px solid var(--line);border-radius:13px;padding:13px 14px;font-size:16px;margin-bottom:10px;background:#fff}
.btn{border-radius:13px;padding:13px 16px;font-weight:800;font-size:15px;background:#eee;color:var(--ink);display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none}
.btn.red{background:var(--red);color:#fff}.btn.green{background:var(--green);color:#fff}.btn.blue{background:var(--blue);color:#fff}.btn.dark{background:#111;color:#fff}
.btn.full{width:100%}.btn.sm{padding:9px 12px;font-size:13.5px;border-radius:11px}
.btn:disabled{opacity:.5}
.err{background:#fff1f2;color:#a3141a;border-radius:11px;padding:10px;font-size:13.5px;font-weight:700;margin-bottom:10px;display:none}
header{background:#111;color:#fff;padding:14px 16px 0;position:sticky;top:0;z-index:5}
.hrow{display:flex;align-items:center;gap:10px}
.hrow .t{flex:1;font-weight:900;font-size:18px;line-height:1.25}
.hrow .t small{display:block;font-weight:600;font-size:12px;opacity:.6}
.hb{background:rgba(255,255,255,.14);color:#fff;border-radius:10px;padding:7px 11px;font-weight:700;font-size:13px}
.tabs{display:flex;gap:4px;margin-top:12px}
.tab{flex:1;background:none;color:rgba(255,255,255,.55);font-weight:800;font-size:14.5px;padding:11px 4px;border-bottom:3px solid transparent}
.tab.on{color:#fff;border-color:var(--red)}
.tab .n{background:var(--red);color:#fff;border-radius:9px;font-size:11px;padding:1px 7px;margin-inline-start:4px}
main{padding:14px 14px;max-width:640px;margin:0 auto}
.sum{display:flex;gap:8px;margin-bottom:12px}
.sum>div{flex:1;background:#fff;border-radius:14px;padding:10px 12px;text-align:center}
.sum b{display:block;font-size:20px}.sum span{font-size:12px;color:var(--muted)}
.card{background:#fff;border-radius:18px;padding:14px;margin-bottom:12px;box-shadow:0 1px 3px rgba(0,0,0,.05);border-inline-start:6px solid var(--line)}
.card.ready{border-color:var(--green)}.card.mine{border-color:var(--blue)}.card.prep{border-color:#f5b301;opacity:.8}.card.done{border-color:#bbb}
.top{display:flex;align-items:center;gap:10px}
.no{font-size:30px;font-weight:900;line-height:1}
.who{flex:1;min-width:0}.who b{font-size:17px}.who .muted{font-size:12.5px}
.muted{color:var(--muted)}
.pill{display:inline-block;background:#f0eeec;border-radius:9px;padding:2px 9px;font-size:12.5px;font-weight:800}
.pill.g{background:#e6f6ec;color:var(--green)}.pill.a{background:#fff3d6;color:#8a5a00}.pill.b{background:#e8f0fe;color:#174ea6}.pill.r{background:#ffe9eb;color:#b3141b}
.addr{font-size:17px;font-weight:800;margin:10px 0 4px;line-height:1.5}
.note{background:#fff8e1;border-radius:10px;padding:7px 10px;font-size:14px;margin:6px 0;font-weight:700}
.money{margin:10px 0;border-radius:12px;padding:10px 12px;font-weight:900;font-size:17px;display:flex;justify-content:space-between;align-items:center}
.money.due{background:#111;color:#fff}.money.paid{background:#e6f6ec;color:var(--green)}
.acts{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:8px}
.acts .btn{flex-direction:column;gap:2px;font-size:12px;padding:9px 4px}
.acts .btn i{font-style:normal;font-size:20px}
.big{display:grid;gap:8px;margin-top:10px}
details{margin-top:8px}summary{font-weight:800;font-size:13.5px;color:var(--muted);cursor:pointer}
details div{font-size:14px;padding:3px 0}
.empty{text-align:center;color:var(--muted);padding:50px 10px}.empty .e{font-size:50px}
.sec{font-size:15px;margin:16px 4px 8px;color:var(--muted)}
#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(120px);background:#111;color:#fff;border-radius:14px;padding:12px 18px;font-weight:800;transition:.3s;z-index:30;max-width:90%}
#toast.on{transform:translateX(-50%) translateY(0)}
#who{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;place-items:center;padding:20px;z-index:25}
#who .box{background:#fff;border-radius:20px;padding:20px;width:100%;max-width:360px}
</style>
</head>
<body>
<div id="login"><div class="box">
  <h1>🛵</h1><p id="lgSub">دخول السائق</p>
  <div class="err" id="lgErr"></div>
  <input class="inp" id="lgEmail" type="email" dir="ltr" placeholder="email" autocomplete="username">
  <input class="inp" id="lgPass" type="password" dir="ltr" placeholder="••••••" autocomplete="current-password">
  <button class="btn red full" id="lgBtn" onclick="doLogin()">دخول</button>
  <div style="text-align:center;margin-top:12px"><button class="btn sm" onclick="toggleLang()" id="lgLang">עברית</button></div>
</div></div>
<div id="who"><div class="box">
  <h3 style="margin:0 0 6px" id="whoT">شو اسمك؟</h3>
  <div class="muted" style="margin-bottom:10px;font-size:13.5px" id="whoS">بيطلع للمحل مين أخذ الطلب</div>
  <input class="inp" id="whoIn" placeholder="الاسم">
  <button class="btn red full" onclick="saveWho()" id="whoB">حفظ</button>
</div></div>
<header>
  <div class="hrow">
    <div class="t">🛵 <span id="hName">السائق</span><small id="hShop"></small></div>
    <button class="hb" onclick="toggleLang()" id="hLang">עברית</button>
    <button class="hb" onclick="askWho()">👤</button>
    <button class="hb" onclick="doLogout()" id="hOut">خروج</button>
  </div>
  <div class="tabs">
    <button class="tab on" data-v="ready" onclick="go('ready')"><span data-t="جاهزة">جاهزة</span><span class="n" id="nReady" style="display:none"></span></button>
    <button class="tab" data-v="mine" onclick="go('mine')"><span data-t="معي">معي</span><span class="n" id="nMine" style="display:none"></span></button>
  </div>
</header>
<main id="main"><div class="empty"><div class="e">⏳</div></div></main>
<div id="toast"></div>

<script src="firebase-config.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
/* ============ صفحة السائق ============
   بيشوف طلبات التوصيل الجاهزة، بياخذها، بيوصل وبيعلّم "وصلت".
   الدخول بنفس حساب اللوحة (أو أي حساب موظف). */
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let LANG = 'ar';
try{ const v = localStorage.getItem('pz_drv_lang'); LANG = v === 'he' || v === 'ar' ? v : (/^he|^iw/i.test(navigator.language || '') ? 'he' : 'ar'); }catch(e){}
const HE = {
  'دخول السائق':'כניסת שליח','دخول':'כניסה','جاري الدخول...':'נכנס...','شو اسمك؟':'מה השם שלך?','بيطلع للمحل مين أخذ الطلب':'המסעדה תראה מי לקח את ההזמנה',
  'الاسم':'שם','حفظ':'שמירה','السائق':'שליח','خروج':'יציאה','جاهزة':'מוכנות','معي':'אצלי','وصلت اليوم':'נמסרו היום',
  'ما في طلبات جاهزة هلأ':'אין הזמנות מוכנות כרגע','بنرنّ لما يجهز طلب':'נשמע צלצול כשהזמנה מוכנה','ما معك طلبات':'אין לך הזמנות',
  'ما وصّلت إشي اليوم':'עוד לא מסרת היום','عم يتحضّروا':'בהכנה','اتصال':'חיוג','واتساب':'וואטסאפ','خريطة':'מפה',
  'أخذت الطلب':'לקחתי את ההזמנה','رجّعها':'החזר','وصلت وقبضت':'נמסר + גביתי','وصلت (مدفوع)':'נמסר (שולם)','وصلت بدون ما يدفع':'נמסר בלי תשלום',
  'لازم تجمع':'לגבות','مدفوع':'שולם','كاش':'מזומן','بطاقة عند الاستلام':'אשראי במסירה','بطاقة أونلاين':'אשראי אונליין',
  'وصّلت':'מסרתי','كاش معك':'מזומן אצלך','بالطريق':'בדרך','أصناف':'פריטים','طلب مسبق':'הזמנה מראש','مع':'אצל',
  'أخذها سائق ثاني':'שליח אחר כבר לקח','تم ✓':'בוצע ✓','قبضت':'גבית','من الزبون؟':'מהלקוח?','طلب جاهز للتوصيل!':'הזמנה מוכנה למשלוח!',
  'هاد الحساب مش موظف — اطلب من صاحب المحل يضيفك':'החשבון הזה לא מוגדר כעובד — בקשו מבעל העסק להוסיף אותך',
  'البريد أو كلمة المرور غلط':'אימייל או סיסמה שגויים','اكتب البريد وكلمة المرور':'כתבו אימייל וסיסמה','ما في اتصال بالإنترنت':'אין חיבור לאינטרנט',
  'مرحبا، أنا السائق من':'שלום, אני השליח של','أنا بالطريق لعندك 🛵':'אני בדרך אליך 🛵','ملاحظة':'הערה','منطقة':'אזור',
  'اليوم':'היום','بكرا':'מחר','الإجمالي':'סה״כ','الزبون دفع':'הלקוח שילם'
};
const t = s => (LANG === 'he' && HE[s]) ? HE[s] : s;
function applyLang(){
  document.documentElement.lang = LANG; document.documentElement.dir = 'rtl';
  $('hLang').textContent = $('lgLang').textContent = LANG === 'he' ? 'العربية' : 'עברית';
  $('lgSub').textContent = t('دخول السائق'); $('lgBtn').textContent = t('دخول'); $('hOut').textContent = t('خروج');
  $('whoT').textContent = t('شو اسمك؟'); $('whoS').textContent = t('بيطلع للمحل مين أخذ الطلب'); $('whoIn').placeholder = t('الاسم'); $('whoB').textContent = t('حفظ');
  document.querySelectorAll('[data-t]').forEach(el => el.textContent = t(el.dataset.t));
  $('hName').textContent = ME || t('السائق');
}
function toggleLang(){ LANG = LANG === 'he' ? 'ar' : 'he'; try{ localStorage.setItem('pz_drv_lang', LANG); }catch(e){} applyLang(); render(); }
function toast(m){ const el = $('toast'); el.textContent = m; el.classList.add('on'); clearTimeout(toast._t); toast._t = setTimeout(() => el.classList.remove('on'), 2400); }

let auth = null, db = null, SET = {}, ORDERS = [], NUMS = {}, view = 'ready', ME = '', first = true, lastReady = new Set();
try{ ME = localStorage.getItem('pz_driver') || ''; }catch(e){}

if(typeof firebase === 'undefined' || !window.FB_CONFIG){
  $('login').style.display = 'grid'; $('lgErr').style.display = 'block'; $('lgErr').textContent = t('ما في اتصال بالإنترنت'); $('lgBtn').disabled = true;
}else{
  firebase.initializeApp(window.FB_CONFIG);
  auth = firebase.auth(); db = firebase.firestore();
  auth.onAuthStateChanged(u => { if(u) start(u); else $('login').style.display = 'grid'; });
}
applyLang();
document.addEventListener('keydown', e => { if(e.key === 'Enter' && $('login').style.display === 'grid') doLogin(); });
function doLogin(){
  const e = $('lgEmail').value.trim(), p = $('lgPass').value;
  const er = $('lgErr'); er.style.display = 'none';
  if(!e || !p){ er.style.display = 'block'; er.textContent = t('اكتب البريد وكلمة المرور'); return; }
  $('lgBtn').disabled = true; $('lgBtn').textContent = t('جاري الدخول...');
  auth.signInWithEmailAndPassword(e, p).catch(x => {
    er.style.display = 'block';
    er.textContent = x.code === 'auth/network-request-failed' ? t('ما في اتصال بالإنترنت') : t('البريد أو كلمة المرور غلط');
    $('lgBtn').disabled = false; $('lgBtn').textContent = t('دخول');
  });
}
function doLogout(){ auth.signOut().then(() => location.reload()); }
function askWho(){ $('whoIn').value = ME; $('who').style.display = 'grid'; setTimeout(() => $('whoIn').focus(), 50); }
function saveWho(){
  const v = $('whoIn').value.trim(); if(!v) return;
  ME = v.slice(0, 30); try{ localStorage.setItem('pz_driver', ME); }catch(e){}
  $('who').style.display = 'none'; applyLang(); render();
}
function start(u){
  $('login').style.display = 'none';
  if(!ME) askWho();
  db.collection('settings').doc('main').onSnapshot(d => { SET = d.exists ? d.data() : {}; $('hShop').textContent = (LANG === 'he' && SET.name_he) || SET.name || ''; });
  db.collection('orders').orderBy('createdAtStr', 'desc').limit(150).onSnapshot(s => {
    ORDERS = s.docs.map(d => ({id: d.id, ...d.data()}));
    computeNums();
    const ready = ORDERS.filter(o => isDel(o) && o.status === 'ready' && !o.driver).map(o => o.id);
    if(!first && ready.some(id => !lastReady.has(id))){ ding(); toast('🔔 ' + t('طلب جاهز للتوصيل!')); }
    lastReady = new Set(ready); first = false;
    render();
  }, err => {
    console.error(err);
    $('main').innerHTML = '<div class="empty"><div class="e">🔒</div><div>' + esc(t('هاد الحساب مش موظف — اطلب من صاحب المحل يضيفك')) + '</div></div>';
  });
  setInterval(render, 60000);
}
const dayKey = s => { const d = new Date(s); return d.getFullYear() + '-' + (d.getMonth() + 1) + '-' + d.getDate(); };
function computeNums(){
  NUMS = {}; const by = {};
  ORDERS.forEach(o => { if(o.createdAtStr) (by[dayKey(o.createdAtStr)] = by[dayKey(o.createdAtStr)] || []).push(o); });
  Object.values(by).forEach(a => { a.sort((x, y) => String(x.createdAtStr).localeCompare(String(y.createdAtStr))); a.forEach((o, i) => NUMS[o.id] = i + 1); });
}
const isDel = o => o.type !== 'pickup';
const today = o => { const s = o.deliveredAt || o.createdAtStr; return s && dayKey(s) === dayKey(new Date().toISOString()); };
const recent = o => o.createdAtStr && Date.now() - new Date(o.createdAtStr).getTime() < 36 * 3600e3;
const nm = i => LANG === 'he' && i.name_he ? i.name_he : i.name;
const PAY = {cash:'💵 كاش', card:'💳 بطاقة عند الاستلام', bit:'📱 Bit', paybox:'📲 PayBox', online:'🌐 بطاقة أونلاين'};
const payT = k => { const s = PAY[k] || PAY.cash, i = s.indexOf(' '); return s.slice(0, i) + ' ' + t(s.slice(i + 1)); };
const wa = p => { let d = String(p || '').replace(/\D/g, ''); if(d.startsWith('0')) d = '972' + d.slice(1); return d; };
const hm = d => String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
function schedTxt(iso){
  const x = new Date(iso), a = new Date();
  const k = Math.round((new Date(x.getFullYear(), x.getMonth(), x.getDate()) - new Date(a.getFullYear(), a.getMonth(), a.getDate())) / 864e5);
  return (k === 0 ? t('اليوم') : k === 1 ? t('بكرا') : x.getDate() + '/' + (x.getMonth() + 1)) + ' ' + hm(x);
}
function mapUrl(o){
  const c = o.customer || {};
  return c.loc ? 'https://www.google.com/maps/dir/?api=1&destination=' + c.loc[0] + ',' + c.loc[1]
    : 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent((c.addr || '') + ' רהט');
}
function wazeUrl(o){ const c = o.customer || {}; return c.loc ? 'https://waze.com/ul?ll=' + c.loc[0] + ',' + c.loc[1] + '&navigate=yes' : 'https://waze.com/ul?q=' + encodeURIComponent((c.addr || '') + ' רהט') + '&navigate=yes'; }
function go(v){ view = v; document.querySelectorAll('.tab').forEach(b => b.classList.toggle('on', b.dataset.v === v)); render(); window.scrollTo({top: 0}); }

function card(o, mode){
  const c = o.customer || {}, due = !o.paid;
  const items = (o.items || []).filter(i => !i.sub);
  const waMsg = t('مرحبا، أنا السائق من') + ' ' + ((LANG === 'he' && SET.name_he) || SET.name || '') + ' — ' + t('أنا بالطريق لعندك 🛵');
  return `<div class="card ${mode}">
    <div class="top"><div class="no">#${NUMS[o.id] || '—'}</div>
      <div class="who"><b>${esc(c.name || '—')}</b><div class="muted ltr">${esc(c.phone || '')}</div></div>
      ${o.driver && mode !== 'ready' ? `<span class="pill b">🛵 ${esc(o.driver)}</span>` : ''}</div>
    ${c.sched ? `<div style="margin-top:8px"><span class="pill b">⏰ ${t('طلب مسبق')}: ${esc(schedTxt(c.sched))}</span></div>` : ''}
    <div class="addr">📍 ${esc(c.addr || '—')}</div>
    ${c.zone ? `<span class="pill">🗺️ ${esc(c.zone)}</span>` : ''}
    ${o.note ? `<div class="note">📝 ${esc(o.note)}</div>` : ''}
    <div class="money ${due ? 'due' : 'paid'}"><span>${due ? '💰 ' + t('لازم تجمع') : '✅ ' + t('مدفوع')} · ${esc(payT(c.pay))}</span><span class="ltr">₪${Number(o.total || 0).toFixed(2)}</span></div>
    <details open><summary>🧾 ${items.length} ${t('أصناف')}</summary>${(o.items || []).map(i => { const lb = LANG === 'he' && (i.labels_he || []).length ? i.labels_he : (i.labels || []);
      return `<div>${i.sub ? '&nbsp;&nbsp;↳ ' : (Number(i.qty) || 0) + '× '}<b>${esc(nm(i))}</b>${lb.length ? `<br><small class="muted">${esc(lb.join(' · '))}</small>` : ''}${i.note ? `<br><small>📝 ${esc(i.note)}</small>` : ''}</div>`; }).join('')}</details>
    ${mode === 'done' ? '' : `<div class="acts">
      <a class="btn" href="tel:${esc(c.phone || '')}"><i>📞</i>${t('اتصال')}</a>
      <a class="btn" target="_blank" href="https://wa.me/${wa(c.phone)}?text=${encodeURIComponent(waMsg)}"><i>💬</i>${t('واتساب')}</a>
      <a class="btn" target="_blank" href="${mapUrl(o)}"><i>🗺️</i>Google</a>
      <a class="btn" target="_blank" href="${wazeUrl(o)}"><i>🚗</i>Waze</a></div>`}
    ${mode === 'ready' ? `<div class="big"><button class="btn blue full" onclick="take('${o.id}')">🛵 ${t('أخذت الطلب')}</button></div>` : ''}
    ${mode === 'mine' ? `<div class="big">
      ${due ? `<button class="btn green full" onclick="deliver('${o.id}',true)">✅ ${t('وصلت وقبضت')} <span class="ltr">₪${Number(o.total || 0).toFixed(0)}</span></button>
              <button class="btn sm" onclick="deliver('${o.id}',false)">${t('وصلت بدون ما يدفع')}</button>`
            : `<button class="btn green full" onclick="deliver('${o.id}',false)">✅ ${t('وصلت (مدفوع)')}</button>`}
      <button class="btn sm" onclick="untake('${o.id}')">↩️ ${t('رجّعها')}</button></div>` : ''}
    ${mode === 'done' ? `<div class="muted" style="margin-top:6px">✅ ${o.deliveredAt ? hm(new Date(o.deliveredAt)) : ''} ${o.collected ? '· 💰 ' + t('قبضت') : ''}</div>` : ''}
  </div>`;
}
function render(){
  if(!db || first) return;
  const del = ORDERS.filter(o => isDel(o) && recent(o));
  const ready = del.filter(o => o.status === 'ready' && !o.driver);
  const prep = del.filter(o => ['new', 'prep'].includes(o.status));
  const mine = del.filter(o => o.status === 'ready' && o.driver && o.driver === ME);
  const n1 = $('nReady'), n2 = $('nMine');
  n1.style.display = ready.length ? '' : 'none'; n1.textContent = ready.length;
  n2.style.display = mine.length ? '' : 'none'; n2.textContent = mine.length;
  const sum = '';
  let h = '';
  if(view === 'ready'){
    h = ready.length ? ready.sort((a, b) => String(a.createdAtStr).localeCompare(String(b.createdAtStr))).map(o => card(o, 'ready')).join('')
      : `<div class="empty"><div class="e">😴</div><div>${t('ما في طلبات جاهزة هلأ')}</div><div class="muted">${t('بنرنّ لما يجهز طلب')}</div></div>`;
    if(prep.length) h += `<div class="sec">👨‍🍳 ${t('عم يتحضّروا')} (${prep.length})</div>` + prep.map(o => card(o, 'prep')).join('');
  }else{
    h = mine.length ? mine.map(o => card(o, 'mine')).join('') : `<div class="empty"><div class="e">🛵</div><div>${t('ما معك طلبات')}</div></div>`;
  }
  $('main').innerHTML = sum + h;
}
async function take(id){
  if(!ME){ askWho(); return; }
  const ref = db.collection('orders').doc(id);
  try{
    await db.runTransaction(async tx => {
      const d = await tx.get(ref);
      if(!d.exists) throw new Error('x');
      if(d.data().driver && d.data().driver !== ME) throw new Error(t('أخذها سائق ثاني'));
      tx.update(ref, {driver: ME, driverAt: new Date().toISOString()});
    });
    toast(t('تم ✓')); go('mine');
  }catch(e){ toast(e.message === 'x' ? '⚠️' : '⚠️ ' + e.message); }
}
async function untake(id){
  try{ await db.collection('orders').doc(id).update({driver: '', driverAt: ''}); go('ready'); }catch(e){ toast('⚠️ ' + e.message); }
}
async function deliver(id, collected){
  const o = ORDERS.find(x => x.id === id); if(!o) return;
  if(collected && !confirm(t('قبضت') + ' ₪' + Number(o.total || 0).toFixed(2) + ' ' + t('من الزبون؟'))) return;
  const upd = {status: 'done', deliveredAt: new Date().toISOString()};
  if(collected){ upd.paid = true; upd.collected = true; }
  try{
    await db.collection('orders').doc(id).update(upd);
    db.collection('track').doc(id).set({status: 'done'}, {merge: true}).catch(() => {});
    loyCount(o);
    toast(t('تم ✓'));
  }catch(e){ toast('⚠️ ' + e.message); }
}
/* نقطة ولاء لما يوصل الطلب — نفس اللوحة */
async function loyCount(o){
  const L = SET.loyalty; if(!L || !L.on || o.lp) return;
  let k = String((o.customer || {}).phone || '').replace(/\D/g, ''); if(k.startsWith('972')) k = '0' + k.slice(3);
  if(!/^0\d{8,9}$/.test(k)) return;
  const every = Number(L.every) || 10, used = !!(o.customer || {}).reward;
  try{
    await db.collection('loyalty').doc(k).set({count: firebase.firestore.FieldValue.increment(used ? 1 - every : 1)}, {merge: true});
    await db.collection('orders').doc(o.id).update({lp: true});
  }catch(e){ console.error('loyalty', e); }
}
function ding(){
  try{
    const C = window.AudioContext || window.webkitAudioContext, ctx = new C();
    [0, .22, .44].forEach(x => { const o = ctx.createOscillator(), g = ctx.createGain(); o.frequency.value = 988; o.connect(g); g.connect(ctx.destination);
      g.gain.setValueAtTime(0, ctx.currentTime + x); g.gain.linearRampToValueAtTime(.35, ctx.currentTime + x + .02);
      g.gain.exponentialRampToValueAtTime(.001, ctx.currentTime + x + .18); o.start(ctx.currentTime + x); o.stop(ctx.currentTime + x + .2); });
  }catch(e){}
  try{ navigator.vibrate && navigator.vibrate([200, 100, 200]); }catch(e){}
}
if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});

# بيرفع قواعد Firestore و Storage لـ Firebase لحاله، كل ما تتغيّر بـ GitHub.
# المفتاح محفوظ بـ Settings ← Secrets ← FIREBASE_SERVICE_ACCOUNT (مش بالكود).
name: Firebase rules

on:
  push:
    branches: [main]
    paths:
      - firestore.rules
      - storage.rules
      - firebase.json
      - .github/workflows/firebase-rules.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Deploy rules
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$SA" ]; then echo "::error::FIREBASE_SERVICE_ACCOUNT secret is missing"; exit 1; fi
          printf '%s' "$SA" > "$RUNNER_TEMP/sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"
          npx -y firebase-tools@13 deploy --only firestore:rules,storage --project pizza-um-elfahem --non-interactive --force
          rm -f "$RUNNER_TEMP/sa.json"
